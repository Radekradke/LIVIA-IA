[pytest]
# `tests` inclui tests/integracao, que exige um Ollama de verdade. Os testes
# de lá se pulam sozinhos sem LIVIA_OLLAMA=1, então a suíte padrão continua
# passando offline numa máquina limpa.
testpaths = tests
asyncio_mode = auto
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
