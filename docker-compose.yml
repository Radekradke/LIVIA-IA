# Livia em servidor. Use:  docker compose up -d
#
# O volume "dados" é o que impede a perda das memórias. Ele sobrevive a
# `docker compose down`, a rebuilds e a reinícios da máquina. Só some se você
# rodar `docker compose down -v` — não faça isso sem ter um backup.

services:
  livia:
    build: .
    restart: unless-stopped
    ports:
      # Só localhost. Quem fala com a internet é o túnel, não esta porta —
      # assim não há porta aberta para varredura de robô.
      - "127.0.0.1:8100:8100"
    volumes:
      - dados:/data
    env_file:
      - .env
    environment:
      LIVIA_DATA_DIR: /data
      LIVIA_HOST: 0.0.0.0
      LIVIA_HTTPS: "1"
      # Dentro da rede do compose o serviço atende pelo nome, não por
      # 127.0.0.1. Só tem efeito com LIVIA_KNOWLEDGE=1 no .env.
      LIVIA_KNOWLEDGE_URL: http://conhecimento:8110
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/saude')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Knowledge Engine: o grafo de entidades e relações. OPCIONAL.
  #
  #     docker compose --profile conhecimento up -d
  #
  # Sem o perfil, ele não é construído nem sobe — e a Livia funciona igual.
  #
  # O volume próprio não é detalhe: reconstruir um grafo custa horas de CPU,
  # e guardá-lo dentro do contêiner efêmero significaria refazer tudo a cada
  # `docker compose up --build`.
  conhecimento:
    build:
      context: .
      dockerfile: Dockerfile.knowledge
    restart: unless-stopped
    # NENHUMA porta publicada. O serviço não tem senha: quem o alcançasse
    # leria o conteúdo dos documentos. Ele é visível só para a Livia, pela
    # rede interna do compose.
    expose:
      - "8110"
    volumes:
      - conhecimento:/data/knowledge
    env_file:
      - .env
    environment:
      LIVIA_KNOWLEDGE_DATA: /data/knowledge
      LIVIA_KNOWLEDGE_HOST: 0.0.0.0
      # Com Ollama noutro contêiner ou no host, ajuste estes dois no .env.
      # host.docker.internal funciona no Docker Desktop; no Linux use o IP
      # da bridge ou ponha o Ollama no mesmo compose.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8110/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles: ["conhecimento"]

  # Túnel do Cloudflare: dá um endereço HTTPS público sem abrir porta nenhuma
  # na VM e sem precisar de domínio próprio.
  #
  # Por que assim, e não abrindo a porta 443 direto: a Oracle tem DUAS camadas
  # de firewall (Security List na nuvem + iptables no sistema), e esquecer a
  # segunda é o erro mais comum de quem sobe algo lá. O túnel sai de dentro
  # para fora, então não esbarra em nenhuma das duas.
  #
  # Para usar: crie o túnel em https://one.dash.cloudflare.com (Zero Trust >
  # Networks > Tunnels), copie o token e ponha em CLOUDFLARE_TUNNEL_TOKEN
  # no .env. Aponte o túnel para  http://livia:8100
  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - livia
    profiles: ["tunel"]

volumes:
  dados:
  conhecimento:
