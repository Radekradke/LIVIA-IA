<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia</title>
<link rel="icon" href="data:,">
<style>
  /* Mesma pedra do painel: mármore negro, latão embutido, ciano correndo
     no veio. Ver o cabeçalho de index.html para a ideia inteira. */
  :root[data-theme="dark"] {
    --fundo: #090c0f; --painel: rgba(24,31,38,.74); --sunk: rgba(6,9,12,.7);
    --linha: rgba(233,238,242,.12); --linha-forte: rgba(85,201,221,.38);
    --texto: #e3eaef; --suave: #9aabb6; --fraco: #7d8e99;
    --luz: #55c9dd; --brilho: #8ee6f3; --latao: #c9a55e; --marmore: #e9eef2;
    --veio: rgba(233,238,242,.40); --pedra-marca: #0b1116;
    --luz-topo: inset 0 1px 0 rgba(190,235,245,.10);
  }
  :root[data-theme="light"] {
    --fundo: #f3f2ef; --painel: rgba(255,255,255,.9); --sunk: rgba(210,210,203,.45);
    --linha: rgba(27,34,40,.14); --linha-forte: rgba(14,116,144,.34);
    --texto: #1b2228; --suave: #55636c; --fraco: #626d75;
    --luz: #0e7490; --brilho: #0a5f76; --latao: #7a5f26; --marmore: #1b2228;
    --veio: rgba(74,85,94,.55); --pedra-marca: #eceae5;
    --luz-topo: inset 0 1px 0 rgba(255,255,255,.9);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    font: 15.5px/1.7 "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
    background: var(--fundo); color: var(--texto); position: relative; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(900px 640px at 20% -10%, rgba(85,201,221,.16), transparent 62%),
      radial-gradient(760px 560px at 82% 110%, rgba(201,165,94,.10), transparent 60%);
  }
  .cartao {
    position: relative; width: 100%; max-width: 392px;
    background: linear-gradient(165deg, var(--painel), rgba(6,9,12,.55));
    border: 1px solid var(--linha-forte); border-radius: 18px; padding: 38px 34px 32px;
    box-shadow: var(--luz-topo), 0 24px 64px rgba(0,0,0,.55), 0 0 44px rgba(43,138,156,.14);
    text-align: center; overflow: hidden;
  }
  /* Um veio atravessa o cartão por trás do conteúdo, saindo pelas duas
     bordas. Veio que começa e termina dentro da caixa vira enfeite; veio
     que atravessa dá a sensação de que a caixa foi cortada da pedra. */
  .cartao::after {
    content: ""; position: absolute; left: -10%; right: -10%; top: 58%;
    height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--veio) 22%,
                var(--brilho) 50%, var(--veio) 78%, transparent);
    opacity: .5;
  }
  .marca { width: 64px; height: 64px; margin: 0 auto 16px; display: block;
           filter: drop-shadow(0 0 20px rgba(85,201,221,.35)); }
  h1 {
    font-size: 27px; font-weight: 600; letter-spacing: .2em; margin: 0 0 4px;
    background: linear-gradient(100deg, var(--marmore) 6%, var(--brilho) 48%, var(--latao) 96%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { color: var(--fraco); font-size: 13px; margin: 0 0 26px;
          letter-spacing: .09em; text-transform: uppercase; }
  input {
    width: 100%; padding: 13px 16px; font: inherit; font-size: 15px; text-align: center;
    letter-spacing: .04em; border: 1px solid var(--linha); border-radius: 12px;
    background: var(--sunk); color: var(--texto); outline: none;
    box-shadow: inset 0 1px 4px rgba(0,0,0,.3); transition: border-color .18s, box-shadow .18s;
  }
  input::placeholder { color: var(--fraco); letter-spacing: .02em; }
  input:focus { border-color: var(--luz); box-shadow: inset 0 1px 4px rgba(0,0,0,.3), 0 0 20px rgba(85,201,221,.26); }
  button {
    width: 100%; margin-top: 11px; padding: 13px; border: 1px solid rgba(142,230,243,.34);
    border-radius: 12px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    color: #fff; background: linear-gradient(160deg, #6fdcef, #2b8a9c 44%, #14454f);
    box-shadow: var(--luz-topo), 0 6px 22px rgba(43,138,156,.42);
    transition: transform .16s, filter .16s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.12); }
  button:disabled { opacity: .4; cursor: default; }
  .erro { color: var(--brilho); font-size: 13.5px; min-height: 22px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="cartao">
    <svg class="marca" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <radialGradient id="nucleo" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#8ee6f3" stop-opacity=".8"/>
          <stop offset="1" stop-color="#55c9dd" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path d="M24 3.5 41.5 13.5v21L24 44.5 6.5 34.5v-21z" fill="var(--pedra-marca)"
            stroke="var(--latao)" stroke-opacity=".6" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="url(#nucleo)"/>
      <path d="M9 27 C 15 25, 16 19, 21 19 L 27 19 L 30 16 C 34 12, 36 17, 40 15"
            fill="none" stroke="var(--veio)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M21 19 L 21 28 C 21 32, 25 33, 28 33 L 38 33"
            fill="none" stroke="var(--veio)" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="21" cy="19" r="2.1" fill="var(--pedra-marca)"
              stroke="var(--latao)" stroke-width="1"/>
      <circle cx="21" cy="19" r=".9" fill="var(--brilho)"/>
    </svg>
    <h1 id="titulo">LIVIA</h1>
    <p class="sub">acesso restrito</p>
    <input id="senha" type="password" placeholder="senha" autofocus autocomplete="current-password">
    <button id="btn" onclick="entrar()">Entrar</button>
    <div class="erro" id="erro"></div>
  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

if (localStorage.getItem("livia-tema") === "light") {
  document.documentElement.dataset.theme = "light";
}

async function entrar() {
  const senha = $("senha").value;
  if (!senha) return;
  $("btn").disabled = true;
  $("erro").textContent = "";

  try {
    const r = await fetch("/api/entrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ senha }),
    });
    if (r.ok) { location.href = "/"; return; }
    const d = await r.json().catch(() => ({}));
    $("erro").textContent = d.error || "não deu certo";
  } catch {
    $("erro").textContent = "não consegui falar com o servidor";
  }
  $("btn").disabled = false;
  $("senha").select();
}

$("senha").addEventListener("keydown", (e) => {
  if (e.key === "Enter") entrar();
});
</script>
</body>
</html>
