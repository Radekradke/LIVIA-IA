<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia</title>
<link rel="icon" href="data:,">
<style>
  :root[data-theme="dark"] {
    --fundo: #07080f; --painel: rgba(22,24,44,.72); --sunk: rgba(8,9,18,.7);
    --linha: rgba(140,146,217,.22); --linha-forte: rgba(140,146,217,.45);
    --texto: #e6e8f5; --suave: #a7abc6; --fraco: #6d7192;
    --rubi: #8c92d9; --brilho: #b9bdf7; --dourado: #cdbb93; --creme: #e6e8f5;
    --luz-topo: inset 0 1px 0 rgba(200,205,255,.10);
  }
  :root[data-theme="light"] {
    --fundo: #eef0f6; --painel: rgba(251,251,254,.9); --sunk: rgba(214,217,232,.5);
    --linha: rgba(86,92,176,.18); --linha-forte: rgba(86,92,176,.36);
    --texto: #1e2036; --suave: #5a5e7d; --fraco: #9094ad;
    --rubi: #4f55a8; --brilho: #6a70c4; --dourado: #8f7a4e; --creme: #1d1f3a;
    --luz-topo: inset 0 1px 0 rgba(255,255,255,.85);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    font: 15.5px/1.7 "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
    background: var(--fundo); color: var(--texto); position: relative; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(900px 640px at 20% -10%, rgba(140,146,217,.22), transparent 62%),
      radial-gradient(760px 560px at 82% 110%, rgba(143,127,166,.16), transparent 60%);
  }
  .cartao {
    position: relative; width: 100%; max-width: 392px;
    background: linear-gradient(165deg, var(--painel), rgba(8,9,18,.5));
    border: 1px solid var(--linha-forte); border-radius: 20px; padding: 38px 34px 32px;
    box-shadow: var(--luz-topo), 0 24px 64px rgba(0,0,0,.5), 0 0 44px rgba(86,92,176,.16);
    text-align: center;
  }
  .gema { width: 62px; height: 62px; margin: 0 auto 16px; display: block;
          filter: drop-shadow(0 0 18px rgba(140,146,217,.6)); }
  h1 {
    font-size: 27px; font-weight: 600; letter-spacing: .2em; margin: 0 0 4px;
    background: linear-gradient(100deg, var(--creme) 8%, var(--brilho) 50%, var(--dourado));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { color: var(--fraco); font-size: 13px; margin: 0 0 26px;
          letter-spacing: .09em; text-transform: uppercase; }
  input {
    width: 100%; padding: 13px 16px; font: inherit; font-size: 15px; text-align: center;
    letter-spacing: .04em; border: 1px solid var(--linha); border-radius: 12px;
    background: var(--sunk); color: var(--texto); outline: none;
    box-shadow: inset 0 1px 4px rgba(0,0,0,.3); transition: border-color .18s, box-shadow .18s;
  }
  input::placeholder { color: var(--fraco); letter-spacing: .02em; }
  input:focus { border-color: var(--rubi); box-shadow: inset 0 1px 4px rgba(0,0,0,.3), 0 0 20px rgba(140,146,217,.28); }
  button {
    width: 100%; margin-top: 11px; padding: 13px; border: 1px solid rgba(185,189,247,.4);
    border-radius: 12px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    color: #fff; background: linear-gradient(160deg, #7a80d4, #5d63b8 42%, #3a3f8a);
    box-shadow: var(--luz-topo), 0 6px 22px rgba(86,92,176,.45);
    transition: transform .16s, filter .16s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.12); }
  button:disabled { opacity: .4; cursor: default; }
  .erro { color: var(--brilho); font-size: 13.5px; min-height: 22px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="cartao">
    <svg class="gema" viewBox="0 0 48 48" aria-hidden="true">
  <defs>
    <radialGradient id="lCorona" cx=".5" cy=".5" r=".5">
      <stop offset=".52" stop-color="#b9bdf7" stop-opacity="0"/>
      <stop offset=".63" stop-color="#b9bdf7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b9bdf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lLuz" x1=".15" y1=".9" x2=".85" y2=".1">
      <stop offset="0" stop-color="#f3f4ff"/>
      <stop offset=".45" stop-color="#a6abef"/>
      <stop offset="1" stop-color="#2b2d5e"/>
    </linearGradient>
    <radialGradient id="lSombra" cx=".62" cy=".36" r=".62">
      <stop offset="0" stop-color="#0d0f1f"/>
      <stop offset="1" stop-color="#07080f"/>
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="22" fill="url(#lCorona)"/>
  <circle cx="24" cy="24" r="13.4" fill="url(#lLuz)"/>
  <circle cx="26.9" cy="21.6" r="12.9" fill="url(#lSombra)"/>
  <ellipse cx="24" cy="24" rx="21" ry="6.2" transform="rotate(-22 24 24)"
           fill="none" stroke="#b9bdf7" stroke-opacity=".5" stroke-width=".8"/>
  <circle cx="40.10" cy="14.36" r="1.5" fill="#f1ead8"/>
  <circle cx="40.10" cy="14.36" r="3.2" fill="#f1ead8" opacity=".16"/>
    </svg>
    <h1 id="titulo">LIVIA</h1>
    <p class="sub">acesso restrito</p>
    <input id="senha" type="password" placeholder="senha" autofocus autocomplete="current-password">
    <button id="btn" onclick="entrar()">Entrar</button>
    <div class="erro" id="erro"></div>
  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

if (localStorage.getItem("livia-tema") === "light") {
  document.documentElement.dataset.theme = "light";
}

async function entrar() {
  const senha = $("senha").value;
  if (!senha) return;
  $("btn").disabled = true;
  $("erro").textContent = "";

  try {
    const r = await fetch("/api/entrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ senha }),
    });
    if (r.ok) { location.href = "/"; return; }
    const d = await r.json().catch(() => ({}));
    $("erro").textContent = d.error || "não deu certo";
  } catch {
    $("erro").textContent = "não consegui falar com o servidor";
  }
  $("btn").disabled = false;
  $("senha").select();
}

$("senha").addEventListener("keydown", (e) => {
  if (e.key === "Enter") entrar();
});
</script>
</body>
</html>
