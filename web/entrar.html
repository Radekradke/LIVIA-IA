<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia</title>
<link rel="icon" href="/icones/livia.svg">
<meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)">
<style>
  /* Mesma identidade da aplicação — Mnemosyne. Uma tela de login com outro
     visual é a primeira coisa que a pessoa vê, e daria a impressão de que ela
     entrou no lugar errado. Os tokens são os mesmos do index.html, só a parte
     que esta tela usa. */
  @font-face {
    font-family: "Geist"; src: url("/fontes/geist.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Geist Mono"; src: url("/fontes/geistmono.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Marcellus"; src: url("/fontes/marcellus.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }

  :root[data-theme="dark"] {
    --fundo: #0f0f0e; --painel: #1a1a18; --sunk: #141412; --marmore: #171715;
    --linha: rgba(237,233,223,.10); --linha-forte: rgba(169,137,90,.40);
    --veio: rgba(237,233,223,.022);
    --texto: #ede9df; --suave: #a29d93; --fraco: #6c6860;
    --bronze: #a9895a; --bronze-fosco: #7a6342; --ambar: #b8924e;
    --metal: linear-gradient(168deg, #8e7248 0%, #7a6342 100%);
    --metal-txt: #f4efe4;
  }
  :root[data-theme="light"] {
    --fundo: #f2efe8; --painel: #faf8f3; --sunk: #eae5db; --marmore: #e5e0d6;
    --linha: rgba(36,35,33,.13); --linha-forte: rgba(154,123,79,.44);
    --veio: rgba(36,35,33,.016);
    --texto: #242321; --suave: #716d65; --fraco: #9a958b;
    --bronze: #9a7b4f; --bronze-fosco: #7d6440; --ambar: #9c7c37;
    --metal: linear-gradient(168deg, #a98a5c 0%, #8d7148 100%);
    --metal-txt: #fbf8f1;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    font: 15.5px/1.7 "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background: var(--fundo); color: var(--texto);
    position: relative; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Os mesmos veios de mármore da aplicação, quase invisíveis. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(101deg, transparent 14%, var(--veio) 21%, transparent 28%),
      linear-gradient(97deg,  transparent 46%, var(--veio) 52%, transparent 58%),
      radial-gradient(1000px 760px at 22% -12%, var(--veio), transparent 72%);
  }

  /* Placa de pedra: borda fina, canto quase reto, superfície plana. */
  .cartao {
    position: relative; width: 100%; max-width: 380px;
    background: var(--painel);
    border: 1px solid var(--linha-forte); border-radius: 3px;
    padding: 40px 34px 30px; text-align: center;
  }
  /* O pequeno arco: um filete de bronze na nascente da placa. */
  .cartao::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: var(--bronze);
  }

  .medalha { width: 60px; height: 60px; margin: 0 auto 18px; display: block; }
  /* Respira devagar. Um ciclo de 6 segundos — mais rápido vira pisca-pisca. */
  @keyframes medalhao { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
  .chama { animation: medalhao 6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .chama { animation: none; } }

  h1 {
    font-family: "Marcellus", Georgia, serif;
    font-size: 27px; font-weight: 400; letter-spacing: .19em;
    margin: 0 0 6px; color: var(--texto); text-transform: uppercase;
  }
  p.sub {
    color: var(--fraco); font-size: 10px; margin: 0 0 28px;
    letter-spacing: .22em; text-transform: uppercase;
    font-family: "Geist Mono", ui-monospace, monospace;
  }

  input {
    width: 100%; padding: 12px 16px; font: inherit; font-size: 15px;
    text-align: center; letter-spacing: .06em;
    border: 1px solid var(--linha); border-radius: 2px;
    background: var(--sunk); color: var(--texto); outline: none;
    transition: border-color .18s;
  }
  input::placeholder { color: var(--fraco); letter-spacing: .02em; }
  input:focus { border-color: var(--bronze); }

  button {
    width: 100%; margin-top: 10px; padding: 12px;
    border: 1px solid var(--bronze-fosco); border-radius: 3px;
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    color: var(--metal-txt); background: var(--metal);
    transition: filter .18s, transform .18s;
  }
  button:hover:not(:disabled) { filter: brightness(1.09); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  :where(input, button):focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }

  .erro {
    color: var(--ambar); font-size: 13px; min-height: 22px; margin-top: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="cartao">
    <!-- O mesmo medalhão da barra lateral: anel de bronze, chama de mármore. -->
    <svg class="medalha" viewBox="0 0 48 48" aria-hidden="true" fill="none">
      <circle cx="24" cy="24" r="21" stroke="var(--bronze)" stroke-width="1.1"/>
      <circle cx="24" cy="24" r="17.5" stroke="var(--bronze)" stroke-width=".6"
              opacity=".55" stroke-dasharray="2.6 5.2"/>
      <g class="chama">
        <path d="M24 11c5.4 5.2 8 9.4 8 13.4 0 4.7-3.6 8.2-8 8.2s-8-3.5-8-8.2
                 c0-4 2.6-8.2 8-13.4z" fill="var(--texto)" opacity=".9"/>
        <path d="M24 19.5c2.4 2.9 3.5 5 3.5 6.9 0 2.2-1.6 3.8-3.5 3.8
                 s-3.5-1.6-3.5-3.8c0-1.9 1.1-4 3.5-6.9z" fill="var(--painel)"/>
      </g>
      <path d="M17 37h14" stroke="var(--bronze)" stroke-width="1" opacity=".7"/>
    </svg>
    <h1 id="titulo">LIVIA</h1>
    <p class="sub">acesso restrito</p>
    <input id="senha" type="password" placeholder="senha" autofocus autocomplete="current-password">
    <button id="btn" onclick="entrar()">Entrar</button>
    <div class="erro" id="erro"></div>
  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

if (localStorage.getItem("livia-tema") === "light") {
  document.documentElement.dataset.theme = "light";
}

async function entrar() {
  const senha = $("senha").value;
  if (!senha) return;
  $("btn").disabled = true;
  $("erro").textContent = "";

  try {
    const r = await fetch("/api/entrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ senha }),
    });
    if (r.ok) { location.href = "/"; return; }
    const d = await r.json().catch(() => ({}));
    $("erro").textContent = d.error || "não deu certo";
  } catch {
    $("erro").textContent = "não consegui falar com o servidor";
  }
  $("btn").disabled = false;
  $("senha").select();
}

$("senha").addEventListener("keydown", (e) => {
  if (e.key === "Enter") entrar();
});
</script>
</body>
</html>
