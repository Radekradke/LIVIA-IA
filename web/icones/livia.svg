<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Eclipse: uma esfera quase toda na sombra, só a borda acesa, cortada por
       uma órbita fina com uma estrela pequena. É a identidade da Livia e não
       depende do nome — quem trocar LIVIA_NAME continua reconhecendo. -->
  <defs>
    <radialGradient id="lCorona" cx=".5" cy=".5" r=".5">
      <stop offset=".52" stop-color="#b9bdf7" stop-opacity="0"/>
      <stop offset=".63" stop-color="#b9bdf7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b9bdf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lLuz" x1=".15" y1=".9" x2=".85" y2=".1">
      <stop offset="0" stop-color="#f3f4ff"/>
      <stop offset=".45" stop-color="#a6abef"/>
      <stop offset="1" stop-color="#2b2d5e"/>
    </linearGradient>
    <radialGradient id="lSombra" cx=".62" cy=".36" r=".62">
      <stop offset="0" stop-color="#0d0f1f"/>
      <stop offset="1" stop-color="#07080f"/>
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="22" fill="url(#lCorona)"/>
  <circle cx="24" cy="24" r="13.4" fill="url(#lLuz)"/>
  <circle cx="26.9" cy="21.6" r="12.9" fill="url(#lSombra)"/>
  <ellipse cx="24" cy="24" rx="21" ry="6.2" transform="rotate(-22 24 24)"
           fill="none" stroke="#b9bdf7" stroke-opacity=".5" stroke-width=".8"/>
  <circle cx="40.10" cy="14.36" r="1.5" fill="#f1ead8"/>
  <circle cx="40.10" cy="14.36" r="3.2" fill="#f1ead8" opacity=".16"/>
</svg>
