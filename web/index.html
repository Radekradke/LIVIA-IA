<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia</title>
<link rel="icon" href="data:,">
<style>
/* ══════════════════════════════════════════════════════════════════
   LIVIA — tema mármore e circuito

   A ideia que segura tudo: veio de mármore e trilha de circuito são a
   MESMA linha. Os dois ramificam, se bifurcam e correm por dentro de uma
   superfície dura. Então isto não põe "pedra" ao lado de "tecnologia" —
   funde as duas, e faz a luz correr por dentro do veio.

   Três materiais, que já combinam entre si fora da tela:

     mármore negro   o fundo polido, com veio branco atravessando
     latão           o metal embutido na pedra, morno, discreto
     ciano glacial   a energia — a única coisa aqui que emite luz

   O latão nunca disputa com o ciano. Ele aparece em traço fino e em
   detalhe pequeno; quem brilha é sempre a energia. Sem essa hierarquia
   as duas cores se anulam e sobra confusão.
   ══════════════════════════════════════════════════════════════════ */

:root[data-theme="dark"] {
  /* Mármore negro polido. O fundo não é preto puro: pedra tem cor, e o
     azul frio aqui é o que impede a tela de parecer um buraco. */
  --pedra:        #090c0f;
  --pedra-media:  #141a20;
  --pedra-funda:  #05080a;

  /* A energia. Ciano frio, deliberadamente longe do verde — verde é
     "deu certo" na aba Estado, e as duas coisas não podem se parecer. */
  --luz:          #55c9dd;
  --luz-funda:    #2b8a9c;
  --luz-profunda: #14454f;
  --brilho:       #8ee6f3;

  /* Latão embutido. Aparece em fio e em detalhe, nunca em área grande. */
  --latao:        #c9a55e;
  --latao-claro:  #e2c88e;
  --latao-escuro: #96762f;

  --marmore:      #e9eef2;   /* o branco do veio, e o texto de destaque */

  --fundo:        #090c0f;
  --painel:       rgba(20, 26, 32, .72);
  --painel-alto:  rgba(30, 38, 46, .82);
  --sunk:         rgba(6, 9, 12, .68);

  --linha:        rgba(233, 238, 242, .10);
  --linha-forte:  rgba(85, 201, 221, .38);

  --texto:        #e3eaef;
  --texto-suave:  #9aabb6;
  --texto-fraco:  #7d8e99;

  --sombra-baixa: 0 1px 2px rgba(0,0,0,.55);
  --sombra-alta:  0 18px 48px rgba(0,0,0,.62);
  --luz-topo:     inset 0 1px 0 rgba(190,235,245,.10);
  --polido:       linear-gradient(160deg, #6fdcef 0%, #55c9dd 36%, #2b8a9c 72%, #14454f 100%);

  /* A arte de fundo pede a cor ao tema, como o resto da interface. Sem
     isto ela só existiria no escuro — ver o bloco claro abaixo. */
  --art-veio:     #e9eef2;   /* mármore negro tem veio branco */
  --art-pedra:    #090c0f;   /* o miolo do ilhó, da cor da pedra */
  --art-nuvem:    .016;      /* nuvens de polimento */
}

/* Carrara: a mesma pedra sob luz do dia. Fundo quase branco de leve tom
   quente, veio cinza, e a energia vira ciano profundo — em superfície
   clara o brilho não funciona, então a cor precisa ganhar densidade. */
:root[data-theme="light"] {
  --pedra:        #f3f2ef;
  --pedra-media:  #e4e3de;
  --pedra-funda:  #d3d2cc;

  --luz:          #0e7490;
  --luz-funda:    #0b5d74;
  --luz-profunda: #08404f;
  --brilho:       #0a5f76;

  --latao:        #7a5f26;
  --latao-claro:  #a4843d;
  --latao-escuro: #6b5423;

  --marmore:      #1b2228;

  --fundo:        #f3f2ef;
  --painel:       rgba(255, 255, 255, .86);
  --painel-alto:  #ffffff;
  --sunk:         rgba(210, 210, 203, .48);

  --linha:        rgba(27, 34, 40, .13);
  --linha-forte:  rgba(14, 116, 144, .34);

  --texto:        #1b2228;
  --texto-suave:  #55636c;
  --texto-fraco:  #626d75;

  --sombra-baixa: 0 1px 2px rgba(20,30,36,.10);
  --sombra-alta:  0 16px 40px rgba(20,30,36,.16);
  --luz-topo:     inset 0 1px 0 rgba(255,255,255,.9);
  --polido:       linear-gradient(160deg, #1594b4 0%, #0e7490 42%, #08404f 100%);

  /* Carrara tem veio CINZA. Branco sobre pedra clara é o mesmo que nada:
     conferido no navegador, a arte inteira sumia. E a opacidade da nuvem
     sobe porque tom claro sobre tom claro precisa de mais presença para
     ser percebido. */
  --art-veio:     #4a555e;
  --art-pedra:    #f3f2ef;
  --art-nuvem:    .05;
}

:root { --raio: 14px; --raio-p: 10px;
  --sans: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
  --serif: "Iowan Old Style", Georgia, serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  font-family: var(--sans);
  font-size: 15.5px;
  line-height: 1.7;
  color: var(--texto);
  background: var(--fundo);
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Luz ambiente: dois focos difusos, ciano e latão, fixos. Gradiente é barato —
   o mesmo efeito com partículas animadas travaria máquina modesta. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1100px 720px at 12% -8%,  rgba(85,201,221,.20), transparent 62%),
    radial-gradient(900px 640px at 88% 108%, rgba(201,165,94,.14), transparent 60%),
    radial-gradient(700px 520px at 62% 42%,  rgba(43,138,156,.10), transparent 66%);
}
:root[data-theme="light"] body::before { opacity: .5; }

button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::selection { background: rgba(85,201,221,.35); color: var(--marmore); }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(var(--luz-funda), var(--luz-profunda));
  border-radius: 6px; border: 3px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: linear-gradient(var(--luz), var(--luz-funda)); background-clip: padding-box; }

/* ─────────────────────── COLUNA ESQUERDA ─────────────────────── */

#sidebar {
  position: relative; z-index: 2;
  width: 274px; flex: none;
  display: flex; flex-direction: column;
  padding: 22px 14px 0;
  background: linear-gradient(178deg, rgba(30,38,46,.55), rgba(18,9,11,.30));
  border-right: 1px solid var(--linha);
  box-shadow: 1px 0 0 rgba(142,230,243,.06), var(--sombra-alta);
}
:root[data-theme="light"] #sidebar {
  background: linear-gradient(178deg, rgba(255,255,255,.9), rgba(247,239,230,.6));
}

.marca { display: flex; align-items: center; gap: 12px; padding: 4px 8px 6px; }
/* No claro a marca é a mesma pedra vista sob outra luz — Carrara, não
   um hexágono preto colado num painel branco. */
.marca-pedra-1 { stop-color: #1e2830; }
.marca-pedra-2 { stop-color: #0e151a; }
.marca-pedra-3 { stop-color: #05080a; }
:root[data-theme="light"] .marca-pedra-1 { stop-color: #ffffff; }
:root[data-theme="light"] .marca-pedra-2 { stop-color: #eceae5; }
:root[data-theme="light"] .marca-pedra-3 { stop-color: #d8d6d0; }
.marca svg { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 0 12px rgba(85,201,221,.55)); }
.marca-txt { min-width: 0; }
.brand {
  /* Caixa alta pelo CSS, não pelo texto: o nome vem do .env e pode ser
     qualquer coisa — a marca continua imponente independente do que for. */
  font-size: 25px; font-weight: 600; letter-spacing: .16em; line-height: 1.1;
  text-transform: uppercase;
  background: linear-gradient(105deg, var(--marmore) 8%, var(--brilho) 46%, var(--latao-claro) 96%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.online {
  display: flex; align-items: center; gap: 6px; margin-top: 3px;
  font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--texto-fraco); font-weight: 600;
}
.online i {
  width: 6px; height: 6px; border-radius: 50%; background: #4ad07f;
  box-shadow: 0 0 8px #4ad07f; animation: pulso 2.6s ease-in-out infinite;
}
@keyframes pulso { 50% { opacity: .35; transform: scale(.8); } }

.btn-new {
  margin: 18px 0 20px; padding: 12px 16px; border-radius: var(--raio);
  background: var(--polido); color: #fff;
  font-size: 14.5px; font-weight: 600; letter-spacing: .02em; text-align: left;
  border: 1px solid rgba(142,230,243,.35);
  box-shadow: var(--luz-topo), 0 6px 20px rgba(43,138,156,.42), var(--sombra-baixa);
  transition: transform .16s, box-shadow .16s, filter .16s;
}
.btn-new:hover { transform: translateY(-1px); filter: brightness(1.1);
  box-shadow: var(--luz-topo), 0 10px 28px rgba(85,201,221,.5); }
.btn-new:active { transform: translateY(0); }

.secao {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--texto-fraco); padding: 0 8px 10px; font-weight: 700;
}

#convos { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px 14px; }
.convo {
  position: relative; display: flex; align-items: center; gap: 6px;
  padding: 9px 12px; margin-bottom: 3px; border-radius: var(--raio-p);
  font-size: 14px; color: var(--texto-suave); line-height: 1.4;
  border: 1px solid transparent; transition: background .16s, color .16s, border-color .16s;
}
.convo:hover { background: var(--sunk); color: var(--texto); border-color: var(--linha); }
.convo.active {
  background: linear-gradient(100deg, rgba(85,201,221,.22), rgba(43,138,156,.06));
  color: var(--texto); border-color: var(--linha-forte);
  box-shadow: var(--luz-topo), 0 0 18px rgba(85,201,221,.16);
}
.convo.active::before {
  content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 2px;
  border-radius: 2px; background: linear-gradient(var(--brilho), var(--luz));
  box-shadow: 0 0 8px var(--luz);
}
.convo span.t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.convo .hora { font-size: 10.5px; color: var(--texto-fraco); flex: none; letter-spacing: .03em; }
.convo .x { opacity: 0; font-size: 17px; line-height: 1; padding: 0 2px; color: var(--texto-fraco); }
.convo:hover .x { opacity: .6; }
.convo .x:hover { opacity: 1; color: var(--brilho); }

.foot {
  padding: 13px 8px 16px; margin-top: auto;
  border-top: 1px solid var(--linha);
  font-size: 11.5px; color: var(--texto-fraco);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.foot button {
  font-size: 11.5px; color: var(--texto-suave); padding: 4px 9px;
  border-radius: 7px; border: 1px solid transparent; transition: all .16s;
}
.foot button:hover { color: var(--marmore); border-color: var(--linha-forte); background: var(--sunk); }

/* ─────────────────────── CENTRO ─────────────────────── */

#main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Veio de mármore atravessando a pedra, atrás da conversa. Opacidade
   baixa de propósito: é atmosfera, não ilustração para ser lida. */
#arte {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: .58; overflow: hidden;
}
#arte svg { width: 100%; height: 100%; }

/* Atributo de SVG embutido não lê var(); por CSS, lê. É por isto que a
   cor da arte é definida aqui e não no markup. */
#arte .veio-stop { stop-color: var(--art-veio); }
#arte .grade-linha { stroke: var(--art-veio); }
#arte .nuvem { fill: var(--art-veio); opacity: var(--art-nuvem); }
#arte .ilhos-corpo { fill: var(--art-pedra); }
#arte .veio-largo, #arte .veio-fino { stroke: url(#veio); }
:root[data-theme="light"] #arte { opacity: .5; }

/* A luz correndo dentro do veio.
   `pathLength="1000"` normaliza o traço: o mesmo dasharray serve para
   caminhos de comprimentos diferentes, e os tempos ficam comparáveis.
   O pulso (26) é bem menor que o vão (974) — luz que corre, não linha
   tracejada girando.
   Os três tempos são primos entre si de propósito. Com 20/30/40 o ciclo
   fecharia junto a cada 120s e o olho acharia o compasso; com 23/31/41
   ele não fecha nunca. */
.pulso {
  stroke-dasharray: 26 974;
  animation: correr linear infinite;
}
.pulso-1 { animation-duration: 23s; }
.pulso-2 { animation-duration: 31s; animation-delay: -9s; }
.pulso-3 { animation-duration: 41s; animation-delay: -17s; }
@keyframes correr { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

/* Os ilhós respiram fora de fase entre si — de novo, para não virar pisca-
   pisca sincronizado. */
@keyframes ilhos { 0%,100% { opacity: .30; } 50% { opacity: .92; } }
.ilhos { animation: ilhos 7s ease-in-out infinite; }
.ilhos:nth-of-type(3n)   { animation-duration: 9.5s;  animation-delay: -2.6s; }
.ilhos:nth-of-type(3n+1) { animation-duration: 12s;   animation-delay: -5.1s; }

/* Quem prefere menos movimento vê a pedra parada, com a luz fixa num ponto
   do veio — não uma tela morta. */
@media (prefers-reduced-motion: reduce) {
  .pulso, .ilhos { animation: none; }
  .pulso { stroke-dashoffset: 640; }
}

/* Sinapses seguem em uso no cérebro do painel de memórias. */
@keyframes respirar { 0%,100% { opacity: .30; } 50% { opacity: .68; } }
.sinapse { animation: respirar 5s ease-in-out infinite; }
.sinapse:nth-of-type(2n) { animation-duration: 6.5s; animation-delay: -1.4s; }
.sinapse:nth-of-type(3n) { animation-duration: 8s;   animation-delay: -3.1s; }

#thread { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 40px 0 8px; }
.wrap { max-width: 736px; margin: 0 auto; padding: 0 34px; }

.msg { margin-bottom: 32px; }
.who {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  margin-bottom: 9px; font-weight: 700; color: var(--texto-fraco);
}
.msg.assistant .who {
  background: linear-gradient(90deg, var(--brilho), var(--latao-claro));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.msg.user .body {
  color: var(--texto-suave);
  border-left: 2px solid var(--linha-forte);
  padding-left: 17px;
}
.body > *:first-child { margin-top: 0; }
.body > *:last-child { margin-bottom: 0; }
.body p { margin: 0 0 14px; }
.body ul, .body ol { margin: 0 0 14px; padding-left: 24px; }
.body li { margin-bottom: 6px; }
.body li::marker { color: var(--luz); }
.body h3 {
  font-family: var(--serif); font-size: 18.5px; font-weight: 400;
  margin: 26px 0 10px; color: var(--marmore);
}
.body code {
  font-family: var(--mono); font-size: .85em;
  background: var(--sunk); color: var(--brilho);
  padding: 2px 7px; border-radius: 6px; border: 1px solid var(--linha);
}
.body pre {
  background: linear-gradient(165deg, rgba(20,26,32,.72), rgba(18,9,11,.86));
  border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 15px 18px; overflow-x: auto; margin: 0 0 14px; line-height: 1.6;
  box-shadow: var(--luz-topo), inset 0 0 40px rgba(43,138,156,.10);
}
:root[data-theme="light"] .body pre { background: linear-gradient(165deg, #ffffff, #f5ebe2); }
.body pre code { background: none; padding: 0; border: none; color: var(--texto); font-size: 13.5px; }
.body blockquote {
  margin: 0 0 14px; padding: 2px 0 2px 17px;
  border-left: 2px solid var(--latao); color: var(--texto-suave); font-style: italic;
}
.body a { color: var(--brilho); text-underline-offset: 3px; }
.body a:hover { color: var(--latao-claro); }

.status {
  font-size: 13px; color: var(--texto-suave); margin-bottom: 11px;
  display: flex; align-items: center; gap: 9px;
}
.status::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--brilho); box-shadow: 0 0 10px var(--brilho);
  animation: pulso 1.3s ease-in-out infinite;
}
.status.fixo::before { animation: none; opacity: .45; }

.fontes {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--linha);
}
.fontes-rot {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--texto-fraco); font-weight: 700; margin-right: 3px;
}
.fontes a, .fontes .fonte-txt {
  font-size: 12px; color: var(--texto-suave); text-decoration: none;
  background: var(--sunk); border: 1px solid var(--linha);
  padding: 4px 12px; border-radius: 999px; white-space: nowrap; transition: all .16s;
}
.fontes a:hover { color: var(--marmore); border-color: var(--linha-forte); box-shadow: 0 0 14px rgba(85,201,221,.24); }

/* Cada ferramenta usada vira uma linha visível na resposta. Ficam à mostra
   de propósito: se ela mexeu num arquivo seu, você precisa saber qual. */
.acoes { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.acao {
  font-size: 12.5px; color: var(--texto-suave); font-family: var(--mono);
  padding: 5px 13px; border-radius: 8px;
  background: var(--sunk); border: 1px solid var(--linha);
  display: flex; align-items: center; gap: 8px;
}
.acao::before { content: "▸"; color: var(--brilho); }
.acao.falhou { color: var(--brilho); border-color: var(--linha-forte); }
.acao.falhou::before { content: ""; }

.learned {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 15px;
  font-size: 12.5px; color: var(--texto-suave);
  background: linear-gradient(100deg, rgba(85,201,221,.20), rgba(201,165,94,.10));
  border: 1px solid var(--linha-forte); border-radius: 999px; padding: 6px 15px;
  box-shadow: var(--luz-topo), 0 0 18px rgba(85,201,221,.16);
}
.learned b { color: var(--marmore); font-weight: 600; }

/* Arquivo criado durante a conversa. Cartao com link, porque "criei o
   relatorio" sem como pegar o relatorio nao entrega nada. */
.arquivo {
  display: flex; align-items: center; gap: 13px; margin-top: 15px;
  padding: 12px 16px; border-radius: var(--raio-p);
  background: linear-gradient(150deg, var(--painel-alto), var(--painel));
  border: 1px solid var(--linha-forte);
  box-shadow: var(--luz-topo), var(--sombra-baixa);
  text-decoration: none; color: inherit; max-width: 380px;
  transition: border-color .16s, box-shadow .16s, transform .16s;
}
.arquivo:hover {
  transform: translateY(-1px); border-color: var(--luz);
  box-shadow: var(--luz-topo), 0 8px 22px rgba(43,138,156,.26);
}
.arquivo .selo {
  flex: none; width: 36px; height: 36px; border-radius: 9px;
  display: grid; place-items: center; font-size: 16px;
  background: var(--sunk); border: 1px solid var(--linha);
}
.arquivo .info { min-width: 0; flex: 1; }
.arquivo .nome {
  font-size: 13.5px; color: var(--marmore); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.arquivo .meta { font-size: 11.5px; color: var(--texto-fraco); margin-top: 2px; }
.arquivo .baixar { flex: none; font-size: 11px; color: var(--brilho); letter-spacing: .1em;
  text-transform: uppercase; font-weight: 700; }

.arq-lista { display: flex; flex-direction: column; gap: 8px; }
.arq { display: flex; align-items: center; gap: 11px; padding: 10px 13px;
  border-radius: var(--raio-p); background: var(--sunk);
  border: 1px solid var(--linha); text-decoration: none; color: inherit;
  transition: border-color .16s, transform .16s; }
.arq:hover { border-color: var(--linha-forte); transform: translateX(2px); }
.arq.copia { opacity: .55; }
.arq .selo { flex: none; font-size: 15px; width: 22px; text-align: center; }
.arq .nome { font-size: 13px; color: var(--texto); flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arq .meta { font-size: 11px; color: var(--texto-fraco); font-family: var(--mono); flex: none; }

.error {
  border-left: 2px solid var(--luz); padding: 12px 17px;
  background: linear-gradient(100deg, rgba(43,138,156,.18), transparent);
  border-radius: 0 var(--raio-p) var(--raio-p) 0;
  color: var(--brilho); font-size: 14.5px; white-space: pre-wrap;
}
.cursor::after {
  content: "▍"; color: var(--brilho); font-weight: 300;
  text-shadow: 0 0 10px var(--luz); animation: piscar 1.1s steps(2) infinite;
}
@keyframes piscar { 50% { opacity: 0; } }

.empty { padding: 52px 0 24px; }
.empty h2 {
  font-family: var(--serif); font-size: 31px; font-weight: 400; margin: 0 0 16px;
  background: linear-gradient(100deg, var(--marmore) 10%, var(--brilho) 62%, var(--latao-claro));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.empty p { color: var(--texto-suave); margin: 0 0 12px; max-width: 54ch; }
.empty code {
  font-family: var(--mono); font-size: .85em; color: var(--brilho);
  background: var(--sunk); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--linha);
}
.empty a { color: var(--brilho); }

/* ─────────────────────── CAIXA DE ENVIO ─────────────────────── */

#composer { position: relative; z-index: 2; padding: 8px 0 26px; }
.box {
  display: flex; gap: 11px; align-items: flex-end;
  padding: 12px 12px 12px 19px; border-radius: 18px;
  background: linear-gradient(165deg, var(--painel-alto), var(--painel));
  border: 1px solid var(--linha-forte);
  box-shadow: var(--luz-topo), var(--sombra-alta), 0 0 26px rgba(43,138,156,.12);
  transition: border-color .2s, box-shadow .2s;
}
.box:focus-within {
  border-color: var(--luz);
  box-shadow: var(--luz-topo), var(--sombra-alta), 0 0 34px rgba(85,201,221,.30);
}
#input {
  flex: 1; border: none; background: none; color: var(--texto);
  font-family: var(--sans); font-size: 15.5px; line-height: 1.6;
  resize: none; outline: none; max-height: 200px; padding: 4px 0;
}
#input::placeholder { color: var(--texto-fraco); }
#send {
  padding: 10px 22px; border-radius: 12px; flex: none;
  background: var(--polido); color: #fff; font-size: 14.5px; font-weight: 600;
  letter-spacing: .02em; border: 1px solid rgba(142,230,243,.4);
  box-shadow: var(--luz-topo), 0 5px 18px rgba(43,138,156,.45);
  transition: transform .16s, filter .16s, box-shadow .16s;
}
#send:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.12);
  box-shadow: var(--luz-topo), 0 9px 26px rgba(85,201,221,.55); }
#send:active:not(:disabled) { transform: translateY(0); }
#send:disabled { opacity: .32; cursor: default; box-shadow: none; }

.hint { font-size: 11.5px; color: var(--texto-fraco); margin-top: 11px; padding-left: 6px; }
.hint code { font-family: var(--mono); color: var(--texto-suave); }

/* ─────────────────────── PAINEL DIREITO ─────────────────────── */

#panel {
  position: relative; z-index: 2;
  width: 348px; flex: none; display: flex; flex-direction: column;
  background: linear-gradient(190deg, rgba(30,38,46,.62), rgba(18,9,11,.42));
  border-left: 1px solid var(--linha);
  box-shadow: -1px 0 0 rgba(142,230,243,.06), var(--sombra-alta);
}
:root[data-theme="light"] #panel {
  background: linear-gradient(190deg, rgba(255,255,255,.92), rgba(247,239,230,.7));
}
#panel.hidden { display: none; }

.tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--linha); }
.tab {
  position: relative; flex: 1; padding: 17px 3px 14px; margin-bottom: -1px;
  font-size: 12.5px; font-weight: 600; letter-spacing: .03em;
  color: var(--texto-fraco); transition: color .16s;
}
.tab:hover { color: var(--texto-suave); }
.tab.active { color: var(--marmore); }
.tab.active::after {
  content: ""; position: absolute; left: 14%; right: 14%; bottom: 0; height: 2px;
  border-radius: 2px; background: linear-gradient(90deg, var(--luz), var(--brilho), var(--latao-claro));
  box-shadow: 0 0 12px var(--luz);
}

#docs { flex: 1; overflow-y: auto; padding: 16px; }

.cerebro { display: flex; justify-content: center; padding: 6px 0 14px; }
.cerebro svg { width: 168px; height: auto; filter: drop-shadow(0 0 18px rgba(85,201,221,.42)); }

.doc {
  background: linear-gradient(160deg, var(--painel-alto), var(--painel));
  border: 1px solid var(--linha); border-radius: var(--raio-p);
  padding: 13px 15px; margin-bottom: 10px; font-size: 13.5px;
  box-shadow: var(--luz-topo), var(--sombra-baixa);
  transition: border-color .16s, box-shadow .16s, transform .16s;
}
.doc:hover {
  border-color: var(--linha-forte); transform: translateY(-1px);
  box-shadow: var(--luz-topo), 0 8px 22px rgba(43,138,156,.22);
}
.doc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.doc-name { font-family: var(--mono); font-size: 11px; color: var(--brilho); letter-spacing: .02em; }
.doc .x { color: var(--texto-fraco); font-size: 16px; line-height: 1; }
.doc .x:hover { color: var(--brilho); }
.doc-desc { margin-top: 6px; line-height: 1.5; color: var(--texto); }
.doc-body { margin-top: 8px; color: var(--texto-suave); white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }

.aviso-livro {
  margin-top: 8px; padding: 8px 11px; border-radius: 8px;
  font-size: 12px; line-height: 1.45; color: var(--brilho);
  background: rgba(43,138,156,.14); border: 1px solid var(--linha-forte);
}

/* Diagnostico. Discreto de proposito: isto e para consultar quando algo
   parece errado, nao um painel para ficar olhando. */
.diag-grupo { margin-bottom: 18px; }
.diag-titulo {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--texto-fraco); font-weight: 700; margin-bottom: 8px;
}
.diag-linha {
  display: flex; align-items: baseline; gap: 9px; padding: 7px 0;
  border-bottom: 1px solid var(--linha); font-size: 13px;
}
.diag-linha:last-child { border-bottom: none; }
.diag-ponto {
  flex: none; width: 7px; height: 7px; border-radius: 50%;
  background: var(--texto-fraco); align-self: center;
}
.diag-ponto.ok { background: #4a9; box-shadow: 0 0 7px rgba(68,153,136,.55); }
.diag-ponto.espera { background: #c93; box-shadow: 0 0 7px rgba(204,153,51,.5); }
.diag-ponto.ruim { background: var(--luz); box-shadow: 0 0 7px rgba(85,201,221,.55); }
.diag-nome { color: var(--texto); flex: none; min-width: 92px; }
.diag-valor {
  color: var(--texto-fraco); font-family: var(--mono); font-size: 11.5px;
  flex: 1; min-width: 0; overflow-wrap: anywhere;
}
.diag-motivo {
  color: var(--brilho); font-size: 11.5px; margin: -2px 0 8px 16px;
  line-height: 1.45;
}
.diag-momento { color: var(--texto-fraco); font-size: 11px; margin-top: 14px; text-align: right; }

.none {
  color: var(--texto-fraco); font-size: 13.5px; text-align: center;
  padding: 34px 16px; line-height: 1.65;
}

.add { border-top: 1px solid var(--linha); padding: 15px 16px 17px; }
.add input, .add textarea {
  width: 100%; margin-bottom: 9px; padding: 10px 13px;
  font-family: var(--sans); font-size: 13.5px;
  border: 1px solid var(--linha); border-radius: var(--raio-p);
  background: var(--sunk); color: var(--texto); outline: none;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.28);
  transition: border-color .16s, box-shadow .16s;
}
.add input::placeholder, .add textarea::placeholder { color: var(--texto-fraco); }
.add input:focus, .add textarea:focus {
  border-color: var(--luz); box-shadow: inset 0 1px 3px rgba(0,0,0,.28), 0 0 16px rgba(85,201,221,.22);
}
.add textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.add button {
  width: 100%; padding: 11px; border-radius: var(--raio-p);
  background: var(--polido); color: #fff; font-size: 13.5px; font-weight: 600;
  border: 1px solid rgba(142,230,243,.32);
  box-shadow: var(--luz-topo), 0 4px 16px rgba(43,138,156,.38);
  transition: transform .16s, filter .16s;
}
.add button:hover { transform: translateY(-1px); filter: brightness(1.1); }

.persona { display: flex; flex-direction: column; height: 100%; }
.persona-ajuda {
  font-size: 12.5px; line-height: 1.6; color: var(--texto-suave);
  margin: 0 0 12px; padding: 12px 14px;
  background: var(--sunk); border: 1px solid var(--linha); border-radius: var(--raio-p);
}
.persona-ajuda b { color: var(--marmore); font-weight: 600; }
#personaTxt {
  flex: 1; min-height: 262px; resize: vertical;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
  padding: 13px 14px; border: 1px solid var(--linha); border-radius: var(--raio-p);
  background: var(--sunk); color: var(--texto); outline: none;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.28);
}
#personaTxt:focus { border-color: var(--luz); box-shadow: inset 0 1px 3px rgba(0,0,0,.28), 0 0 16px rgba(85,201,221,.22); }
.persona-botoes { display: flex; gap: 9px; margin-top: 11px; }
.persona-botoes button {
  flex: 1; padding: 10px; border-radius: var(--raio-p); font-size: 13px; font-weight: 600;
  background: var(--sunk); color: var(--texto-suave); border: 1px solid var(--linha);
  transition: all .16s;
}
.persona-botoes button:hover { color: var(--marmore); border-color: var(--linha-forte); }
.persona-botoes .primario {
  background: var(--polido); color: #fff; border-color: rgba(142,230,243,.32);
  box-shadow: var(--luz-topo), 0 4px 16px rgba(43,138,156,.38);
}
.persona-botoes .primario:hover { color: #fff; filter: brightness(1.1); }
.persona-aviso { font-size: 12.5px; color: var(--brilho); min-height: 20px; margin-top: 10px; text-align: center; }
.backup { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--linha); }

.btn-livro {
  width: 100%; padding: 12px; border-radius: var(--raio-p); font-size: 13.5px; font-weight: 600;
  background: var(--polido); color: #fff; border: 1px solid rgba(142,230,243,.32);
  box-shadow: var(--luz-topo), 0 4px 16px rgba(43,138,156,.38);
  transition: transform .16s, filter .16s;
}
.btn-livro:hover { transform: translateY(-1px); filter: brightness(1.1); }
.livro-status { font-size: 12.5px; margin-top: 10px; text-align: center; min-height: 20px; color: var(--texto-fraco); }
.livro-status.ativo { color: var(--brilho); }
.livro-status.erro { color: var(--brilho); text-align: left; line-height: 1.55; }

@media (max-width: 1080px) {
  #sidebar { display: none; }
  #panel { position: fixed; right: 0; top: 0; bottom: 0; z-index: 30;
           box-shadow: -14px 0 48px rgba(0,0,0,.6); }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="marca">
    <!-- Hexágono: a forma que cristal e ilhó de placa dividem. Um veio o
         atravessa e acende no ilhó — a arte de fundo em miniatura. -->
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="gPedra" x1=".2" y1="0" x2=".8" y2="1">
          <stop class="marca-pedra-1" offset="0"/>
          <stop class="marca-pedra-2" offset=".55"/>
          <stop class="marca-pedra-3" offset="1"/>
        </linearGradient>
        <linearGradient id="gVeio" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"   stop-color="#e9eef2" stop-opacity=".25"/>
          <stop offset=".5"  stop-color="#8ee6f3"/>
          <stop offset="1"   stop-color="#e9eef2" stop-opacity=".25"/>
        </linearGradient>
        <radialGradient id="gNucleo" cx=".5" cy=".5" r=".5">
          <stop offset="0"   stop-color="#e8f6f9"/>
          <stop offset=".45" stop-color="#8ee6f3" stop-opacity=".55"/>
          <stop offset="1"   stop-color="#55c9dd" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- hexágono: a forma que cristal e ilhó de placa dividem -->
      <path d="M24 3.5 41.5 13.5v21L24 44.5 6.5 34.5v-21z" fill="url(#gPedra)"/>
      <path d="M24 3.5 41.5 13.5v21L24 44.5 6.5 34.5v-21z"
            fill="none" stroke="#c9a55e" stroke-opacity=".55" stroke-width="1.1"/>
      <path d="M24 3.5 41.5 13.5 24 23.5 6.5 13.5z" fill="#e9eef2" opacity=".05"/>

      <!-- o veio atravessa e endireita no meio, como trilha -->
      <path d="M9 27 C 15 25, 16 19, 21 19 L 27 19 L 30 16 C 34 12, 36 17, 40 15"
            fill="none" stroke="url(#gVeio)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M21 19 L 21 28 C 21 32, 25 33, 28 33 L 38 33"
            fill="none" stroke="url(#gVeio)" stroke-width="1.1"
            stroke-opacity=".65" stroke-linecap="round"/>

      <circle cx="24" cy="24" r="9" fill="url(#gNucleo)" opacity=".5"/>
      <circle cx="21" cy="19" r="2.1" fill="#05080a" stroke="#c9a55e" stroke-width=".9"/>
      <circle cx="21" cy="19" r=".8" fill="#8ee6f3"/>
    </svg>
    <div class="marca-txt">
      <div class="brand" id="brand">LIVIA</div>

    </div>
  </div>

  <button class="btn-new" onclick="novaConversa()">＋&nbsp;&nbsp;Nova conversa</button>
  <div class="secao">Conversas</div>
  <div id="convos"></div>

  <div class="foot">
    <span id="stats">—</span>
    <span>
      <button onclick="trocarTema()" id="btnTema" title="claro / escuro">claro</button>
      <button onclick="togglePanel()">painel</button>
    </span>
  </div>
</aside>

<main id="main">
  <!-- Veio de mármore que também é trilha de circuito. A linha corre
       orgânica como pedra, endireita em ângulo reto onde vira trilha, e
       ganha ilhós de latão nos encontros. A luz anda por dentro.

       Os ramos DESAGUAM uns nos outros de propósito: veio que só corre
       paralelo vira papel de parede; veio que se encontra vira sistema. -->
  <div id="arte" aria-hidden="true">
    <svg viewBox="0 0 900 620" preserveAspectRatio="xMidYMid slice" fill="none">
      <defs>
        <radialGradient id="polimento" cx=".42" cy=".38" r=".72">
          <stop offset="0"   stop-color="#55c9dd" stop-opacity=".16"/>
          <stop offset=".45" stop-color="#2b8a9c" stop-opacity=".07"/>
          <stop offset="1"   stop-color="#55c9dd" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="veio" x1="0" y1="0" x2="1" y2=".4">
          <stop class="veio-stop" offset="0"   stop-opacity=".10"/>
          <stop class="veio-stop" offset=".38" stop-opacity=".42"/>
          <stop class="veio-stop" offset=".72" stop-opacity=".26"/>
          <stop class="veio-stop" offset="1"   stop-opacity=".06"/>
        </linearGradient>

        <filter id="halo" x="-25%" y="-200%" width="150%" height="500%">
          <feGaussianBlur stdDeviation="3.4"/>
        </filter>

        <pattern id="grade" width="60" height="60" patternUnits="userSpaceOnUse">
          <path class="grade-linha" d="M60 0 H0 V60" stroke-opacity=".05" stroke-width=".6"/>
        </pattern>
      </defs>

      <!-- pedra: nuvens de tom, como mármore polido tem -->
      <rect width="900" height="620" fill="url(#grade)"/>
      <ellipse cx="380" cy="300" rx="470" ry="330" fill="url(#polimento)"/>
      <ellipse class="nuvem" cx="700" cy="140" rx="260" ry="180"/>
      <ellipse class="nuvem" cx="180" cy="520" rx="300" ry="170"/>

      <!-- os veios. mesma geometria repetida três vezes:
           traço largo e difuso (a pedra ao redor do veio),
           traço fino e nítido (o veio),
           traço curto e aceso (a luz correndo dentro dele) -->
      <g id="veios">
        <g stroke="url(#veio)" stroke-width="7" stroke-opacity=".22" filter="url(#halo)">
          <path d="M -20,168 C 120,140 210,206 300,214 L 404,214 L 448,258
                   C 520,330 604,306 690,344 L 920,344"/>
          <path d="M -20,438 C 130,420 206,352 296,362 L 392,362 L 428,326
                   C 508,244 570,306 654,272 L 800,272 L 920,196"/>
          <path d="M 90,640 C 200,570 254,486 356,470 L 472,470 L 516,426
                   C 590,352 664,432 736,442 L 920,486"/>
        </g>

        <g stroke="url(#veio)" stroke-width="1.5" stroke-linecap="round">
          <path d="M -20,168 C 120,140 210,206 300,214 L 404,214 L 448,258
                   C 520,330 604,306 690,344 L 920,344"/>
          <path d="M -20,438 C 130,420 206,352 296,362 L 392,362 L 428,326
                   C 508,244 570,306 654,272 L 800,272 L 920,196"/>
          <path d="M 90,640 C 200,570 254,486 356,470 L 472,470 L 516,426
                   C 590,352 664,432 736,442 L 920,486"/>

          <!-- ramos que desaguam nos outros veios -->
          <path d="M 300,214 C 320,262 286,304 296,362" stroke-opacity=".6"/>
          <path d="M 448,258 L 448,308 C 448,368 496,388 538,398 L 690,398" stroke-opacity=".7"/>
          <path d="M 654,272 C 632,320 658,364 690,398" stroke-opacity=".5"/>
          <path d="M 516,426 L 570,426 L 604,392" stroke-opacity=".55"/>
          <path d="M 128,214 L 176,214 L 208,182" stroke-opacity=".4"/>
          <path d="M 800,272 L 800,320 L 838,344" stroke-opacity=".45"/>
        </g>

        <g class="luz-veio" stroke="var(--brilho)" stroke-width="2.2"
           stroke-linecap="round" filter="url(#halo)">
          <path class="pulso pulso-1" pathLength="1000"
                d="M -20,168 C 120,140 210,206 300,214 L 404,214 L 448,258
                   C 520,330 604,306 690,344 L 920,344"/>
          <path class="pulso pulso-2" pathLength="1000"
                d="M -20,438 C 130,420 206,352 296,362 L 392,362 L 428,326
                   C 508,244 570,306 654,272 L 800,272 L 920,196"/>
          <path class="pulso pulso-3" pathLength="1000"
                d="M 90,640 C 200,570 254,486 356,470 L 472,470 L 516,426
                   C 590,352 664,432 736,442 L 920,486"/>
        </g>
      </g>

      <!-- ilhós de latão nos encontros: onde o veio vira trilha -->
      <g class="ilhoses">
        <g class="ilhos-corpo" stroke="#c9a55e" stroke-width="1.1" stroke-opacity=".55">
          <circle class="ilhos" cx="300" cy="214" r="4.5"/>
          <circle class="ilhos" cx="448" cy="258" r="5.5"/>
          <circle class="ilhos" cx="392" cy="362" r="4"/>
          <circle class="ilhos" cx="428" cy="326" r="4.5"/>
          <circle class="ilhos" cx="516" cy="426" r="5"/>
          <circle class="ilhos" cx="690" cy="398" r="4.5"/>
          <circle class="ilhos" cx="654" cy="272" r="4"/>
          <circle class="ilhos" cx="800" cy="272" r="4.5"/>
          <circle class="ilhos" cx="176" cy="214" r="3.5"/>
          <circle class="ilhos" cx="570" cy="426" r="3.5"/>
        </g>
        <g fill="#8ee6f3">
          <circle class="ilhos" cx="448" cy="258" r="1.6" opacity=".8"/>
          <circle class="ilhos" cx="516" cy="426" r="1.5" opacity=".7"/>
          <circle class="ilhos" cx="300" cy="214" r="1.3" opacity=".6"/>
          <circle class="ilhos" cx="690" cy="398" r="1.3" opacity=".65"/>
        </g>
      </g>
    </svg>
  </div>

  <div id="thread">
    <div class="wrap" id="messages"></div>
  </div>

  <div id="composer">
    <div class="wrap">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Escreva aqui…"></textarea>
        <button id="send" onclick="enviar()">Enviar</button>
      </div>
      <div class="hint">Enter envia · Shift+Enter quebra linha · <code>/ajuda</code> lista os comandos</div>
    </div>
  </div>
</main>

<aside id="panel" class="hidden">
  <div class="tabs">
    <button class="tab active" data-kind="memories" onclick="trocarAba('memories')">Memórias</button>
    <button class="tab" data-kind="skills" onclick="trocarAba('skills')">Skills</button>

    <textarea id="dBody" placeholder="detalhes (opcional)"></textarea>
    <button onclick="salvarDoc()">Adicionar</button>
  </div>
</aside>

<script>
"use strict";

let conversaAtual = null;
let abaAtual = "memories";
let ocupado = false;
let nomeAssistente = "Livia";

const $ = (id) => document.getElementById(id);

/* ---------- markdown mínimo ---------- */
function escapar(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderizar(texto) {
  const blocos = [];
  // Tira blocos de código antes de qualquer outra coisa, para não mexer neles.
  let t = texto.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocos.push(`<pre><code>${escapar(code.replace(/\n$/, ""))}</code></pre>`);
    return `\n@@BLOCO${blocos.length - 1}@@\n`;
  });

  t = escapar(t);
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const linhas = t.split("\n");
  const out = [];
  let lista = null;

  const fecharLista = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };

  for (const linha of linhas) {
    const l = linha.trim();
    if (!l) { fecharLista(); continue; }

    if (/^@@BLOCO\d+@@$/.test(l)) { fecharLista(); out.push(l); continue; }

    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { fecharLista(); out.push(`<h3>${h[2]}</h3>`); continue; }

    if (l.startsWith("&gt;")) {
      fecharLista();
      out.push(`<blockquote>${l.slice(4).trim()}</blockquote>`);
      continue;
    }

    const ul = l.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (lista !== "ul") { fecharLista(); out.push("<ul>"); lista = "ul"; }
      out.push(`<li>${ul[1]}</li>`);
      continue;
    }

    const ol = l.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      if (lista !== "ol") { fecharLista(); out.push("<ol>"); lista = "ol"; }
      out.push(`<li>${ol[1]}</li>`);
      continue;
    }

    fecharLista();
    out.push(`<p>${l}</p>`);
  }
  fecharLista();

  return out.join("").replace(/@@BLOCO(\d+)@@/g, (_, i) => blocos[i]);
}

function mostrarFontes(bolha, rotulo, urls, texto) {

  if (status && !status.classList.contains("fixo")) status.remove();
  if (!urls || !urls.length) return;

  const box = document.createElement("div");
  box.className = "fontes";

  const itens = urls.map((u) => {

    let host = u;
    try { host = new URL(u).hostname.replace(/^www\./, ""); } catch {}
    return `<a href="${escapar(u)}" target="_blank" rel="noopener" title="${escapar(u)}">${escapar(host)}</a>`;
  }).join("");

  bolha.appendChild(box);
  descer();

/* ---------- envio ---------- */
async function enviar() {
  if (ocupado) return;
  const input = $("input");
  const texto = input.value.trim();
  if (!texto) return;

  const inicial = $("messages").querySelector(".empty");
  if (inicial) inicial.remove();

  input.value = "";
  input.style.height = "auto";
  ocupado = true;
  $("send").disabled = true;

  addMensagem("user", texto);

  const bolha = addMensagem("assistant", "");
  const corpo = bolha.querySelector(".body");
  corpo.classList.add("cursor");
  let acumulado = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: texto, conversation_id: conversaAtual }),
    });

    if (!resp.ok || !resp.body) throw new Error("O servidor recusou a requisição.");

    const leitor = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.type === "delta") {
          acumulado += evt.text;
          corpo.innerHTML = renderizar(acumulado);
          descer();
        } else if (evt.type === "acao") {
          mostrarAcao(bolha, evt.texto, evt.falhou);
        } else if (evt.type === "status") {
          mostrarStatus(bolha, evt.text, evt.fixo);
        } else if (evt.type === "file") {
          mostrarArquivo(bolha, evt);
          if (abaAtual === "arquivos") carregarArquivos();
        } else if (evt.type === "livros") {
          mostrarFontes(bolha, "dos seus livros", evt.trechos, true);
        } else if (evt.type === "sources") {
          mostrarFontes(bolha, evt.label, evt.urls);
        } else if (evt.type === "learned") {
          const nomes = evt.memories.map((m) => m.name).join(", ");
          const tag = document.createElement("div");
          tag.className = "learned";
          tag.innerHTML = `✓ memorizei <b>${escapar(nomes)}</b>`;
          bolha.appendChild(tag);
          carregarDocs();
        } else if (evt.type === "done") {
          conversaAtual = evt.conversation_id;
          if (evt.stats) mostrarStats(evt.stats);
          carregarConversas();
        } else if (evt.type === "error") {
          corpo.innerHTML = `<div class="error">${escapar(evt.message)}</div>`;
        }
      }
    }
  } catch (e) {
    corpo.innerHTML = `<div class="error">${escapar(e.message)}</div>`;
  } finally {
    corpo.classList.remove("cursor");
    ocupado = false;
    $("send").disabled = false;
    $("input").focus();
    descer();
  }
}

/* ---------- conversas ---------- */
function quando(iso) {
  // Hoje mostra a hora; ontem diz "ontem"; mais velho, a data curta.
  // Data absoluta em conversa de hoje não ajuda ninguém a se localizar.
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const agora = new Date();
  const dia = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dias = Math.round((dia(agora) - dia(d)) / 86400000);
  if (dias === 0) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (dias === 1) return "ontem";
  if (dias < 7) return `${dias}d`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

function novaConversa() {
  conversaAtual = null;
  vazio();
  carregarConversas();
  $("input").focus();
}

async function carregarConversas() {
  try {
    const r = await fetch("/api/conversations");
    const { conversations } = await r.json();
    if (!conversations.length) {
      $("convos").innerHTML = '<div class="none" style="padding:20px 10px">Nenhuma ainda.</div>';
      return;
    }
    $("convos").innerHTML = conversations.map((c) => `
      <div class="convo ${c.id === conversaAtual ? "active" : ""}">
        <span class="t" onclick="abrirConversa(${c.id})" title="${escapar(c.title)}">${escapar(c.title)}</span>
        <span class="hora">${escapar(quando(c.updated_at))}</span>
        <button class="x" onclick="apagarConversa(${c.id})" title="apagar">×</button>
      </div>`).join("");
  } catch { /* servidor caiu; a lista só fica desatualizada */ }
}

async function abrirConversa(id) {
  const r = await fetch(`/api/conversations/${id}`);
  if (!r.ok) return;
  const { messages } = await r.json();
  conversaAtual = id;
  $("messages").innerHTML = "";
  messages.forEach((m) => addMensagem(m.role === "user" ? "user" : "assistant", m.content));
  carregarConversas();
}

async function apagarConversa(id) {
  await fetch(`/api/conversations/${id}`, { method: "DELETE" });
  if (id === conversaAtual) novaConversa();
  else carregarConversas();
}

           download="${escapar(a.nome)}" title="${escapar(a.caminho)}">

          <span class="nome">${escapar(a.nome)}</span>

/* ---------- diagnostico ---------- */
// Serve para uma pergunta so: "por que ela esta estranha agora?". Provedor
// mudo, disco cheio, livro invalidado — tudo isso da sintoma parecido no
// chat e causa diferente aqui.
function linhaDiag(nome, valor, estado, motivo) {
  const ponto = estado ? ` ${estado}` : "";
  return `
    <div class="diag-linha">
      <span class="diag-ponto${ponto}"></span>
      <span class="diag-nome">${escapar(nome)}</span>
      <span class="diag-valor">${escapar(valor)}</span>
    </div>` + (motivo ? `<div class="diag-motivo">${escapar(motivo)}</div>` : "");
}

function estadoProvedor(p) {
  if (!p.configurado) return ["", "sem chave no .env"];
  if (p.quebrado) return ["ruim", "precisa de conserto"];
  if (!p.disponivel) {
    const s = p.descanso_segundos;
    return ["espera", s ? `descansando ${Math.ceil(s)}s` : "descansando"];
  }
  return ["ok", "pronta"];
}

async function carregarEstado() {
  let d;
  try {
    d = await (await fetch("/api/diagnostico")).json();
  } catch {
    $("docs").innerHTML = `<div class="none">Não consegui ler o estado.</div>`;
    return;
  }

  const provedores = Object.entries(d.provedores || {}).map(([nome, p]) => {
    const [cor, resumo] = estadoProvedor(p);
    // O último erro só aparece quando ainda importa. Erro velho de provedor
    // que já voltou vira ruído e faz duvidar do que está funcionando.
    const motivo = (p.quebrado || (!p.disponivel && p.configurado)) ? p.ultimo_erro : "";
    return linhaDiag(nome, `${p.modelo || "—"} · ${resumo}`, cor, motivo);
  }).join("");

  const ws = d.workspace || {}, banco = d.banco || {}, bib = d.biblioteca || {};
  const mem = d.memoria || {}, fer = d.ferramentas || {};

  const sistema = [
    linhaDiag("pasta", `${ws.pasta || "?"}/ · ${ws.arquivos ?? 0} arquivos`,
              ws.gravavel ? "ok" : "ruim",
              ws.gravavel ? "" : "não consigo escrever aí — nada do que ela criar vai ser salvo"),
    linhaDiag("conversas", banco.conversas == null ? "banco indisponível" : `${banco.conversas} salvas`,
              banco.disponivel ? "ok" : "ruim",
              banco.disponivel ? "" : "o banco não existe; as conversas não estão sendo guardadas"),
    linhaDiag("memória", `${mem.memorias ?? 0} memórias · ${mem.skills ?? 0} skills`, "ok",
              mem.aprende_sozinha ? "" : "aprendizado automático desligado (LIVIA_AUTO_LEARN=0)"),
    linhaDiag("biblioteca", `${bib.documentos ?? 0} livros`,
              bib.invalidos ? "espera" : "ok",
              bib.invalidos ? `${bib.invalidos} com vetores de outro modelo, fora das buscas` : ""),
    linhaDiag("ferramentas", fer.ligadas ? `${fer.quantas} disponíveis` : "desligadas",
              fer.ligadas ? "ok" : ""),
    linhaDiag("web", d.web?.ligada ? "ligada" : "desligada", d.web?.ligada ? "ok" : ""),
    linhaDiag("senha", d.protegido ? "exigida" : "sem senha",
              d.protegido ? "ok" : "espera",
              d.protegido ? "" : "sem LIVIA_PASSWORD ela só atende esta máquina — o que é seguro, mas impede acesso de fora"),
  ].join("");

  $("docs").innerHTML = `
    <p class="persona-ajuda">
      Para quando ela parecer estranha. Provedor mudo, disco cheio e livro
      invalidado dão sintoma parecido no chat e causa diferente aqui.
      Nenhuma chave aparece nesta tela.
    </p>
    <div class="diag-grupo">
      <div class="diag-titulo">provedores</div>
      ${provedores || '<div class="none">Nenhum provedor configurado.</div>'}
    </div>
    <div class="diag-grupo">
      <div class="diag-titulo">sistema</div>
      ${sistema}
    </div>
    <div class="diag-momento">consultado às ${escapar((d.momento || "").slice(11, 19))}</div>`;
}

async function apagarLivro(slug) {
  await fetch(`/api/biblioteca/${encodeURIComponent(slug)}`, { method: "DELETE" });
  carregarLivros();
}

async function enviarLivro(input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  input.value = "";

  const status = $("livroStatus");
  status.className = "livro-status ativo";
  status.textContent = "enviando…";

  try {
    const r = await fetch("/api/biblioteca", {
      method: "POST",
      headers: { "x-nome-arquivo": encodeURIComponent(arquivo.name).replace(/%20/g, " ") },
      body: arquivo,
    });
    if (!r.body) throw new Error("o servidor não respondeu");

    const leitor = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.etapa === "erro") {
          status.className = "livro-status erro";
          status.textContent = evt.texto;
          return;
        }
        if (evt.etapa === "repetido") {
          status.className = "livro-status ativo";
          status.textContent = evt.texto;
          carregarLivros();
          return;
        }
        if (evt.etapa === "pronto") {
          status.className = "livro-status";
          status.textContent = "";
          carregarLivros();
          return;
        }
        status.textContent = evt.texto || evt.etapa;
      }
    }
  } catch (e) {
    status.className = "livro-status erro";
    status.textContent = e.message;
  }
}

      <textarea id="personaTxt" spellcheck="false"></textarea>
      <div class="persona-botoes">
        <button class="primario" onclick="salvarPersona()">Salvar</button>
        <button onclick="restaurarPersona()">Restaurar padrão</button>
      </div>
      <div id="personaAviso" class="persona-aviso"></div>

      <div class="backup">
        <div class="secao" style="padding:0 0 8px">Backup</div>
        <p class="persona-ajuda" style="margin-bottom:10px">
          Baixa memórias, skills, personalidade e conversas num arquivo só.
          Faça isso de vez em quando se estiver rodando em hospedagem
          gratuita — o disco delas costuma ser apagado sem aviso.
        </p>
        <div class="persona-botoes">
          <button onclick="baixarBackup()">Baixar</button>
          <button onclick="$('arqBackup').click()">Restaurar</button>
        </div>
        <input type="file" id="arqBackup" accept=".zip" style="display:none"
               onchange="enviarBackup(this)">
      </div>
    </div>`;
  $("personaTxt").value = text;
}

function avisarPersona(msg) {
  const el = $("personaAviso");
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 3000);
}

async function salvarPersona() {
  const text = $("personaTxt").value;
  const r = await fetch("/api/persona", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const data = await r.json();
  if (!r.ok) { avisarPersona(data.error || "não deu para salvar"); return; }
  avisarPersona("Salvo. Vale já na próxima mensagem.");
}

async function restaurarPersona() {
  const r = await fetch("/api/persona", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ reset: true }),
  });
  const { text } = await r.json();
  $("personaTxt").value = text;
  avisarPersona("Voltou ao padrão.");
}

/* ---------- backup ---------- */
function baixarBackup() {
  // O navegador cuida do download; nada precisa passar pelo JS.
  window.location.href = "/api/backup";
  avisarPersona("Baixando…");
}

async function enviarBackup(input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  input.value = "";
  avisarPersona("Restaurando…");

  const r = await fetch("/api/backup", { method: "POST", body: arquivo });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { avisarPersona(d.error || "não deu para restaurar"); return; }

  const c = d.restaurado || {};
  avisarPersona(`Restaurado: ${c.memorias || 0} memórias, ${c.skills || 0} skills.`);
  if (d.stats) mostrarStats(d.stats);
  carregarConversas();
}

/* ---------- memórias e skills ---------- */

async function carregarDocs() {
  if (abaAtual === "persona") return;
  try {
    const r = await fetch(`/api/store/${abaAtual}`);
    const { items } = await r.json();
    const topo = abaAtual === "memories" ? CEREBRO : "";
    if (!items.length) {
      $("docs").innerHTML = topo + `<div class="none">${
        abaAtual === "memories"
          ? "Nada memorizado ainda.<br>Conversem um pouco — ela guarda sozinha."
          : "Nenhuma skill ensinada.<br>Use o formulário abaixo."
      }</div>`;
      return;
    }
    $("docs").innerHTML = topo + items.map((d) => `
      <div class="doc">
        <div class="doc-top">
          <span class="doc-name">${escapar(d.name)}</span>
          <button class="x" onclick="apagarDoc('${escapar(d.name)}')" title="apagar">×</button>
        </div>
        <div class="doc-desc">${escapar(d.description)}</div>
        ${d.body.trim() ? `<div class="doc-body">${escapar(d.body.trim().slice(0, 300))}</div>` : ""}
      </div>`).join("");
  } catch { /* idem */ }
}

async function salvarDoc() {
  const name = $("dName").value.trim();
  const description = $("dDesc").value.trim();
  const body = $("dBody").value;
  if (!name || !description) {
    alert("Nome e descrição são obrigatórios.");
    return;
  }
  const r = await fetch(`/api/store/${abaAtual}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, description, body }),
  });
  if (r.ok) {
    const { stats } = await r.json();
    $("dName").value = $("dDesc").value = $("dBody").value = "";
    mostrarStats(stats);
    carregarDocs();
  }
}

async function apagarDoc(name) {
  const r = await fetch(`/api/store/${abaAtual}/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (r.ok) {
    const { stats } = await r.json();
    mostrarStats(stats);
  }
  carregarDocs();
}

function mostrarStats(s) {
  const plural = (n, um, muitos) => `${n} ${n === 1 ? um : muitos}`;
  $("stats").textContent =
    `${plural(s.memories, "memória", "memórias")} · ${plural(s.skills, "skill", "skills")}`;
}

/* ---------- início ---------- */
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});

(async function iniciar() {
  // Padrão de fábrica: escuro. A luz que corre no veio só se lê contra a
  // pedra escura. A variante clara é Carrara: a mesma pedra, veio cinza,
  // e a energia em ciano profundo — em superfície clara, brilho não
  // brilha, precisa de densidade.
  aplicarTema(localStorage.getItem("livia-tema") || "dark");
  vazio();
  carregarConversas();
  carregarDocs();
  try {
    const s = await (await fetch("/api/status")).json();
    aplicarIdentidade(s.name);
    mostrarStats(s);
    if (!s.has_key) {
      $("messages").innerHTML = `
        <div class="empty">
          <h2>Falta a chave da API</h2>
          <p>Pegue uma gratuita em
             <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>,
             copie <code>.env.example</code> para <code>.env</code> e cole a chave lá.</p>
          <p>Depois reinicie o servidor.</p>
        </div>`;
    }
  } catch { /* status é enfeite; a interface funciona sem */ }
  $("input").focus();
})();
</script>
