<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia</title>
<link rel="icon" href="data:,">
<style>
/* ══════════════════════════════════════════════════════════════════
   LIVIA — rubi sobre bronze

   Três materiais, aplicados com consistência:
     PEDRA   fundo bronze quente com malha tecida
     METAL   painéis escovados, luz vindo do topo
     GEMA    molduras e botões em rubi lapidado, com brilho externo

   Regra de ouro do tema: TUDO é emoldurado. Nada flutua solto — cada
   elemento tem sua moldura de rubi, como peça encaixada em joia.
   ══════════════════════════════════════════════════════════════════ */

:root[data-theme="dark"] {
  --rubi:       #b3173e;
  --rubi-claro: #d4285a;
  --brilho:     #e95a7a;
  --bordo:      #5a0d1a;
  --cobre:      #a6653a;
  --dourado:    #c08a4a;
  --creme:      #f6ecdd;

  --base-1: #4a2c1c;   /* bronze iluminado */
  --base-2: #2e1a12;   /* bronze médio     */
  --base-3: #170d0a;   /* sombra profunda  */

  --metal:     linear-gradient(158deg, rgba(96,60,40,.58), rgba(38,22,16,.86));
  --metal-alto:linear-gradient(158deg, rgba(122,78,52,.62), rgba(52,30,21,.88));
  --sunk:      linear-gradient(158deg, rgba(24,13,10,.82), rgba(38,22,16,.62));

  --texto:       #f6ecdd;
  --texto-suave: #d8b6a2;
  --texto-fraco: #a07d6b;

  --moldura:      rgba(179,23,62,.62);
  --moldura-forte:rgba(233,90,122,.9);
  --aura:         0 0 22px rgba(179,23,62,.42);
  --aura-forte:   0 0 34px rgba(233,90,122,.55);
  --bisel:        inset 0 1px 0 rgba(255,214,205,.22), inset 0 -1px 0 rgba(0,0,0,.45);
  --gema:         linear-gradient(162deg, #e13a63 0%, #b3173e 42%, #7d0f26 100%);
}

:root[data-theme="light"] {
  --rubi:       #a01235;
  --rubi-claro: #c02147;
  --brilho:     #c93a5c;
  --bordo:      #6d0b20;
  --cobre:      #8b5a2b;
  --dourado:    #a4703a;
  --creme:      #3a1c18;

  --base-1: #f3e3d2;
  --base-2: #e8d3bf;
  --base-3: #d9bfa8;

  --metal:      linear-gradient(158deg, rgba(255,252,248,.94), rgba(240,225,210,.8));
  --metal-alto: linear-gradient(158deg, #fffdfa, rgba(246,234,222,.9));
  --sunk:       linear-gradient(158deg, rgba(226,207,190,.7), rgba(240,228,215,.55));

  --texto:       #33191a;
  --texto-suave: #7a5750;
  --texto-fraco: #a3857a;

  --moldura:       rgba(160,18,53,.5);
  --moldura-forte: rgba(160,18,53,.8);
  --aura:          0 0 18px rgba(160,18,53,.20);
  --aura-forte:    0 0 26px rgba(160,18,53,.32);
  --bisel:         inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(150,110,90,.22);
  --gema:          linear-gradient(162deg, #c02147, #a01235 45%, #7d0f26);
}

:root {
  --r: 14px; --r-p: 10px;
  --sans: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
  --serif: "Iowan Old Style", Georgia, serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  font-family: var(--sans); font-size: 15.5px; line-height: 1.7;
  color: var(--texto); display: flex; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1200px 800px at 22% 8%,  rgba(122,74,44,.55), transparent 64%),
    radial-gradient(1000px 700px at 82% 92%, rgba(90,13,26,.42),  transparent 62%),
    linear-gradient(152deg, var(--base-1) 0%, var(--base-2) 46%, var(--base-3) 100%);
}

/* Malha tecida: duas diagonais finas cruzadas. Custa quase nada e dá a
   textura de fibra que uma cor chapada nunca daria. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
  background-image:
    repeating-linear-gradient(45deg,  rgba(0,0,0,.16) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(-45deg, rgba(255,190,150,.05) 0 1px, transparent 1px 5px);
}
:root[data-theme="light"] body::before { opacity: .28; }

button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::selection { background: rgba(179,23,62,.42); color: #fff; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(var(--rubi), var(--bordo));
  border-radius: 6px; border: 3px solid transparent; background-clip: padding-box;
}

/* ── moldura: o gesto que se repete em tudo ───────────────────────── */
.moldura {
  border: 1.5px solid var(--moldura); border-radius: var(--r);
  background: var(--metal);
  box-shadow: var(--bisel), var(--aura), 0 10px 30px rgba(0,0,0,.42);
}

/* ─────────────────── COLUNA ESQUERDA ─────────────────── */

#sidebar {
  position: relative; z-index: 3; width: 290px; flex: none;
  display: flex; flex-direction: column; margin: 12px 0 12px 12px;
  padding: 18px 14px 0; border-radius: var(--r);
  border: 1.5px solid var(--moldura); background: var(--metal);
  box-shadow: var(--bisel), var(--aura), 0 14px 40px rgba(0,0,0,.45);
}

.marca { display: flex; align-items: center; gap: 13px; padding: 2px 4px 16px; }
.marca svg { width: 50px; height: 50px; flex: none; filter: drop-shadow(0 0 14px rgba(233,90,122,.7)); }
.brand {
  font-size: 38px; font-weight: 700; letter-spacing: .07em; line-height: 1;
  text-transform: uppercase; color: var(--creme);
  text-shadow: 0 0 18px rgba(233,90,122,.5), 0 2px 4px rgba(0,0,0,.6);
}
:root[data-theme="light"] .brand { text-shadow: 0 1px 0 #fff; }

.btn-new {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding: 13px 18px; border-radius: 12px;
  border: 1.5px solid var(--moldura-forte); background: var(--metal-alto);
  color: var(--creme); font-size: 15.5px; font-weight: 500;
  box-shadow: var(--bisel), var(--aura), 0 6px 18px rgba(0,0,0,.4);
  transition: transform .16s, box-shadow .16s, border-color .16s;
}
.btn-new::after { content: "＋"; color: var(--brilho); font-size: 19px; line-height: 1; }
.btn-new:hover { transform: translateY(-1px); border-color: var(--brilho);
  box-shadow: var(--bisel), var(--aura-forte), 0 10px 26px rgba(0,0,0,.5); }

.secao {
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--brilho); padding: 0 4px 10px; font-weight: 700;
}

#convos { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px 12px; }
.convo {
  position: relative; display: flex; align-items: center; gap: 8px;
  padding: 11px 13px; margin-bottom: 5px; border-radius: var(--r-p);
  font-size: 15px; color: var(--texto-suave); line-height: 1.35;
  border: 1.5px solid transparent; transition: all .16s;
}
.convo:hover { background: var(--sunk); color: var(--texto); border-color: var(--moldura); }
.convo.active {
  background: var(--metal-alto); color: var(--creme);
  border-color: var(--moldura-forte);
  box-shadow: var(--bisel), 0 0 20px rgba(233,90,122,.32);
}
.convo span.t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.convo .hora { font-size: 11px; color: var(--brilho); flex: none; opacity: .85; }
.convo .x { opacity: 0; font-size: 17px; line-height: 1; color: var(--texto-fraco); }
.convo:hover .x { opacity: .65; }
.convo .x:hover { opacity: 1; color: var(--brilho); }

.foot {
  padding: 12px 4px 15px; margin-top: auto; border-top: 1.5px solid var(--moldura);
  font-size: 12px; color: var(--texto-fraco);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.foot button { font-size: 13px; color: var(--brilho); padding: 3px 6px; transition: color .16s; }
.foot button:hover { color: var(--creme); text-shadow: 0 0 10px var(--brilho); }

/* ─────────────────── CENTRO ─────────────────── */

#main {
  position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column;
  min-width: 0; margin: 12px; border-radius: var(--r);
  border: 1.5px solid var(--moldura); overflow: hidden;
  background: linear-gradient(168deg, rgba(96,60,40,.34), rgba(23,13,10,.62));
  box-shadow: var(--bisel), var(--aura), 0 14px 40px rgba(0,0,0,.45);
}
:root[data-theme="light"] #main { background: linear-gradient(168deg, rgba(255,252,248,.7), rgba(233,215,198,.5)); }

#arte {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; opacity: .95; overflow: hidden;
}
#arte svg { width: 100%; height: 100%; }
:root[data-theme="light"] #arte { opacity: .5; }

@keyframes respirar { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
.sinapse { animation: respirar 4.5s ease-in-out infinite; }
.sinapse:nth-of-type(2n) { animation-duration: 6s;   animation-delay: -1.3s; }
.sinapse:nth-of-type(3n) { animation-duration: 7.5s; animation-delay: -2.9s; }

/* barra superior: status e atalho */
.topo {
  position: relative; z-index: 3; display: flex; align-items: center;
  justify-content: space-between; padding: 14px 20px 0;
}
.online {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 7px 17px; border-radius: 999px; font-size: 13.5px; color: var(--texto);
  border: 1.5px solid var(--moldura); background: var(--metal);
  box-shadow: var(--bisel), var(--aura);
}
.online i {
  width: 9px; height: 9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 32%, #ff9db2, var(--rubi));
  box-shadow: 0 0 10px var(--brilho); animation: pulso 2.4s ease-in-out infinite;
}
@keyframes pulso { 50% { opacity: .4; } }
.btn-ajuda {
  padding: 8px 17px; border-radius: 12px; font-size: 13.5px; color: var(--texto-suave);
  border: 1.5px solid var(--moldura); background: var(--metal);
  box-shadow: var(--bisel), var(--aura); transition: all .16s;
}
.btn-ajuda:hover { color: var(--creme); border-color: var(--brilho); box-shadow: var(--bisel), var(--aura-forte); }

#thread { position: relative; z-index: 2; flex: 1; overflow-y: auto; padding: 22px 0 8px; }
.wrap { max-width: 736px; margin: 0 auto; padding: 0 30px; }

.msg { margin-bottom: 26px; }
.who {
  font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
  margin-bottom: 9px; font-weight: 700; color: var(--brilho);
  text-shadow: 0 0 12px rgba(233,90,122,.5);
}
:root[data-theme="light"] .who { text-shadow: none; }

/* Mensagem dela: painel metálico emoldurado, como na referência. */
.msg.assistant .body {
  padding: 18px 22px; border-radius: var(--r);
  border: 1.5px solid var(--moldura-forte); background: var(--metal-alto);
  box-shadow: var(--bisel), var(--aura), 0 8px 26px rgba(0,0,0,.4);
}
.msg.user .body {
  padding: 13px 18px; border-radius: var(--r);
  border: 1.5px solid var(--moldura); background: var(--sunk);
  color: var(--texto-suave); box-shadow: var(--bisel);
}
.body > *:first-child { margin-top: 0; }
.body > *:last-child { margin-bottom: 0; }
.body p { margin: 0 0 13px; }
.body ul, .body ol { margin: 0 0 13px; padding-left: 23px; }
.body li { margin-bottom: 6px; }
.body li::marker { color: var(--brilho); }
.body h3 { font-family: var(--serif); font-size: 18.5px; font-weight: 400; margin: 24px 0 10px; color: var(--creme); }
.body code {
  font-family: var(--mono); font-size: .85em; color: var(--brilho);
  background: rgba(0,0,0,.32); padding: 2px 7px; border-radius: 6px;
  border: 1px solid var(--moldura);
}
:root[data-theme="light"] .body code { background: rgba(160,18,53,.07); }
.body pre {
  background: var(--sunk); border: 1.5px solid var(--moldura); border-radius: var(--r-p);
  padding: 15px 17px; overflow-x: auto; margin: 0 0 13px; line-height: 1.6;
  box-shadow: var(--bisel);
}
.body pre code { background: none; padding: 0; border: none; color: var(--texto); font-size: 13.5px; }
.body blockquote { margin: 0 0 13px; padding-left: 16px; border-left: 2px solid var(--cobre); color: var(--texto-suave); font-style: italic; }
.body a { color: var(--brilho); }

.status { font-size: 13px; color: var(--texto-suave); margin-bottom: 11px; display: flex; align-items: center; gap: 9px; }
.status::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--brilho); box-shadow: 0 0 11px var(--brilho);
  animation: pulso 1.2s ease-in-out infinite;
}
.status.fixo::before { animation: none; opacity: .45; }

.fontes { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 16px; padding-top: 13px; border-top: 1.5px solid var(--moldura); }
.fontes-rot { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--brilho); font-weight: 700; }
.fontes a, .fontes .fonte-txt {
  font-size: 12px; color: var(--texto-suave); text-decoration: none;
  background: var(--sunk); border: 1px solid var(--moldura);
  padding: 4px 12px; border-radius: 999px; white-space: nowrap; transition: all .16s;
}
.fontes a:hover { color: var(--creme); border-color: var(--brilho); box-shadow: var(--aura); }

.learned {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
  font-size: 12.5px; color: var(--texto-suave); padding: 6px 15px; border-radius: 999px;
  border: 1.5px solid var(--moldura-forte); background: var(--metal);
  box-shadow: var(--bisel), var(--aura);
}
.learned b { color: var(--creme); font-weight: 600; }

.error {
  padding: 13px 17px; border-radius: var(--r-p);
  border: 1.5px solid var(--brilho); background: rgba(142,15,42,.22);
  color: var(--creme); font-size: 14.5px; white-space: pre-wrap; box-shadow: var(--aura);
}
:root[data-theme="light"] .error { background: rgba(160,18,53,.09); color: var(--bordo); }
.cursor::after { content: "▍"; color: var(--brilho); text-shadow: 0 0 12px var(--rubi); animation: piscar 1.1s steps(2) infinite; }
@keyframes piscar { 50% { opacity: 0; } }

.empty { padding: 20px 0 24px; }
.empty h2 { font-family: var(--serif); font-size: 30px; font-weight: 400; margin: 0 0 15px; color: var(--creme); text-shadow: 0 0 20px rgba(233,90,122,.4); }
:root[data-theme="light"] .empty h2 { text-shadow: none; }
.empty p { color: var(--texto-suave); margin: 0 0 12px; max-width: 54ch; }
.empty code { font-family: var(--mono); font-size: .85em; color: var(--brilho); background: rgba(0,0,0,.3); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--moldura); }
.empty a { color: var(--brilho); }

#composer { position: relative; z-index: 3; padding: 8px 0 20px; }
.box {
  display: flex; gap: 12px; align-items: flex-end;
  padding: 10px 10px 10px 22px; border-radius: 999px;
  border: 1.5px solid var(--moldura-forte); background: var(--metal);
  box-shadow: var(--bisel), var(--aura), 0 10px 30px rgba(0,0,0,.45);
  transition: border-color .2s, box-shadow .2s;
}
.box:focus-within { border-color: var(--brilho); box-shadow: var(--bisel), var(--aura-forte), 0 10px 30px rgba(0,0,0,.45); }
#input {
  flex: 1; border: none; background: none; color: var(--texto);
  font-family: var(--sans); font-size: 15.5px; line-height: 1.6;
  resize: none; outline: none; max-height: 170px; padding: 8px 0;
}
#input::placeholder { color: var(--texto-fraco); }
#send {
  padding: 11px 30px; border-radius: 999px; flex: none;
  border: 1.5px solid var(--moldura-forte); background: var(--gema);
  color: #fff; font-size: 15px; font-weight: 600;
  box-shadow: var(--bisel), var(--aura-forte), 0 6px 20px rgba(125,15,38,.5);
  transition: transform .16s, filter .16s;
}
#send:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.14); }
#send:disabled { opacity: .35; cursor: default; box-shadow: none; }
.hint { font-size: 12px; color: var(--texto-fraco); margin-top: 10px; padding-left: 22px; }
.hint code { font-family: var(--mono); color: var(--brilho); }

/* ─────────────────── PAINEL DIREITO ─────────────────── */

#panel {
  position: relative; z-index: 3; width: 380px; flex: none;
  display: flex; flex-direction: column; margin: 12px 12px 12px 0;
  border-radius: var(--r); border: 1.5px solid var(--moldura);
  background: var(--metal); overflow: hidden;
  box-shadow: var(--bisel), var(--aura), 0 14px 40px rgba(0,0,0,.45);
}
#panel.hidden { display: none; }

/* Abas como cartões encaixados, com ícone acima do rótulo. */
.tabs { display: flex; gap: 6px; padding: 10px 10px 0; }
.tab {
  position: relative; flex: 1; padding: 11px 4px 12px; border-radius: 11px 11px 0 0;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  font-size: 12.5px; font-weight: 500; color: var(--texto-fraco);
  border: 1.5px solid transparent; border-bottom: none; transition: all .16s;
}
.tab svg { width: 24px; height: 24px; opacity: .55; transition: opacity .16s, filter .16s; }
.tab:hover { color: var(--texto-suave); }
.tab:hover svg { opacity: .85; }
.tab.active {
  color: var(--creme); background: var(--metal-alto);
  border-color: var(--moldura-forte);
  box-shadow: var(--bisel), 0 -4px 20px rgba(233,90,122,.24);
}
.tab.active svg { opacity: 1; filter: drop-shadow(0 0 8px rgba(233,90,122,.8)); }

#docs { flex: 1; overflow-y: auto; padding: 16px; border-top: 1.5px solid var(--moldura); }

.cerebro { display: flex; justify-content: center; padding: 4px 0 16px; }
.cerebro svg { width: 100%; max-width: 300px; height: auto; }

.doc {
  border: 1.5px solid var(--moldura); border-radius: var(--r-p);
  background: var(--metal-alto); padding: 13px 15px; margin-bottom: 10px; font-size: 13.5px;
  box-shadow: var(--bisel); transition: all .16s;
}
.doc:hover { border-color: var(--brilho); transform: translateY(-1px); box-shadow: var(--bisel), var(--aura); }
.doc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.doc-name { font-family: var(--mono); font-size: 11px; color: var(--brilho); }
.doc .x { color: var(--texto-fraco); font-size: 16px; line-height: 1; }
.doc .x:hover { color: var(--brilho); }
.doc-desc { margin-top: 6px; line-height: 1.5; color: var(--texto); }
.doc-body { margin-top: 8px; color: var(--texto-suave); white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }
.none { color: var(--texto-fraco); font-size: 13.5px; text-align: center; padding: 28px 16px; line-height: 1.65; }

.add { border-top: 1.5px solid var(--moldura); padding: 15px 16px 17px; }
.add input, .add textarea {
  width: 100%; margin-bottom: 10px; padding: 12px 16px;
  font-family: var(--sans); font-size: 13.5px;
  border: 1.5px solid var(--moldura); border-radius: 999px;
  background: var(--sunk); color: var(--texto); outline: none;
  box-shadow: var(--bisel); transition: border-color .16s, box-shadow .16s;
}
.add textarea { border-radius: 16px; resize: vertical; min-height: 66px; line-height: 1.5; }
.add input::placeholder, .add textarea::placeholder { color: var(--texto-fraco); }
.add input:focus, .add textarea:focus { border-color: var(--brilho); box-shadow: var(--bisel), var(--aura); }
.add button {
  width: 100%; padding: 13px; border-radius: 999px;
  border: 1.5px solid var(--moldura-forte); background: var(--gema);
  color: #fff; font-size: 14.5px; font-weight: 600;
  box-shadow: var(--bisel), var(--aura-forte); transition: transform .16s, filter .16s;
}
.add button:hover { transform: translateY(-1px); filter: brightness(1.14); }

.persona { display: flex; flex-direction: column; height: 100%; }
.persona-ajuda {
  font-size: 12.5px; line-height: 1.6; color: var(--texto-suave); margin: 0 0 12px;
  padding: 13px 15px; border: 1.5px solid var(--moldura); border-radius: var(--r-p);
  background: var(--sunk); box-shadow: var(--bisel);
}
.persona-ajuda b { color: var(--creme); font-weight: 600; }
#personaTxt {
  flex: 1; min-height: 250px; resize: vertical;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65; padding: 14px;
  border: 1.5px solid var(--moldura); border-radius: var(--r-p);
  background: var(--sunk); color: var(--texto); outline: none; box-shadow: var(--bisel);
}
#personaTxt:focus { border-color: var(--brilho); box-shadow: var(--bisel), var(--aura); }
.persona-botoes { display: flex; gap: 9px; margin-top: 11px; }
.persona-botoes button {
  flex: 1; padding: 11px; border-radius: 999px; font-size: 13px; font-weight: 600;

<script>
"use strict";

let conversaAtual = null;
let abaAtual = "memories";
let ocupado = false;
let nomeAssistente = "Livia";

const $ = (id) => document.getElementById(id);

/* ---------- markdown mínimo ---------- */
function escapar(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderizar(texto) {
  const blocos = [];
  // Tira blocos de código antes de qualquer outra coisa, para não mexer neles.
  let t = texto.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocos.push(`<pre><code>${escapar(code.replace(/\n$/, ""))}</code></pre>`);
    return `\n@@BLOCO${blocos.length - 1}@@\n`;
  });

  t = escapar(t);
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const linhas = t.split("\n");
  const out = [];
  let lista = null;

  const fecharLista = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };

  for (const linha of linhas) {
    const l = linha.trim();
    if (!l) { fecharLista(); continue; }

    if (/^@@BLOCO\d+@@$/.test(l)) { fecharLista(); out.push(l); continue; }

    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { fecharLista(); out.push(`<h3>${h[2]}</h3>`); continue; }

    if (l.startsWith("&gt;")) {
      fecharLista();
      out.push(`<blockquote>${l.slice(4).trim()}</blockquote>`);
      continue;
    }

    const ul = l.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (lista !== "ul") { fecharLista(); out.push("<ul>"); lista = "ul"; }
      out.push(`<li>${ul[1]}</li>`);
      continue;
    }

    const ol = l.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      if (lista !== "ol") { fecharLista(); out.push("<ol>"); lista = "ol"; }
      out.push(`<li>${ol[1]}</li>`);
      continue;
    }

    fecharLista();
    out.push(`<p>${l}</p>`);
  }
  fecharLista();

  return out.join("").replace(/@@BLOCO(\d+)@@/g, (_, i) => blocos[i]);
}

/* ---------- tema ---------- */
function aplicarTema(tema) {
  document.documentElement.dataset.theme = tema;
  localStorage.setItem("livia-tema", tema);
  const btn = $("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "escuro" : "claro";
  // O ícone da aba usa a cor de destaque, que muda com o tema.
  aplicarIdentidade(nomeAssistente);
}

function trocarTema() {
  aplicarTema(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}

/* ---------- identidade ---------- */
function aplicarIdentidade(nome) {
  nomeAssistente = (nome || "Livia").trim() || "Livia";
  document.title = nomeAssistente;
  $("brand").textContent = nomeAssistente;

  // Ícone da aba: um monograma gerado na hora, sem arquivo externo.
  // Gema lapidada com a inicial dentro — a mesma joia da barra lateral,
  // reduzida ao que sobrevive a 16 pixels na aba do navegador.
  const letra = escapar(nomeAssistente[0].toUpperCase());
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#e95a7a"/><stop offset=".55" stop-color="#b3173e"/>' +
    '<stop offset="1" stop-color="#5a0d1a"/></linearGradient></defs>' +
    '<path d="M18 8h28l10 15-24 33L8 23z" fill="url(#g)"/>' +
    '<path d="M18 8h28l10 15H8z" fill="#e95a7a" opacity=".55"/>' +
    `<text x="32" y="42" text-anchor="middle" fill="#fff2f4"` +
    ` font-family="Georgia,serif" font-size="26" font-weight="600">${letra}</text></svg>`;
  document.querySelector("link[rel=icon]").href =
    "data:image/svg+xml," + encodeURIComponent(svg);
}

/* ---------- mensagens ---------- */
function addMensagem(quem, texto) {
  const div = document.createElement("div");
  div.className = "msg " + quem;
  div.innerHTML =
    `<div class="who">${quem === "user" ? "Você" : escapar(nomeAssistente)}</div>` +
    `<div class="body">${renderizar(texto)}</div>`;
  $("messages").appendChild(div);
  descer();
  return div;
}

function descer() {
  const t = $("thread");
  t.scrollTop = t.scrollHeight;
}

/* ---------- web: status e fontes ---------- */
function mostrarStatus(bolha, texto, fixo) {
  let el = bolha.querySelector(".status");
  if (!el) {
    el = document.createElement("div");
    el.className = "status";
    bolha.querySelector(".who").after(el);
  }
  // "fixo" fica na tela depois da resposta (ex: qual provedor respondeu);
  // o resto é indicador de progresso e some quando o trabalho termina.
  el.classList.toggle("fixo", !!fixo);
  el.textContent = texto;
  descer();
}

function mostrarFontes(bolha, rotulo, urls, texto) {
  const status = bolha.querySelector(".status");
  if (status && !status.classList.contains("fixo")) status.remove();
  if (!urls || !urls.length) return;

  const box = document.createElement("div");
  box.className = "fontes";
  // "texto" = rotulos comuns (livro, pagina), nao enderecos clicaveis.
  const itens = urls.map((u) => {
    if (texto) return `<span class="fonte-txt">${escapar(u)}</span>`;
    let host = u;
    try { host = new URL(u).hostname.replace(/^www\./, ""); } catch {}
    return `<a href="${escapar(u)}" target="_blank" rel="noopener" title="${escapar(u)}">${escapar(host)}</a>`;
  }).join("");
  box.innerHTML = `<span class="fontes-rot">${escapar(rotulo)}</span>${itens}`;
  bolha.appendChild(box);
  descer();
}

function vazio() {
  $("messages").innerHTML = `
    <div class="empty">
      <h2>Sobre o que vamos trabalhar?</h2>
      <p>Eu lembro do que você me contar — preferências, decisões de projeto,
         correções que você fizer em mim. Isso vai virando memória sozinho,
         conversa após conversa.</p>
      <p>Pode colar um link, mandar um livro em PDF, ou só começar a falar.
         <code>/ajuda</code> lista os comandos; o painel à direita mostra tudo
         que eu já sei.</p>
    </div>`;
}

/* ---------- envio ---------- */
async function enviar() {
  if (ocupado) return;
  const input = $("input");
  const texto = input.value.trim();
  if (!texto) return;

  const inicial = $("messages").querySelector(".empty");
  if (inicial) inicial.remove();

  input.value = "";
  input.style.height = "auto";
  ocupado = true;
  $("send").disabled = true;

  addMensagem("user", texto);

  const bolha = addMensagem("assistant", "");
  const corpo = bolha.querySelector(".body");
  corpo.classList.add("cursor");
  let acumulado = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: texto, conversation_id: conversaAtual }),
    });

    if (!resp.ok || !resp.body) throw new Error("O servidor recusou a requisição.");

    const leitor = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.type === "delta") {
          acumulado += evt.text;
          corpo.innerHTML = renderizar(acumulado);
          descer();
        } else if (evt.type === "status") {
          mostrarStatus(bolha, evt.text, evt.fixo);
        } else if (evt.type === "livros") {
          mostrarFontes(bolha, "dos seus livros", evt.trechos, true);
        } else if (evt.type === "sources") {
          mostrarFontes(bolha, evt.label, evt.urls);
        } else if (evt.type === "learned") {
          const nomes = evt.memories.map((m) => m.name).join(", ");
          const tag = document.createElement("div");
          tag.className = "learned";
          tag.innerHTML = `✓ memorizei <b>${escapar(nomes)}</b>`;
          bolha.appendChild(tag);
          carregarDocs();
        } else if (evt.type === "done") {
          conversaAtual = evt.conversation_id;
          if (evt.stats) mostrarStats(evt.stats);
          carregarConversas();
        } else if (evt.type === "error") {
          corpo.innerHTML = `<div class="error">${escapar(evt.message)}</div>`;
        }
      }
    }
  } catch (e) {
    corpo.innerHTML = `<div class="error">${escapar(e.message)}</div>`;
  } finally {
    corpo.classList.remove("cursor");
    ocupado = false;
    $("send").disabled = false;
    $("input").focus();
    descer();
  }
}

/* Botão flutuante /ajuda: preenche e envia, em vez de só mostrar o texto —
   assim a ajuda entra no histórico como qualquer outra resposta. */
function atalhoAjuda() {
  if (ocupado) return;
  $("input").value = "/ajuda";
  enviar();
}

/* ---------- conversas ---------- */
function quando(iso) {
  // Hoje mostra a hora; ontem diz "ontem"; mais velho, a data curta.
  // Data absoluta em conversa de hoje não ajuda ninguém a se localizar.
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const agora = new Date();
  const dia = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dias = Math.round((dia(agora) - dia(d)) / 86400000);
  if (dias === 0) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (dias === 1) return "ontem";
  if (dias < 7) return `${dias}d`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

function novaConversa() {
  conversaAtual = null;
  vazio();
  carregarConversas();
  $("input").focus();
}

async function carregarConversas() {
  try {
    const r = await fetch("/api/conversations");
    const { conversations } = await r.json();
    if (!conversations.length) {
      $("convos").innerHTML = '<div class="none" style="padding:20px 10px">Nenhuma ainda.</div>';
      return;
    }
    $("convos").innerHTML = conversations.map((c) => `
      <div class="convo ${c.id === conversaAtual ? "active" : ""}">
        <span class="t" onclick="abrirConversa(${c.id})" title="${escapar(c.title)}">${escapar(c.title)}</span>
        <span class="hora">${escapar(quando(c.updated_at))}</span>
        <button class="x" onclick="apagarConversa(${c.id})" title="apagar">×</button>
      </div>`).join("");
  } catch { /* servidor caiu; a lista só fica desatualizada */ }
}

async function abrirConversa(id) {
  const r = await fetch(`/api/conversations/${id}`);
  if (!r.ok) return;
  const { messages } = await r.json();
  conversaAtual = id;
  $("messages").innerHTML = "";
  messages.forEach((m) => addMensagem(m.role === "user" ? "user" : "assistant", m.content));
  carregarConversas();
}

async function apagarConversa(id) {
  await fetch(`/api/conversations/${id}`, { method: "DELETE" });
  if (id === conversaAtual) novaConversa();
  else carregarConversas();
}

/* ---------- painel ---------- */
function togglePanel() { $("panel").classList.toggle("hidden"); }

function trocarAba(kind) {
  abaAtual = kind;
  document.querySelectorAll(".tab").forEach((t) =>
    t.classList.toggle("active", t.dataset.kind === kind));
  $("addForm").style.display = (kind === "persona" || kind === "livros") ? "none" : "";
  if (kind === "persona") carregarPersona();
  else if (kind === "livros") carregarLivros();
  else carregarDocs();
}

/* ---------- biblioteca ---------- */
async function carregarLivros() {
  const { livros } = await (await fetch("/api/biblioteca")).json();

  const lista = livros.length
    ? livros.map((l) => `
        <div class="doc">
          <div class="doc-top">
            <span class="doc-name">${escapar(l.titulo)}</span>
            <button class="x" onclick="apagarLivro('${escapar(l.slug)}')" title="remover">×</button>
          </div>
          <div class="doc-body" style="margin-top:5px">
            ${l.paginas} páginas · ${l.trechos} trechos · ${escapar(l.criado)}
          </div>
        </div>`).join("")
    : `<div class="none">Nenhum livro ainda.<br>Envie um PDF e ela passa a consultá-lo.</div>`;

  $("docs").innerHTML = `
    <p class="persona-ajuda">
      Ela não decora o livro. Quando você pergunta, ela procura os trechos que
      respondem e lê <b>aqueles</b> antes de responder — citando livro e página.
      Aceita PDF, TXT e Markdown.
    </p>
    ${lista}
    <div style="margin-top:12px">
      <button class="btn-livro" onclick="$('arqLivro').click()">Enviar arquivo</button>
      <input type="file" id="arqLivro" accept=".pdf,.txt,.md,.markdown"
             style="display:none" onchange="enviarLivro(this)">
      <div id="livroStatus" class="livro-status"></div>
    </div>`;
}

async function apagarLivro(slug) {
  await fetch(`/api/biblioteca/${encodeURIComponent(slug)}`, { method: "DELETE" });
  carregarLivros();
}

async function enviarLivro(input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  input.value = "";

  const status = $("livroStatus");
  status.className = "livro-status ativo";
  status.textContent = "enviando…";

  try {
    const r = await fetch("/api/biblioteca", {
      method: "POST",
      headers: { "x-nome-arquivo": encodeURIComponent(arquivo.name).replace(/%20/g, " ") },
      body: arquivo,
    });
    if (!r.body) throw new Error("o servidor não respondeu");

    const leitor = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.etapa === "erro") {
          status.className = "livro-status erro";
          status.textContent = evt.texto;
          return;
        }
        if (evt.etapa === "pronto") {
          status.className = "livro-status";
          status.textContent = "";
          carregarLivros();
          return;
        }
        status.textContent = evt.texto || evt.etapa;
      }
    }
  } catch (e) {
    status.className = "livro-status erro";
    status.textContent = e.message;
  }
}

/* ---------- personalidade ---------- */
async function carregarPersona() {
  const r = await fetch("/api/persona");
  const { text } = await r.json();
  $("docs").innerHTML = `
    <div class="persona">
      <p class="persona-ajuda">
        Isto entra no prompt de toda conversa. Descreva o <b>jeito</b> dela —
        tom, formato de resposta, manias. As regras de honestidade e os limites
        ficam no código e não são afetados por este texto.
      </p>
      <textarea id="personaTxt" spellcheck="false"></textarea>
      <div class="persona-botoes">
        <button class="primario" onclick="salvarPersona()">Salvar</button>
        <button onclick="restaurarPersona()">Restaurar padrão</button>
      </div>
      <div id="personaAviso" class="persona-aviso"></div>

      <div class="backup">
        <div class="secao" style="padding:0 0 8px">Backup</div>
        <p class="persona-ajuda" style="margin-bottom:10px">
          Baixa memórias, skills, personalidade e conversas num arquivo só.
          Faça isso de vez em quando se estiver rodando em hospedagem
          gratuita — o disco delas costuma ser apagado sem aviso.
        </p>
        <div class="persona-botoes">
          <button onclick="baixarBackup()">Baixar</button>
          <button onclick="$('arqBackup').click()">Restaurar</button>
        </div>
        <input type="file" id="arqBackup" accept=".zip" style="display:none"
               onchange="enviarBackup(this)">
      </div>
    </div>`;
  $("personaTxt").value = text;
}

function avisarPersona(msg) {
  const el = $("personaAviso");
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 3000);
}

async function salvarPersona() {
  const text = $("personaTxt").value;
  const r = await fetch("/api/persona", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const data = await r.json();
  if (!r.ok) { avisarPersona(data.error || "não deu para salvar"); return; }
  avisarPersona("Salvo. Vale já na próxima mensagem.");
}

async function restaurarPersona() {
  const r = await fetch("/api/persona", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ reset: true }),
  });
  const { text } = await r.json();
  $("personaTxt").value = text;
  avisarPersona("Voltou ao padrão.");
}

/* ---------- backup ---------- */
function baixarBackup() {
  // O navegador cuida do download; nada precisa passar pelo JS.
  window.location.href = "/api/backup";
  avisarPersona("Baixando…");
}

async function enviarBackup(input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  input.value = "";
  avisarPersona("Restaurando…");

  const r = await fetch("/api/backup", { method: "POST", body: arquivo });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { avisarPersona(d.error || "não deu para restaurar"); return; }

  const c = d.restaurado || {};
  avisarPersona(`Restaurado: ${c.memorias || 0} memórias, ${c.skills || 0} skills.`);
  if (d.stats) mostrarStats(d.stats);
  carregarConversas();
}

async function carregarDocs() {
  if (abaAtual === "persona") return;
  try {
    const r = await fetch(`/api/store/${abaAtual}`);
    const { items } = await r.json();
    const topo = abaAtual === "memories" ? CEREBRO : "";
    if (!items.length) {
      $("docs").innerHTML = topo + `<div class="none">${
        abaAtual === "memories"
          ? "Nada memorizado ainda.<br>Conversem um pouco — ela guarda sozinha."
          : "Nenhuma skill ensinada.<br>Use o formulário abaixo."
      }</div>`;
      return;
    }
    $("docs").innerHTML = topo + items.map((d) => `
      <div class="doc">
        <div class="doc-top">
          <span class="doc-name">${escapar(d.name)}</span>
          <button class="x" onclick="apagarDoc('${escapar(d.name)}')" title="apagar">×</button>
        </div>
        <div class="doc-desc">${escapar(d.description)}</div>
        ${d.body.trim() ? `<div class="doc-body">${escapar(d.body.trim().slice(0, 300))}</div>` : ""}
      </div>`).join("");
  } catch { /* idem */ }
}

async function salvarDoc() {
  const name = $("dName").value.trim();
  const description = $("dDesc").value.trim();
  const body = $("dBody").value;
  if (!name || !description) {
    alert("Nome e descrição são obrigatórios.");
    return;
  }
  const r = await fetch(`/api/store/${abaAtual}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, description, body }),
  });
  if (r.ok) {
    const { stats } = await r.json();
    $("dName").value = $("dDesc").value = $("dBody").value = "";
    mostrarStats(stats);
    carregarDocs();
  }
}

async function apagarDoc(name) {
  const r = await fetch(`/api/store/${abaAtual}/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (r.ok) {
    const { stats } = await r.json();
    mostrarStats(stats);
  }
  carregarDocs();
}

function mostrarStats(s) {
  const plural = (n, um, muitos) => `${n} ${n === 1 ? um : muitos}`;
  $("stats").textContent =
    `${plural(s.memories, "memória", "memórias")} · ${plural(s.skills, "skill", "skills")}`;
}

/* ---------- início ---------- */
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});

(async function iniciar() {
  // Padrão de fábrica: escuro. O rubi é uma joia — ela só brilha contra o
  // escuro. A variante clara existe e é a mesma identidade sob luz do dia.
  aplicarTema(localStorage.getItem("livia-tema") || "dark");
  vazio();
  carregarConversas();
  carregarDocs();
  try {
    const s = await (await fetch("/api/status")).json();
    aplicarIdentidade(s.name);
    mostrarStats(s);
    if (!s.has_key) {
      $("messages").innerHTML = `
        <div class="empty">
          <h2>Falta a chave da API</h2>
          <p>Pegue uma gratuita em
             <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>,
             copie <code>.env.example</code> para <code>.env</code> e cole a chave lá.</p>
          <p>Depois reinicie o servidor.</p>
        </div>`;
    }
  } catch { /* status é enfeite; a interface funciona sem */ }
  $("input").focus();
})();
