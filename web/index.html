<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia</title>
<link rel="icon" href="data:,">
<style>
/* ══════════════════════════════════════════════════════════════════
   LIVIA — tema rubi
   Superfícies em três camadas: pedra (fundo), vidro fumê (painéis),
   gema lapidada (botões e destaques). O brilho vem sempre de dentro
   para fora, nunca de uma sombra chapada por cima.
   ══════════════════════════════════════════════════════════════════ */

:root[data-theme="dark"] {
  --rubi:        #b3173e;
  --rubi-fundo:  #8e0f2a;
  --bordo:       #5a0d1a;
  --bronze:      #8b5a2b;
  --cobre:       #a6653a;
  --dourado:     #c08a4a;
  --marrom:      #2a140f;
  --preto:       #120909;

  --brilho:      #e95a7a;
  --creme:       #f1e2d0;

  --fundo:       #0d0707;
  --painel:      rgba(32, 16, 18, .72);
  --painel-alto: rgba(46, 22, 25, .82);
  --sunk:        rgba(18, 9, 11, .68);

  --linha:       rgba(179, 23, 62, .20);
  --linha-forte: rgba(179, 23, 62, .42);

  --texto:       #f1e2d0;
  --texto-suave: #c9a99a;
  --texto-fraco: #8f6f66;

  --sombra-baixa: 0 1px 2px rgba(0,0,0,.5);
  --sombra-alta:  0 18px 48px rgba(0,0,0,.55);
  --luz-topo:     inset 0 1px 0 rgba(255,190,190,.10);
  --gema:         linear-gradient(160deg, #d4285a 0%, #b3173e 38%, #8e0f2a 72%, #6d0b20 100%);
}

/* Variante clara: mesma joia sob luz do dia — marfim quente, rubi
   mantido como acento. Não é um tema frio; é a mesma identidade. */
:root[data-theme="light"] {
  --rubi:        #a01235;
  --rubi-fundo:  #8e0f2a;
  --bordo:       #6d0b20;
  --bronze:      #8b5a2b;
  --cobre:       #a6653a;
  --dourado:     #a4703a;
  --marrom:      #43231c;
  --preto:       #2a140f;

  --brilho:      #c93a5c;
  --creme:       #3a1c18;

  --fundo:       #f7efe6;
  --painel:      rgba(255, 252, 249, .86);
  --painel-alto: #fffdfb;
  --sunk:        rgba(226, 210, 199, .55);

  --linha:       rgba(142, 15, 42, .16);
  --linha-forte: rgba(142, 15, 42, .34);

  --texto:       #33191a;
  --texto-suave: #7a5750;
  --texto-fraco: #a98d84;

  --sombra-baixa: 0 1px 2px rgba(90,13,26,.10);
  --sombra-alta:  0 16px 40px rgba(90,13,26,.14);
  --luz-topo:     inset 0 1px 0 rgba(255,255,255,.85);
  --gema:         linear-gradient(160deg, #c02147 0%, #a01235 42%, #8e0f2a 100%);
}

:root { --raio: 14px; --raio-p: 10px;
  --sans: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
  --serif: "Iowan Old Style", Georgia, serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  font-family: var(--sans);
  font-size: 15.5px;
  line-height: 1.7;
  color: var(--texto);
  background: var(--fundo);
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Luz ambiente: três focos de rubi difuso, fixos. Gradiente é barato —
   o mesmo efeito com partículas animadas travaria máquina modesta. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1100px 720px at 12% -8%,  rgba(179,23,62,.20), transparent 62%),
    radial-gradient(900px 640px at 88% 108%, rgba(166,101,58,.14), transparent 60%),
    radial-gradient(700px 520px at 62% 42%,  rgba(142,15,42,.10), transparent 66%);
}
:root[data-theme="light"] body::before { opacity: .5; }

button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::selection { background: rgba(179,23,62,.35); color: var(--creme); }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(var(--rubi-fundo), var(--bordo));
  border-radius: 6px; border: 3px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: linear-gradient(var(--rubi), var(--rubi-fundo)); background-clip: padding-box; }

/* ─────────────────────── COLUNA ESQUERDA ─────────────────────── */

#sidebar {
  position: relative; z-index: 2;
  width: 274px; flex: none;
  display: flex; flex-direction: column;
  padding: 22px 14px 0;
  background: linear-gradient(178deg, rgba(46,22,25,.55), rgba(18,9,11,.30));
  border-right: 1px solid var(--linha);
  box-shadow: 1px 0 0 rgba(233,90,122,.06), var(--sombra-alta);
}
:root[data-theme="light"] #sidebar {
  background: linear-gradient(178deg, rgba(255,252,249,.9), rgba(247,239,230,.6));
}

.marca { display: flex; align-items: center; gap: 12px; padding: 4px 8px 6px; }
.marca svg { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 0 12px rgba(179,23,62,.55)); }
.marca-txt { min-width: 0; }
.brand {
  /* Caixa alta pelo CSS, não pelo texto: o nome vem do .env e pode ser
     qualquer coisa — a marca continua imponente independente do que for. */
  font-size: 25px; font-weight: 600; letter-spacing: .16em; line-height: 1.1;
  text-transform: uppercase;
  background: linear-gradient(105deg, var(--creme) 8%, var(--brilho) 46%, var(--dourado) 96%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.online {
  display: flex; align-items: center; gap: 6px; margin-top: 3px;
  font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--texto-fraco); font-weight: 600;
}
.online i {
  width: 6px; height: 6px; border-radius: 50%; background: #4ad07f;
  box-shadow: 0 0 8px #4ad07f; animation: pulso 2.6s ease-in-out infinite;
}
@keyframes pulso { 50% { opacity: .35; transform: scale(.8); } }

.btn-new {
  margin: 18px 0 20px; padding: 12px 16px; border-radius: var(--raio);
  background: var(--gema); color: #fff;
  font-size: 14.5px; font-weight: 600; letter-spacing: .02em; text-align: left;
  border: 1px solid rgba(233,90,122,.35);
  box-shadow: var(--luz-topo), 0 6px 20px rgba(142,15,42,.42), var(--sombra-baixa);
  transition: transform .16s, box-shadow .16s, filter .16s;
}
.btn-new:hover { transform: translateY(-1px); filter: brightness(1.1);
  box-shadow: var(--luz-topo), 0 10px 28px rgba(179,23,62,.5); }
.btn-new:active { transform: translateY(0); }

.secao {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--texto-fraco); padding: 0 8px 10px; font-weight: 700;
}

#convos { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px 14px; }
.convo {
  position: relative; display: flex; align-items: center; gap: 6px;
  padding: 9px 12px; margin-bottom: 3px; border-radius: var(--raio-p);
  font-size: 14px; color: var(--texto-suave); line-height: 1.4;
  border: 1px solid transparent; transition: background .16s, color .16s, border-color .16s;
}
.convo:hover { background: var(--sunk); color: var(--texto); border-color: var(--linha); }
.convo.active {
  background: linear-gradient(100deg, rgba(179,23,62,.22), rgba(142,15,42,.06));
  color: var(--texto); border-color: var(--linha-forte);
  box-shadow: var(--luz-topo), 0 0 18px rgba(179,23,62,.16);
}
.convo.active::before {
  content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 2px;
  border-radius: 2px; background: linear-gradient(var(--brilho), var(--rubi));
  box-shadow: 0 0 8px var(--rubi);
}
.convo span.t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.convo .hora { font-size: 10.5px; color: var(--texto-fraco); flex: none; letter-spacing: .03em; }
.convo .x { opacity: 0; font-size: 17px; line-height: 1; padding: 0 2px; color: var(--texto-fraco); }
.convo:hover .x { opacity: .6; }
.convo .x:hover { opacity: 1; color: var(--brilho); }

.foot {
  padding: 13px 8px 16px; margin-top: auto;
  border-top: 1px solid var(--linha);
  font-size: 11.5px; color: var(--texto-fraco);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.foot button {
  font-size: 11.5px; color: var(--texto-suave); padding: 4px 9px;
  border-radius: 7px; border: 1px solid transparent; transition: all .16s;
}
.foot button:hover { color: var(--creme); border-color: var(--linha-forte); background: var(--sunk); }

/* ─────────────────────── CENTRO ─────────────────────── */

#main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Silhueta de rosto em circuito, atrás da conversa. Fica em opacidade
   baixa de propósito: é atmosfera, não ilustração para ser lida. */
#arte {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: .30; overflow: hidden;
}
#arte svg { width: min(780px, 82%); height: auto; }
:root[data-theme="light"] #arte { opacity: .13; }

/* Órbita: a lua segue uma elipse e encolhe na metade de cima, que lemos
   como "mais longe". Dois quadros de animação sincronizados no mesmo
   tempo — sem isso o movimento fica chapado, como um adesivo girando. */
.lua {
  offset-path: path("M 690,310 A 260,92 0 1,1 689.9,310");
  offset-rotate: 0deg;
  animation: orbitar 52s linear infinite, distancia 52s ease-in-out infinite;
}
@keyframes orbitar  { to { offset-distance: 100%; } }
@keyframes distancia { 0%,100% { scale: 1.06; opacity: .95; }
                       50%     { scale: .62;  opacity: .55; } }

@keyframes cintilar { 0%,100% { opacity: .22; } 50% { opacity: .8; } }
.estrela { animation: cintilar 6s ease-in-out infinite; }
.estrela:nth-of-type(2n) { animation-duration: 8.5s; animation-delay: -2.2s; }
.estrela:nth-of-type(3n) { animation-duration: 11s;  animation-delay: -4.7s; }

/* Quem prefere menos movimento na tela não vê nada girando. */
@media (prefers-reduced-motion: reduce) {
  .lua, .estrela { animation: none; }
  .lua { offset-distance: 18%; }
}

/* Sinapses seguem em uso no cérebro do painel de memórias. */
@keyframes respirar { 0%,100% { opacity: .30; } 50% { opacity: .68; } }
.sinapse { animation: respirar 5s ease-in-out infinite; }
.sinapse:nth-of-type(2n) { animation-duration: 6.5s; animation-delay: -1.4s; }
.sinapse:nth-of-type(3n) { animation-duration: 8s;   animation-delay: -3.1s; }

#thread { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 40px 0 8px; }
.wrap { max-width: 736px; margin: 0 auto; padding: 0 34px; }

.msg { margin-bottom: 32px; }
.who {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  margin-bottom: 9px; font-weight: 700; color: var(--texto-fraco);
}
.msg.assistant .who {
  background: linear-gradient(90deg, var(--brilho), var(--dourado));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.msg.user .body {
  color: var(--texto-suave);
  border-left: 2px solid var(--linha-forte);
  padding-left: 17px;
}
.body > *:first-child { margin-top: 0; }
.body > *:last-child { margin-bottom: 0; }
.body p { margin: 0 0 14px; }
.body ul, .body ol { margin: 0 0 14px; padding-left: 24px; }
.body li { margin-bottom: 6px; }
.body li::marker { color: var(--rubi); }
.body h3 {
  font-family: var(--serif); font-size: 18.5px; font-weight: 400;
  margin: 26px 0 10px; color: var(--creme);
}
.body code {
  font-family: var(--mono); font-size: .85em;
  background: var(--sunk); color: var(--brilho);
  padding: 2px 7px; border-radius: 6px; border: 1px solid var(--linha);
}
.body pre {
  background: linear-gradient(165deg, rgba(42,20,15,.72), rgba(18,9,11,.86));
  border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 15px 18px; overflow-x: auto; margin: 0 0 14px; line-height: 1.6;
  box-shadow: var(--luz-topo), inset 0 0 40px rgba(142,15,42,.10);
}
:root[data-theme="light"] .body pre { background: linear-gradient(165deg, #fffdfb, #f5ebe2); }
.body pre code { background: none; padding: 0; border: none; color: var(--texto); font-size: 13.5px; }
.body blockquote {
  margin: 0 0 14px; padding: 2px 0 2px 17px;
  border-left: 2px solid var(--cobre); color: var(--texto-suave); font-style: italic;
}
.body a { color: var(--brilho); text-underline-offset: 3px; }
.body a:hover { color: var(--dourado); }

.status {
  font-size: 13px; color: var(--texto-suave); margin-bottom: 11px;
  display: flex; align-items: center; gap: 9px;
}
.status::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--brilho); box-shadow: 0 0 10px var(--brilho);
  animation: pulso 1.3s ease-in-out infinite;
}
.status.fixo::before { animation: none; opacity: .45; }

.fontes {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--linha);
}
.fontes-rot {
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--texto-fraco); font-weight: 700; margin-right: 3px;
}
.fontes a, .fontes .fonte-txt {
  font-size: 12px; color: var(--texto-suave); text-decoration: none;
  background: var(--sunk); border: 1px solid var(--linha);
  padding: 4px 12px; border-radius: 999px; white-space: nowrap; transition: all .16s;
}
.fontes a:hover { color: var(--creme); border-color: var(--linha-forte); box-shadow: 0 0 14px rgba(179,23,62,.24); }

/* Cada ferramenta usada vira uma linha visível na resposta. Ficam à mostra
   de propósito: se ela mexeu num arquivo seu, você precisa saber qual. */
.acoes { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.acao {
  font-size: 12.5px; color: var(--texto-suave); font-family: var(--mono);
  padding: 5px 13px; border-radius: 8px;
  background: var(--sunk); border: 1px solid var(--linha);
  display: flex; align-items: center; gap: 8px;
}
.acao::before { content: "▸"; color: var(--brilho); }
.acao.falhou { color: var(--brilho); border-color: var(--linha-forte); }
.acao.falhou::before { content: ""; }

.learned {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 15px;
  font-size: 12.5px; color: var(--texto-suave);
  background: linear-gradient(100deg, rgba(179,23,62,.20), rgba(166,101,58,.10));
  border: 1px solid var(--linha-forte); border-radius: 999px; padding: 6px 15px;
  box-shadow: var(--luz-topo), 0 0 18px rgba(179,23,62,.16);
}
.learned b { color: var(--creme); font-weight: 600; }

.error {
  border-left: 2px solid var(--rubi); padding: 12px 17px;
  background: linear-gradient(100deg, rgba(142,15,42,.18), transparent);
  border-radius: 0 var(--raio-p) var(--raio-p) 0;
  color: var(--brilho); font-size: 14.5px; white-space: pre-wrap;
}
.cursor::after {
  content: "▍"; color: var(--brilho); font-weight: 300;
  text-shadow: 0 0 10px var(--rubi); animation: piscar 1.1s steps(2) infinite;
}
@keyframes piscar { 50% { opacity: 0; } }

.empty { padding: 52px 0 24px; }
.empty h2 {
  font-family: var(--serif); font-size: 31px; font-weight: 400; margin: 0 0 16px;
  background: linear-gradient(100deg, var(--creme) 10%, var(--brilho) 62%, var(--dourado));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.empty p { color: var(--texto-suave); margin: 0 0 12px; max-width: 54ch; }
.empty code {
  font-family: var(--mono); font-size: .85em; color: var(--brilho);
  background: var(--sunk); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--linha);
}
.empty a { color: var(--brilho); }

/* ─────────────────────── CAIXA DE ENVIO ─────────────────────── */

#composer { position: relative; z-index: 2; padding: 8px 0 26px; }
.box {
  display: flex; gap: 11px; align-items: flex-end;
  padding: 12px 12px 12px 19px; border-radius: 18px;
  background: linear-gradient(165deg, var(--painel-alto), var(--painel));
  border: 1px solid var(--linha-forte);
  box-shadow: var(--luz-topo), var(--sombra-alta), 0 0 26px rgba(142,15,42,.12);
  transition: border-color .2s, box-shadow .2s;
}
.box:focus-within {
  border-color: var(--rubi);
  box-shadow: var(--luz-topo), var(--sombra-alta), 0 0 34px rgba(179,23,62,.30);
}
#input {
  flex: 1; border: none; background: none; color: var(--texto);
  font-family: var(--sans); font-size: 15.5px; line-height: 1.6;
  resize: none; outline: none; max-height: 200px; padding: 4px 0;
}
#input::placeholder { color: var(--texto-fraco); }
#send {
  padding: 10px 22px; border-radius: 12px; flex: none;
  background: var(--gema); color: #fff; font-size: 14.5px; font-weight: 600;
  letter-spacing: .02em; border: 1px solid rgba(233,90,122,.4);
  box-shadow: var(--luz-topo), 0 5px 18px rgba(142,15,42,.45);
  transition: transform .16s, filter .16s, box-shadow .16s;
}
#send:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.12);
  box-shadow: var(--luz-topo), 0 9px 26px rgba(179,23,62,.55); }
#send:active:not(:disabled) { transform: translateY(0); }
#send:disabled { opacity: .32; cursor: default; box-shadow: none; }

.hint { font-size: 11.5px; color: var(--texto-fraco); margin-top: 11px; padding-left: 6px; }
.hint code { font-family: var(--mono); color: var(--texto-suave); }

/* ─────────────────────── PAINEL DIREITO ─────────────────────── */

#panel {
  position: relative; z-index: 2;
  width: 348px; flex: none; display: flex; flex-direction: column;
  background: linear-gradient(190deg, rgba(46,22,25,.62), rgba(18,9,11,.42));
  border-left: 1px solid var(--linha);
  box-shadow: -1px 0 0 rgba(233,90,122,.06), var(--sombra-alta);
}
:root[data-theme="light"] #panel {
  background: linear-gradient(190deg, rgba(255,252,249,.92), rgba(247,239,230,.7));
}
#panel.hidden { display: none; }

.tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--linha); }
.tab {
  position: relative; flex: 1; padding: 17px 3px 14px; margin-bottom: -1px;
  font-size: 12.5px; font-weight: 600; letter-spacing: .03em;
  color: var(--texto-fraco); transition: color .16s;
}
.tab:hover { color: var(--texto-suave); }
.tab.active { color: var(--creme); }
.tab.active::after {
  content: ""; position: absolute; left: 14%; right: 14%; bottom: 0; height: 2px;
  border-radius: 2px; background: linear-gradient(90deg, var(--rubi), var(--brilho), var(--dourado));
  box-shadow: 0 0 12px var(--rubi);
}

#docs { flex: 1; overflow-y: auto; padding: 16px; }

.cerebro { display: flex; justify-content: center; padding: 6px 0 14px; }
.cerebro svg { width: 168px; height: auto; filter: drop-shadow(0 0 18px rgba(179,23,62,.42)); }

.doc {
  background: linear-gradient(160deg, var(--painel-alto), var(--painel));
  border: 1px solid var(--linha); border-radius: var(--raio-p);
  padding: 13px 15px; margin-bottom: 10px; font-size: 13.5px;
  box-shadow: var(--luz-topo), var(--sombra-baixa);
  transition: border-color .16s, box-shadow .16s, transform .16s;
}
.doc:hover {
  border-color: var(--linha-forte); transform: translateY(-1px);
  box-shadow: var(--luz-topo), 0 8px 22px rgba(142,15,42,.22);
}
.doc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.doc-name { font-family: var(--mono); font-size: 11px; color: var(--brilho); letter-spacing: .02em; }
.doc .x { color: var(--texto-fraco); font-size: 16px; line-height: 1; }
.doc .x:hover { color: var(--brilho); }
.doc-desc { margin-top: 6px; line-height: 1.5; color: var(--texto); }
.doc-body { margin-top: 8px; color: var(--texto-suave); white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }

.none {
  color: var(--texto-fraco); font-size: 13.5px; text-align: center;
  padding: 34px 16px; line-height: 1.65;
}

/* Etiquetas do painel: escopo, estado, veredito de experiência.
   Uma etiqueta só existe quando diz algo que o padrão não diz — memória
   global e ativa não ganha nenhuma, senão tudo vira ruído visual. */
.tag {
  display: inline-block; font-family: var(--mono); font-size: 10px;
  letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px; margin-right: 5px;
  border: 1px solid var(--linha-forte); color: var(--texto-fraco);
}
.tag.projeto { color: var(--brilho); border-color: rgba(233,90,122,.4); }

<script>
"use strict";

let conversaAtual = null;
let abaAtual = "memories";
let ocupado = false;
let nomeAssistente = "Livia";

const $ = (id) => document.getElementById(id);

/* ---------- markdown mínimo ---------- */
function escapar(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderizar(texto) {
  const blocos = [];
  // Tira blocos de código antes de qualquer outra coisa, para não mexer neles.
  let t = texto.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocos.push(`<pre><code>${escapar(code.replace(/\n$/, ""))}</code></pre>`);
    return `\n@@BLOCO${blocos.length - 1}@@\n`;
  });

  t = escapar(t);
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const linhas = t.split("\n");
  const out = [];
  let lista = null;

  const fecharLista = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };

  for (const linha of linhas) {
    const l = linha.trim();
    if (!l) { fecharLista(); continue; }

    if (/^@@BLOCO\d+@@$/.test(l)) { fecharLista(); out.push(l); continue; }

    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { fecharLista(); out.push(`<h3>${h[2]}</h3>`); continue; }

    if (l.startsWith("&gt;")) {
      fecharLista();
      out.push(`<blockquote>${l.slice(4).trim()}</blockquote>`);
      continue;
    }

    const ul = l.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (lista !== "ul") { fecharLista(); out.push("<ul>"); lista = "ul"; }
      out.push(`<li>${ul[1]}</li>`);
      continue;
    }

    const ol = l.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      if (lista !== "ol") { fecharLista(); out.push("<ol>"); lista = "ol"; }
      out.push(`<li>${ol[1]}</li>`);
      continue;
    }

    fecharLista();
    out.push(`<p>${l}</p>`);
  }
  fecharLista();

  return out.join("").replace(/@@BLOCO(\d+)@@/g, (_, i) => blocos[i]);
}

/* ---------- tema ---------- */
function aplicarTema(tema) {
  document.documentElement.dataset.theme = tema;
  localStorage.setItem("livia-tema", tema);
  const btn = $("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "escuro" : "claro";
  // O ícone da aba usa a cor de destaque, que muda com o tema.
  aplicarIdentidade(nomeAssistente);
}

function trocarTema() {
  aplicarTema(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}

/* ---------- identidade ---------- */
function aplicarIdentidade(nome) {
  nomeAssistente = (nome || "Livia").trim() || "Livia";
  document.title = nomeAssistente;
  $("brand").textContent = nomeAssistente;

  // Ícone da aba: um monograma gerado na hora, sem arquivo externo.
  // Gema lapidada com a inicial dentro — a mesma joia da barra lateral,
  // reduzida ao que sobrevive a 16 pixels na aba do navegador.
  const letra = escapar(nomeAssistente[0].toUpperCase());
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#e95a7a"/><stop offset=".55" stop-color="#b3173e"/>' +
    '<stop offset="1" stop-color="#5a0d1a"/></linearGradient></defs>' +
    '<path d="M18 8h28l10 15-24 33L8 23z" fill="url(#g)"/>' +
    '<path d="M18 8h28l10 15H8z" fill="#e95a7a" opacity=".55"/>' +
    `<text x="32" y="42" text-anchor="middle" fill="#fff2f4"` +
    ` font-family="Georgia,serif" font-size="26" font-weight="600">${letra}</text></svg>`;
  document.querySelector("link[rel=icon]").href =
    "data:image/svg+xml," + encodeURIComponent(svg);
}

/* ---------- mensagens ---------- */
function addMensagem(quem, texto) {
  const div = document.createElement("div");
  div.className = "msg " + quem;
  div.innerHTML =
    `<div class="who">${quem === "user" ? "Você" : escapar(nomeAssistente)}</div>` +
    `<div class="body">${renderizar(texto)}</div>`;
  $("messages").appendChild(div);
  descer();
  return div;
}

function descer() {
  const t = $("thread");
  t.scrollTop = t.scrollHeight;
}

/* ---------- ações ---------- */
// Cada ferramenta usada vira uma linha permanente na resposta. Ficam à vista
// de propósito: se ela mexeu num arquivo seu, você tem que saber qual.
function mostrarAcao(bolha, texto, falhou) {
  let lista = bolha.querySelector(".acoes");
  if (!lista) {
    lista = document.createElement("div");
    lista.className = "acoes";
    bolha.querySelector(".who").after(lista);
  }
  const linha = document.createElement("div");
  linha.className = "acao" + (falhou ? " falhou" : "");
  linha.textContent = texto;
  lista.appendChild(linha);
  descer();
}

/* ---------- web: status e fontes ---------- */
function mostrarStatus(bolha, texto, fixo) {
  let el = bolha.querySelector(".status");
  if (!el) {
    el = document.createElement("div");
    el.className = "status";
    bolha.querySelector(".who").after(el);
  }
  // "fixo" fica na tela depois da resposta (ex: qual provedor respondeu);
  // o resto é indicador de progresso e some quando o trabalho termina.
  el.classList.toggle("fixo", !!fixo);
  el.textContent = texto;
  descer();
}

function mostrarFontes(bolha, rotulo, urls, texto) {
  const status = bolha.querySelector(".status");
  if (status && !status.classList.contains("fixo")) status.remove();
  if (!urls || !urls.length) return;

  const box = document.createElement("div");
  box.className = "fontes";
  // "texto" = rotulos comuns (livro, pagina), nao enderecos clicaveis.
  const itens = urls.map((u) => {
    if (texto) return `<span class="fonte-txt">${escapar(u)}</span>`;
    let host = u;
    try { host = new URL(u).hostname.replace(/^www\./, ""); } catch {}
    return `<a href="${escapar(u)}" target="_blank" rel="noopener" title="${escapar(u)}">${escapar(host)}</a>`;
  }).join("");
  box.innerHTML = `<span class="fontes-rot">${escapar(rotulo)}</span>${itens}`;
  bolha.appendChild(box);
  descer();
}

function vazio() {
  $("messages").innerHTML = `
    <div class="empty">
      <h2>Sobre o que vamos trabalhar?</h2>
      <p>Eu lembro do que você me contar — preferências, decisões de projeto,
         correções que você fizer em mim. Isso vai virando memória sozinho,
         conversa após conversa.</p>
      <p>Pode colar um link, mandar um livro em PDF, ou só começar a falar.
         <code>/ajuda</code> lista os comandos; o painel à direita mostra tudo
         que eu já sei.</p>
    </div>`;
}

/* ---------- envio ---------- */
async function enviar() {
  if (ocupado) return;
  const input = $("input");
  const texto = input.value.trim();
  if (!texto) return;

  const inicial = $("messages").querySelector(".empty");
  if (inicial) inicial.remove();

  input.value = "";
  input.style.height = "auto";
  ocupado = true;
  $("send").disabled = true;

  addMensagem("user", texto);

  const bolha = addMensagem("assistant", "");
  const corpo = bolha.querySelector(".body");
  corpo.classList.add("cursor");
  let acumulado = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: texto, conversation_id: conversaAtual }),
    });

    if (!resp.ok || !resp.body) throw new Error("O servidor recusou a requisição.");

    const leitor = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.type === "delta") {
          acumulado += evt.text;
          corpo.innerHTML = renderizar(acumulado);
          descer();
        } else if (evt.type === "acao") {
          mostrarAcao(bolha, evt.texto, evt.falhou);
        } else if (evt.type === "status") {
          mostrarStatus(bolha, evt.text, evt.fixo);
        } else if (evt.type === "livros") {
          mostrarFontes(bolha, "dos seus livros", evt.trechos, true);
        } else if (evt.type === "sources") {
          mostrarFontes(bolha, evt.label, evt.urls);
        } else if (evt.type === "learned") {
          // Distinguir "gravei uma nova" de "isto desfez o que eu achava
          // antes" importa: a segunda é a que a pessoa vai querer conferir.
          const substituiu = evt.memories.filter((m) => m.substituiu);
          const nomes = evt.memories.map((m) => m.name).join(", ");
          const tag = document.createElement("div");
          tag.className = "learned";
          tag.innerHTML = substituiu.length
            ? `✓ atualizei <b>${escapar(nomes)}</b> — o que eu sabia antes ` +
              `(<b>${escapar(substituiu.map((m) => m.substituiu).join(", "))}</b>) ` +
              `ficou marcado como superado`
            : `✓ memorizei <b>${escapar(nomes)}</b>`;
          bolha.appendChild(tag);
          carregarDocs();
        } else if (evt.type === "done") {
          conversaAtual = evt.conversation_id;
          if (evt.stats) mostrarStats(evt.stats);
          carregarConversas();
        } else if (evt.type === "error") {
          corpo.innerHTML = `<div class="error">${escapar(evt.message)}</div>`;
        }
      }
    }
  } catch (e) {
    corpo.innerHTML = `<div class="error">${escapar(e.message)}</div>`;
  } finally {
    corpo.classList.remove("cursor");
    ocupado = false;
    $("send").disabled = false;
    $("input").focus();
    descer();
  }
}

/* ---------- conversas ---------- */
function quando(iso) {
  // Hoje mostra a hora; ontem diz "ontem"; mais velho, a data curta.
  // Data absoluta em conversa de hoje não ajuda ninguém a se localizar.
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const agora = new Date();
  const dia = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dias = Math.round((dia(agora) - dia(d)) / 86400000);
  if (dias === 0) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (dias === 1) return "ontem";
  if (dias < 7) return `${dias}d`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

// O mesmo laço de SSE que o envio de arquivo usa. Três cópias disto era o
// caminho garantido para as três divergirem.
async function consumirProgresso(resposta, status) {
  const leitor = resposta.body.getReader();
  const dec = new TextDecoder();
  let buffer = "";

  while (true) {
    const { done, value } = await leitor.read();
    if (done) break;
    buffer += dec.decode(value, { stream: true });
    const partes = buffer.split("\n\n");
    buffer = partes.pop();

    for (const parte of partes) {
      if (!parte.startsWith("data: ")) continue;
      const evt = JSON.parse(parte.slice(6));
      if (!status) continue;
      if (evt.etapa === "erro") {
        status.className = "livro-status erro";
        status.textContent = evt.texto;
      } else if (evt.etapa === "pronto") {
        status.className = "livro-status";
        status.textContent = evt.livro && evt.livro.segredos_removidos
          ? `pronto — ${evt.livro.segredos_removidos} linha(s) com credencial foram deixadas de fora`
          : "pronto.";
      } else {
        status.textContent = evt.texto || "";
      }
    }
  }
}

async function apagarLivro(slug) {

  carregarLivros();
}

async function enviarLivro(input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  input.value = "";

  const status = $("livroStatus");
  status.className = "livro-status ativo";
  status.textContent = "enviando…";

  try {
    const r = await fetch("/api/biblioteca", {
      method: "POST",
      headers: { "x-nome-arquivo": encodeURIComponent(arquivo.name).replace(/%20/g, " ") },
      body: arquivo,
    });
    if (!r.body) throw new Error("o servidor não respondeu");

    const leitor = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.etapa === "erro") {
          status.className = "livro-status erro";
          status.textContent = evt.texto;
          return;
        }
        if (evt.etapa === "pronto") {
          status.className = "livro-status";
          status.textContent = "";
          carregarLivros();
          return;
        }
        status.textContent = evt.texto || evt.etapa;
      }
    }
  } catch (e) {
    status.className = "livro-status erro";
    status.textContent = e.message;
  }
}

// Uma etiqueta só aparece quando diz algo que o padrão não diz. Memória
// global e ativa não ganha nenhuma — senão toda linha vira ruído.
function etiquetas(d) {
  const partes = [];
  if (d.scope && d.scope !== "global") {
    partes.push(`<span class="tag projeto">${escapar(d.scope.replace("project:", ""))}</span>`);

  if (d.status === "superseded") {

  } else if (d.status === "archived") {
    partes.push(`<span class="tag arquivada">arquivada</span>`);

  if (d.importance >= 0.9) partes.push(`<span class="tag">sempre</span>`);

          <div class="doc-top">
            <span class="doc-name">${quando(e.criado_em)}</span>
            <button class="x" onclick="apagarExperiencia(${e.id})" title="apagar">×</button>
          </div>
          <div class="doc-desc">${marca}${escapar(e.tarefa.slice(0, 240))}</div>
          ${e.acoes.length ? `<div class="doc-body">${escapar(e.acoes.join(" → "))}</div>` : ""}
          ${e.erro ? `<div class="doc-body">erro: ${escapar(e.erro.slice(0, 200))}</div>` : ""}
          ${e.licao ? `<div class="doc-meta">lição: ${escapar(e.licao)}</div>` : ""}
        </div>`;
    }).join("");

    $("docs").innerHTML = `
      <p class="aviso-painel">
        <b>${resumo.total} experiência(s)</b> — ${resumo.sucessos} deram certo,
        ${resumo.falhas} falharam, ${resumo.sem_veredito} sem veredito.
        Só evidência conta como sucesso: ferramenta que rodou, ou você confirmando.
        Ela não marca acerto por ter respondido bonito.
      </p>
      ${cartoes}`;
  } catch { /* idem */ }
}

async function apagarExperiencia(id) {
  await fetch(`/api/experiencias/${id}`, { method: "DELETE" });
  carregarExperiencias();
}

async function atualizarBadges() {
  try {
    const s = await (await fetch("/api/status")).json();
    const badge = $("badgeSkills");
    if (badge) {
      badge.innerHTML = s.candidatas
        ? `<span class="contador">${s.candidatas}</span>` : "";
    }
  } catch { /* enfeite */ }
}

async function salvarDoc() {
  const name = $("dName").value.trim();
  const description = $("dDesc").value.trim();
  const body = $("dBody").value;
  if (!name || !description) {
    alert("Nome e descrição são obrigatórios.");
    return;
  }
  const r = await fetch(`/api/store/${abaAtual}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, description, body }),
  });
  if (r.ok) {
    const { stats } = await r.json();
    $("dName").value = $("dDesc").value = $("dBody").value = "";
    mostrarStats(stats);
    carregarDocs();
  }
}

async function apagarDoc(name) {
  const r = await fetch(`/api/store/${abaAtual}/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (r.ok) {
    const { stats } = await r.json();
    mostrarStats(stats);
  }
  carregarDocs();
}

function mostrarStats(s) {
  const plural = (n, um, muitos) => `${n} ${n === 1 ? um : muitos}`;
  const partes = [
    plural(s.memories, "memória", "memórias"),
    plural(s.skills, "skill", "skills"),
  ];
  if (s.lessons) partes.push(plural(s.lessons, "lição", "lições"));
  $("stats").textContent = partes.join(" · ");
}

/* ---------- início ---------- */
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});

(async function iniciar() {
  // Padrão de fábrica: escuro. O rubi é uma joia — ela só brilha contra o
  // escuro. A variante clara existe e é a mesma identidade sob luz do dia.
  aplicarTema(localStorage.getItem("livia-tema") || "dark");
  vazio();
  carregarConversas();
  carregarDocs();
  try {
    const s = await (await fetch("/api/status")).json();
    aplicarIdentidade(s.name);
    mostrarStats(s);
    atualizarBadges();
    if (!s.has_key) {
      // "sem chave" deixou de ser a única forma de estar sem provedor: com o
      // Ollama ligado a Livia funciona sem chave nenhuma, então o aviso
      // precisa oferecer os dois caminhos.
      $("messages").innerHTML = `
        <div class="empty">
          <h2>Nenhum provedor configurado</h2>
          <p>Dois caminhos, os dois de graça:</p>
          <p><b>Local</b> — instale o <a href="https://ollama.com" target="_blank" rel="noopener">Ollama</a>,
             rode <code>ollama pull qwen3:8b</code> e ponha <code>LIVIA_OLLAMA=1</code> no <code>.env</code>.
             Nada sai da sua máquina.</p>
          <p><b>Nuvem</b> — pegue uma chave gratuita em
             <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>,
             copie <code>.env.example</code> para <code>.env</code> e cole em <code>GEMINI_API_KEY</code>.</p>
          <p>Depois reinicie o servidor.</p>
        </div>`;
    }
  } catch { /* status é enfeite; a interface funciona sem */ }
  $("input").focus();
})();
</script>
