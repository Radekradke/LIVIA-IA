<!-- Aplicativo instalável. O manifesto é gerado pelo servidor para respeitar
     LIVIA_NAME; a cor da barra troca com o tema, coisa que o manifesto não
     sabe fazer sozinho. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livia">
<style>
/* ══════════════════════════════════════════════════════════════════
   LIVIA — tema Mnemosyne
   Mnemósine é a titânide da memória, e a Livia é um programa que existe
   para lembrar. A referência grega aparece na COMPOSIÇÃO — proporção,
   linha reta, espaço vazio —, nunca em coluna dórica de enfeite.

   Três superfícies: mármore (fundo), placa (cartões), grafite (texto).
   O bronze entra só onde há ação ou estado ativo, em quantidade pequena.
   Nada brilha: no lugar do brilho, uma linha de um pixel bem colocada.

   A regra das animações: se o movimento for percebido antes do conteúdo,
   está exagerado.
   ══════════════════════════════════════════════════════════════════ */

/* As fontes são SERVIDAS DAQUI, não do Google.
   A Livia é um aplicativo offline e promete que nada sai da máquina; um
   <link> para fonts.googleapis.com quebraria as duas coisas de uma vez —
   contaria ao Google toda vez que o André abre a assistente, e deixaria a
   tipografia sumir quando ele estivesse sem rede. São 67 KB no total.
   Marcellus e Geist estão sob a SIL Open Font License. */
@font-face {
  font-family: "Geist"; src: url("/fontes/geist.woff2") format("woff2");
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Geist Mono"; src: url("/fontes/geistmono.woff2") format("woff2");
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Marcellus"; src: url("/fontes/marcellus.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}

/* ── Nero Marquina: preto mineral com veio cinza ─────────────────────── */
:root[data-theme="dark"] {
  --bronze:       #a9895a;
  --bronze-claro: #c6a678;
  --bronze-fosco: #7a6342;
  --azul:         #8194a6;   /* funcional: links, referências, foco */
  --verde:        #7e9a87;
  --ambar:        #b8924e;   /* atenção, e só */

  --fundo:        #0f0f0e;
  --marmore:      #171715;
  --painel:       #1a1a18;
  --painel-alto:  #212120;
  --sunk:         #141412;

  --linha:        rgba(237,233,223,.10);
  --linha-forte:  rgba(169,137,90,.40);
  --veio:         rgba(237,233,223,.022);

  --texto:        #ede9df;   /* marfim */
  --texto-suave:  #a29d93;
  --texto-fraco:  #6c6860;

  --sombra-baixa: 0 1px 2px rgba(0,0,0,.40);
  --sombra-alta:  0 12px 32px rgba(0,0,0,.44);
  --metal:        linear-gradient(168deg, #8e7248 0%, #7a6342 100%);
  --metal-txt:    #f4efe4;
}

/* ── mármore claro e quente ──────────────────────────────────────────── */
:root[data-theme="light"] {
  --bronze:       #9a7b4f;
  --bronze-claro: #b39468;
  --bronze-fosco: #7d6440;
  --azul:         #647586;
  --verde:        #61796a;
  --ambar:        #9c7c37;

  --fundo:        #f2efe8;
  --marmore:      #e5e0d6;
  --painel:       #faf8f3;
  --painel-alto:  #ffffff;
  --sunk:         #eae5db;

  --linha:        rgba(36,35,33,.13);
  --linha-forte:  rgba(154,123,79,.44);
  --veio:         rgba(36,35,33,.016);

  --texto:        #242321;   /* grafite */
  --texto-suave:  #716d65;
  --texto-fraco:  #9a958b;

  --sombra-baixa: 0 1px 2px rgba(36,35,33,.06);
  --sombra-alta:  0 10px 30px rgba(36,35,33,.07);
  --metal:        linear-gradient(168deg, #a98a5c 0%, #8d7148 100%);
  --metal-txt:    #fbf8f1;
}

:root {
  /* Canto quase reto. A placa de pedra não tem raio generoso — o que a
     torna legível é a proporção e a espessura da borda, não o arredondado. */
  --louros: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M12%2021c-4-1.6-6.2-5-6.2-9.2%200-3.4%201.6-6.6%203.6-8.6%22/%3E%3Cpath%20d%3D%22M12%2021c4-1.6%206.2-5%206.2-9.2%200-3.4-1.6-6.6-3.6-8.6%22/%3E%3Cpath%20d%3D%22M7%208.6c1.5-.4%202.6.1%203.1%201.2M6.2%2012.4c1.5-.3%202.6.3%203%201.5%22/%3E%3Cpath%20d%3D%22M17%208.6c-1.5-.4-2.6.1-3.1%201.2M17.8%2012.4c-1.5-.3-2.6.3-3%201.5%22/%3E%3C/svg%3E");
  --raio: 3px; --raio-p: 2px;
  /* O arco: só no topo, e pequeno. É a nascente do arco grego sugerida,
     não o arco inteiro desenhado. */
  --arco: 10px 10px 0 0;
  --sans:  "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --serif: "Marcellus", "Iowan Old Style", Georgia, serif;
  --mono:  "Geist Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  font-family: var(--sans);
  font-size: 15.5px;
  line-height: 1.7;
  color: var(--texto);
  background: var(--fundo);
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Veios do mármore. Precisam ser quase invisíveis: a pedra tem veio, mas
   ninguém escolhe uma bancada pelo desenho dela. Três faixas diagonais
   larguíssimas em opacidade mínima, mais um clareado de luz — gradiente é
   barato e não custa quadro nenhum de animação. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(101deg, transparent 14%, var(--veio) 21%, transparent 28%),
    linear-gradient(97deg,  transparent 44%, var(--veio) 50%, transparent 56%),
    linear-gradient(104deg, transparent 68%, var(--veio) 75%, transparent 82%),
    radial-gradient(1100px 800px at 24% -12%, var(--veio), transparent 72%);
}

button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::selection { background: color-mix(in srgb, var(--bronze) 34%, transparent); color: var(--texto); }

:where(a, button, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--azul); outline-offset: 2px; border-radius: var(--raio-p);
}

::-webkit-scrollbar { width: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--linha-forte);
  border-radius: 0; border: 3px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--bronze); background-clip: padding-box; }

/* O meandro: a única citação grega literal, e ela aparece em dois lugares
   só — divisor de seção e carregamento. Desenhado como padrão repetido,
   não como imagem, para acompanhar a cor do tema. */
.meandro {
  height: 7px; flex: none;
  background-image:
    linear-gradient(90deg, var(--linha-forte) 1px, transparent 1px),
    linear-gradient(0deg,  var(--linha-forte) 1px, transparent 1px);
  background-size: 14px 7px, 14px 7px;
  background-position: 0 0, 0 100%;
  opacity: .5;
}

/* ─────────────────────── COLUNA ESQUERDA ─────────────────────── */

#sidebar {
  position: relative; z-index: 2;
  width: 274px; flex: none;
  display: flex; flex-direction: column;
  padding: 22px 14px 0;
  background: var(--painel);
  border-right: 1px solid var(--linha);
}

.marca { display: flex; align-items: center; gap: 13px; padding: 4px 8px 8px; }
.marca svg { width: 44px; height: 44px; flex: none; }
.marca-txt { min-width: 0; }
.brand {
  /* Marcellus, caixa alta pelo CSS. O nome vem do .env e pode ser qualquer
     coisa — a marca precisa se sustentar seja qual for a palavra. */
  font-family: var(--serif);
  font-size: 25px; font-weight: 400; letter-spacing: .19em; line-height: 1.15;
  text-transform: uppercase; color: var(--texto);
}
.online {
  display: flex; align-items: center; gap: 7px; margin-top: 2px;
  font-size: 9.5px; letter-spacing: .19em; text-transform: uppercase;
  color: var(--texto-fraco); font-weight: 500; font-family: var(--mono);
}
.online i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--verde);
  animation: pulso 3.4s ease-in-out infinite;
}
/* Sem servidor a marca para de respirar e a bolinha fica âmbar. A
   respiração é o sinal de "está viva"; mantê-la com o Python desligado
   seria a interface mentindo. */
.online.fora i { background: var(--ambar); animation: none; }
.online.fora { color: var(--ambar); }
@keyframes pulso { 50% { opacity: .30; } }

.faixa-fora {
  display: none; padding: 11px 16px; text-align: center;
  font-size: 13px; line-height: 1.55;
  background: var(--marmore);
  border-bottom: 1px solid var(--linha-forte);
  color: var(--texto-suave);
}
.faixa-fora code {
  font-family: var(--mono); font-size: 12px; color: var(--texto);
  background: var(--sunk); padding: 1px 6px; border-radius: var(--raio-p);
  border: 1px solid var(--linha);
}
body.sem-servidor .faixa-fora { display: block; }
body.sem-servidor #input { opacity: .5; }

/* O botão primário é o único lugar com bronze cheio. Um segundo já seria
   dois centros de atenção na mesma tela. */
.btn-new {
  margin: 16px 0 22px; padding: 12px 16px; border-radius: var(--raio);
  background: transparent; color: var(--texto);
  font-size: 14px; font-weight: 500; letter-spacing: .02em; text-align: left;
  border: 1px solid var(--linha-forte);
  transition: border-color .18s, background .18s;
}
.btn-new:hover { border-color: var(--bronze); background: var(--marmore); }
.btn-new:active { transform: translateY(1px); }

.secao {
  font-family: var(--mono);
  font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--texto-fraco); padding: 0 8px 11px; font-weight: 400;
}

#convos { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px 14px; }
.convo {
  position: relative; display: flex; align-items: center; gap: 6px;
  padding: 9px 12px 9px 13px; margin-bottom: 2px; border-radius: var(--raio-p);
  font-size: 14px; color: var(--texto-suave); line-height: 1.4;
  border: 1px solid transparent;
  transition: background .18s, color .18s, border-color .18s;
}
.convo:hover { background: var(--sunk); color: var(--texto); }
.convo.active {
  background: var(--marmore); color: var(--texto); border-color: var(--linha);
}
/* Filete de bronze na conversa aberta. Dois pixels bastam para dizer
   "é esta" sem acender a linha inteira. */
.convo.active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--bronze);
}
.convo span.t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.convo .hora { font-size: 10.5px; color: var(--texto-fraco); flex: none; letter-spacing: .03em; font-family: var(--mono); }
.convo .x { opacity: 0; font-size: 17px; line-height: 1; padding: 0 2px; color: var(--texto-fraco); }
.convo:hover .x { opacity: .55; }
.convo .x:hover { opacity: 1; color: var(--bronze); }

.foot {
  padding: 13px 8px 16px; margin-top: auto;
  border-top: 1px solid var(--linha);
  font-size: 10.5px; color: var(--texto-fraco); font-family: var(--mono);
  display: flex; flex-direction: column; align-items: flex-start; gap: 9px;
}
.foot > span:last-child { display: flex; gap: 4px; margin-left: -9px; }
.foot button {
  font-family: var(--sans); font-size: 11.5px; color: var(--texto-suave);
  padding: 4px 10px; border-radius: var(--raio-p);
  border: 1px solid transparent; transition: all .18s;
}
.foot button:hover { color: var(--texto); border-color: var(--linha-forte); }

/* ─────────────────────── CENTRO ─────────────────────── */

#main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Geometria de mármore atrás da conversa: arcos concêntricos e uma
   silhueta incompleta. Atmosfera, não ilustração — se der para descrever
   o desenho, ele está forte demais. */
#arte {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: .22; overflow: hidden;
}
#arte svg { width: min(760px, 80%); height: auto; }
:root[data-theme="light"] #arte { opacity: .28; }

/* Os arcos giram devagar demais para serem vistos girando. É de propósito:
   percebe-se que mudou de posição, nunca o movimento. */
@keyframes deriva { to { transform: rotate(360deg); } }
.arco-lento { transform-origin: 450px 310px; animation: deriva 320s linear infinite; }
.arco-lento.inverso { animation-duration: 460s; animation-direction: reverse; }

@keyframes respirar { 0%,100% { opacity: .30; } 50% { opacity: .62; } }
.sinapse { animation: respirar 6s ease-in-out infinite; }
.sinapse:nth-of-type(2n) { animation-duration: 7.5s; animation-delay: -1.9s; }
.sinapse:nth-of-type(3n) { animation-duration: 9.5s; animation-delay: -4.2s; }

/* O medalhão respira quando ela está disponível. Um ciclo de 6 segundos —
   mais rápido que isso vira um pisca-pisca. */
@keyframes medalhao { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
.chama { animation: medalhao 6s ease-in-out infinite; transform-origin: center; }
.anel-medalha { transform-origin: 24px 24px; }
body.pensando .anel-medalha { animation: deriva 9s linear infinite; }
body.pensando .chama { animation-duration: 2.4s; }

@media (prefers-reduced-motion: reduce) {
  .arco-lento, .sinapse, .chama, .anel-medalha, .online i { animation: none; }
}

#thread { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 40px 0 8px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 34px; }

.msg { margin-bottom: 34px; }
.who {
  font-family: var(--mono);
  font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase;
  margin-bottom: 10px; font-weight: 400; color: var(--texto-fraco);
}
.msg.assistant .who { color: var(--bronze); }
/* A pergunta fica recuada atrás de um filete, como anotação na margem de
   uma página. A resposta ocupa a coluna inteira. */
.msg.user .body {
  color: var(--texto-suave);
  border-left: 1px solid var(--linha-forte);
  padding-left: 18px;
}
.body > *:first-child { margin-top: 0; }
.body > *:last-child { margin-bottom: 0; }
.body p { margin: 0 0 14px; }
.body ul, .body ol { margin: 0 0 14px; padding-left: 22px; }
.body li { margin-bottom: 6px; }
.body li::marker { color: var(--bronze); }
.body h3 {
  font-family: var(--serif); font-size: 19px; font-weight: 400;
  margin: 28px 0 11px; color: var(--texto); letter-spacing: .01em;
}
.body code {
  font-family: var(--mono); font-size: .85em;
  background: var(--sunk); color: var(--texto);
  padding: 2px 6px; border-radius: var(--raio-p); border: 1px solid var(--linha);
}
.body pre {
  background: var(--sunk);
  border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 15px 18px; overflow-x: auto; margin: 0 0 14px; line-height: 1.6;
}
.body pre code { background: none; padding: 0; border: none; color: var(--texto); font-size: 13px; }
.body blockquote {
  margin: 0 0 14px; padding: 2px 0 2px 18px;
  border-left: 1px solid var(--bronze); color: var(--texto-suave); font-style: italic;
}
.body a { color: var(--azul); text-underline-offset: 3px; }
.body a:hover { color: var(--bronze); }

.status {
  font-size: 12.5px; color: var(--texto-suave); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px; font-family: var(--mono);
}
.status::before {
  content: ""; width: 6px; height: 6px; flex: none;
  background: var(--bronze); animation: pulso 1.8s ease-in-out infinite;
}
.status.fixo::before { animation: none; opacity: .45; }

.fontes {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--linha);
}
.fontes-rot {
  font-family: var(--mono);
  font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--texto-fraco); font-weight: 400; margin-right: 3px;
}
.fontes a, .fontes .fonte-txt {
  font-size: 12px; color: var(--texto-suave); text-decoration: none;
  background: var(--sunk); border: 1px solid var(--linha);
  padding: 4px 11px; border-radius: var(--raio-p); white-space: nowrap;
  transition: color .18s, border-color .18s;
}
.fontes a:hover { color: var(--texto); border-color: var(--bronze); }

/* Cada ferramenta usada vira um "registro do arquivo": uma linha
   monoespaçada, discreta, com um traço de bronze na frente. Ficam à mostra
   de propósito — se ela mexeu num arquivo seu, você precisa saber qual. */
.acoes { margin-bottom: 13px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.acao {
  font-size: 12px; color: var(--texto-suave); font-family: var(--mono);
  padding: 5px 12px 5px 11px; border-radius: var(--raio-p);
  background: var(--sunk); border: 1px solid var(--linha);
  border-left: 2px solid var(--bronze);
  display: flex; align-items: center; gap: 9px;
}
.acao::before { content: "—"; color: var(--bronze); }
.acao.falhou { color: var(--ambar); border-left-color: var(--ambar); }
.acao.falhou::before { content: ""; }

/* A coroa de louros aparece só aqui: quando algo entrou para a memória.
   É o único marco de verdade que a interface tem. */
.learned {
  display: inline-flex; align-items: center; gap: 9px; margin-top: 16px;
  font-size: 12.5px; color: var(--texto-suave);
  background: var(--marmore);
  border: 1px solid var(--linha-forte); border-radius: var(--raio);
  padding: 7px 15px 7px 12px;
}
.learned b { color: var(--texto); font-weight: 500; }
.learned::before {
  content: ""; width: 15px; height: 15px; flex: none;
  background: currentColor; color: var(--bronze);
  -webkit-mask: var(--louros) center/contain no-repeat;
  mask: var(--louros) center/contain no-repeat;
}

.error {
  border-left: 2px solid var(--ambar); padding: 12px 17px;
  background: var(--marmore);
  border-radius: 0 var(--raio-p) var(--raio-p) 0;
  color: var(--texto); font-size: 14px; white-space: pre-wrap;
}
.cursor::after {
  content: "▏"; color: var(--bronze); font-weight: 300;
  animation: piscar 1.2s steps(2) infinite;
}
@keyframes piscar { 50% { opacity: 0; } }

/* ── o átrio ─────────────────────────────────────────────────────────
   A tela inicial não é um painel de indicadores. É a entrada de uma casa:
   uma saudação, uma frase que diz o que merece atenção, e o acervo listado
   em ordem de importância. A prioridade aparece pela posição e pela
   hierarquia, não por uma fileira de crachás coloridos. */
.empty { padding: 44px 0 24px; }
.empty h2 {
  font-family: var(--serif); font-size: 33px; font-weight: 400;
  margin: 0 0 12px; color: var(--texto); letter-spacing: .005em;
  text-wrap: balance;
}
.empty p { color: var(--texto-suave); margin: 0 0 12px; max-width: 56ch; }
.empty code {
  font-family: var(--mono); font-size: .85em; color: var(--texto);
  background: var(--sunk); padding: 2px 6px; border-radius: var(--raio-p);
  border: 1px solid var(--linha);
}
.empty a { color: var(--azul); }

.atrio {
  margin: 28px 0 6px; border-top: 1px solid var(--linha);
}
.atrio-linha {
  display: grid; grid-template-columns: 1fr auto;
  align-items: baseline; gap: 16px;
  padding: 13px 2px; border-bottom: 1px solid var(--linha);
}
.atrio-linha .rot { font-size: 14.5px; color: var(--texto); }
.atrio-linha .rot small {
  display: block; font-size: 12.5px; color: var(--texto-fraco); margin-top: 1px;
}
.atrio-linha .qtd {
  font-family: var(--mono); font-size: 19px; font-weight: 500;
  color: var(--texto-suave); font-variant-numeric: tabular-nums;
}
/* O que espera decisão sua é o único item que muda de cor. Se tudo
   chamasse atenção, nada chamaria. */
.atrio-linha.decisao .qtd { color: var(--bronze); }
.atrio-linha.decisao .rot { color: var(--texto); font-weight: 500; }
.atrio-linha.vazia .qtd { color: var(--texto-fraco); opacity: .5; }

/* ─────────────────────── CAIXA DE ENVIO ─────────────────────── */

#composer { position: relative; z-index: 2; padding: 8px 0 26px; }
/* O arco pequeno: só nos cantos de cima, sugerindo a nascente de um arco.
   Embaixo a caixa assenta reta, como uma peça apoiada no chão. */
.box {
  display: flex; gap: 11px; align-items: flex-end;
  padding: 12px 12px 12px 18px; border-radius: var(--arco);
  background: var(--painel-alto);
  border: 1px solid var(--linha-forte);
  box-shadow: var(--sombra-baixa);
  transition: border-color .2s;
}
.box:focus-within { border-color: var(--bronze); }
#input {
  flex: 1; border: none; background: none; color: var(--texto);
  font-family: var(--sans); font-size: 15.5px; line-height: 1.6;
  resize: none; outline: none; max-height: 200px; padding: 4px 0;
}
#input::placeholder { color: var(--texto-fraco); }
#send {
  padding: 10px 21px; border-radius: var(--raio); flex: none;
  background: var(--metal); color: var(--metal-txt); font-size: 14px; font-weight: 500;
  letter-spacing: .02em; border: 1px solid var(--bronze-fosco);
  transition: filter .18s, transform .18s;
}
#send:hover:not(:disabled) { filter: brightness(1.09); }
#send:active:not(:disabled) { transform: translateY(1px); }
#send:disabled { opacity: .3; cursor: default; }

.hint { font-size: 11px; color: var(--texto-fraco); margin-top: 12px; padding-left: 4px; font-family: var(--mono); }
.hint code { font-family: var(--mono); color: var(--texto-suave); }

/* ─────────────────────── PAINEL DIREITO ─────────────────────── */

#panel {
  position: relative; z-index: 2;
  width: 348px; flex: none; display: flex; flex-direction: column;
  background: var(--painel);
  border-left: 1px solid var(--linha);
}
#panel.hidden { display: none; }

/* Seis abas não cabem na largura do painel. Rolar na horizontal é melhor
   que abreviar os nomes: "Exp." e "Conh." não dizem nada para quem abre a
   interface pela primeira vez. */
.tabs {
  display: flex; padding: 0 8px; border-bottom: 1px solid var(--linha);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; flex: 0 0 auto; padding: 16px 9px 13px; margin-bottom: -1px;
  font-size: 12px; font-weight: 400; letter-spacing: .02em; white-space: nowrap;
  color: var(--texto-fraco); transition: color .18s;
}
.tab:hover { color: var(--texto-suave); }
.tab.active { color: var(--texto); font-weight: 500; }
.tab.active::after {
  content: ""; position: absolute; left: 9px; right: 9px; bottom: 0; height: 1px;
  background: var(--bronze);
}

#docs { flex: 1; overflow-y: auto; padding: 16px; }

/* Medalhão da memória no topo da aba: um busto reduzido a linhas, dentro
   do mesmo anel de bronze da marca. É a metáfora do que aquela aba faz. */
.cerebro { display: flex; justify-content: center; padding: 10px 0 18px; }
.cerebro svg { width: 150px; height: auto; }

/* Placa de pedra: proporção larga, borda fina, superfície plana. Nada de
   elevação — ela está encostada na parede, não flutuando. */
.doc {
  background: var(--painel-alto);
  border: 1px solid var(--linha); border-radius: var(--raio-p);
  padding: 13px 15px; margin-bottom: 9px; font-size: 13.5px;
  transition: border-color .18s;
}
.doc:hover { border-color: var(--linha-forte); }
.doc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.doc-name { font-family: var(--mono); font-size: 11px; color: var(--bronze); letter-spacing: .02em; }
.doc .x { color: var(--texto-fraco); font-size: 16px; line-height: 1; }
.doc .x:hover { color: var(--bronze); }
.doc-desc { margin-top: 6px; line-height: 1.5; color: var(--texto); }
.doc-body { margin-top: 8px; color: var(--texto-suave); white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }
.doc-body.md { white-space: normal; }
.doc-body.md b { color: var(--texto); font-weight: 500; }
.doc-body.md p { margin: 0 0 6px; }
.doc-body.md p:last-child { margin-bottom: 0; }
.doc-body.md ul, .doc-body.md ol { margin: 4px 0 6px; padding-left: 18px; }

.none {
  color: var(--texto-fraco); font-size: 13.5px; text-align: center;
  padding: 34px 16px; line-height: 1.65;
}

/* Uma etiqueta só existe quando diz algo que o padrão não diz — memória
   global e ativa não ganha nenhuma, senão tudo vira ruído visual. */
.tag {
  display: inline-block; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 6px; border-radius: var(--raio-p); margin-right: 5px;
  border: 1px solid var(--linha-forte); color: var(--texto-fraco);
}
.tag.projeto { color: var(--azul); border-color: color-mix(in srgb, var(--azul) 45%, transparent); }
.tag.arquivada, .tag.superseded { opacity: .7; }
.tag.ok { color: var(--verde); border-color: color-mix(in srgb, var(--verde) 45%, transparent); }
.tag.falhou { color: var(--ambar); border-color: color-mix(in srgb, var(--ambar) 45%, transparent); }
.doc.inativa { opacity: .55; }
.doc-meta {
  margin-top: 8px; font-size: 11.5px; color: var(--texto-fraco);
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.doc-acoes { display: flex; gap: 6px; }
.mini {

  transition: color .18s, border-color .18s;
}
.mini:hover { color: var(--texto); border-color: var(--bronze); }
.mini.destaque { color: var(--bronze); border-color: var(--bronze); }

.indices { display: flex; gap: 14px; margin-top: 8px; font-size: 10.5px; font-family: var(--mono); }
.indice { display: flex; align-items: center; gap: 5px; color: var(--texto-fraco); }
.indice i { width: 4px; height: 4px; background: var(--texto-fraco); flex: none; }
.indice.pronto i { background: var(--verde); }
.indice.andando i { background: var(--bronze); }
.indice.falhou i { background: var(--ambar); }
.indice.pronto { color: var(--verde); }
.indice.andando { color: var(--bronze); }
.indice.falhou { color: var(--ambar); }

.aviso-painel {
  margin: 0 0 12px; padding: 12px 13px; font-size: 12.5px; line-height: 1.55;
  border: 1px solid var(--linha-forte); border-left-width: 2px;
  border-left-color: var(--bronze);
  border-radius: 0 var(--raio-p) var(--raio-p) 0;
  color: var(--texto-suave); background: var(--marmore);
}
.aviso-painel b { color: var(--texto); }
.tab .contador {
  display: inline-block; min-width: 15px; margin-left: 5px; padding: 0 4px;
  font-family: var(--mono); font-size: 9.5px; line-height: 15px;

}

.add { border-top: 1px solid var(--linha); padding: 15px 16px 17px; }
.add input, .add textarea {
  width: 100%; margin-bottom: 9px; padding: 10px 12px;
  font-family: var(--sans); font-size: 13.5px;
  border: 1px solid var(--linha); border-radius: var(--raio-p);
  background: var(--sunk); color: var(--texto); outline: none;
  transition: border-color .18s;
}
.add input::placeholder, .add textarea::placeholder { color: var(--texto-fraco); }
.add input:focus, .add textarea:focus { border-color: var(--bronze); }
.add textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.add button {
  width: 100%; padding: 11px; border-radius: var(--raio);
  background: var(--metal); color: var(--metal-txt); font-size: 13.5px; font-weight: 500;
  border: 1px solid var(--bronze-fosco);
  transition: filter .18s;
}
.add button:hover { filter: brightness(1.09); }

.persona { display: flex; flex-direction: column; height: 100%; }
.persona-ajuda {
  font-size: 12.5px; line-height: 1.6; color: var(--texto-suave);
  margin: 0 0 12px; padding: 12px 14px;
  background: var(--marmore); border: 1px solid var(--linha); border-radius: var(--raio-p);
}
.persona-ajuda b { color: var(--texto); font-weight: 500; }
#personaTxt {
  flex: 1; min-height: 262px; resize: vertical;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
  padding: 13px 14px; border: 1px solid var(--linha); border-radius: var(--raio-p);
  background: var(--sunk); color: var(--texto); outline: none;
}
#personaTxt:focus { border-color: var(--bronze); }
.persona-botoes { display: flex; gap: 9px; margin-top: 11px; }
.persona-botoes button {
  flex: 1; padding: 10px; border-radius: var(--raio); font-size: 13px; font-weight: 500;
  background: transparent; color: var(--texto-suave); border: 1px solid var(--linha-forte);
  transition: all .18s;
}
.persona-botoes button:hover { color: var(--texto); border-color: var(--bronze); }
.persona-botoes .primario {
  background: var(--metal); color: var(--metal-txt); border-color: var(--bronze-fosco);
}
.persona-botoes .primario:hover { color: var(--metal-txt); filter: brightness(1.09); }
.persona-aviso { font-size: 12.5px; color: var(--bronze); min-height: 20px; margin-top: 10px; text-align: center; }
.backup { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--linha); }

.btn-livro {
  width: 100%; padding: 12px; border-radius: var(--raio); font-size: 13.5px; font-weight: 500;
  background: var(--metal); color: var(--metal-txt); border: 1px solid var(--bronze-fosco);
  transition: filter .18s;
}
.btn-livro:hover { filter: brightness(1.09); }
.livro-status { font-size: 12.5px; margin-top: 10px; text-align: center; min-height: 20px; color: var(--texto-fraco); font-family: var(--mono); }
.livro-status.ativo { color: var(--bronze); }
.livro-status.erro { color: var(--ambar); text-align: left; line-height: 1.55; }

@media (max-width: 1080px) {
  #sidebar { display: none; }
  #panel { position: fixed; right: 0; top: 0; bottom: 0; z-index: 30;
           box-shadow: var(--sombra-alta); }
}

</style>
</head>
<body>

<aside id="sidebar">
  <div class="marca">
    <!-- Medalhão: um anel de bronze com uma chama de mármore dentro.
         Ela respira devagar quando a Livia está disponível, e o anel se
         reorganiza em traços girando enquanto ela pensa. O estado do
         sistema vira movimento, não um spinner colado num canto. -->
    <svg viewBox="0 0 48 48" aria-hidden="true" fill="none">
      <g class="anel-medalha">
        <circle cx="24" cy="24" r="21" stroke="var(--bronze)" stroke-width="1.1"/>
        <circle cx="24" cy="24" r="17.5" stroke="var(--bronze)" stroke-width=".6"
                opacity=".55" stroke-dasharray="2.6 5.2"/>
      </g>
      <!-- A chama: duas curvas que se fecham, com um vazio no meio. O
           vazio é o que a faz parecer luz e não uma gota. -->
      <g class="chama">
        <path d="M24 11c5.4 5.2 8 9.4 8 13.4 0 4.7-3.6 8.2-8 8.2s-8-3.5-8-8.2
                 c0-4 2.6-8.2 8-13.4z" fill="var(--texto)" opacity=".9"/>
        <path d="M24 19.5c2.4 2.9 3.5 5 3.5 6.9 0 2.2-1.6 3.8-3.5 3.8
                 s-3.5-1.6-3.5-3.8c0-1.9 1.1-4 3.5-6.9z" fill="var(--painel)"/>
      </g>
      <path d="M17 37h14" stroke="var(--bronze)" stroke-width="1" opacity=".7"/>
    </svg>
    <div class="marca-txt">
      <div class="brand" id="brand">LIVIA</div>
      <div class="online" id="conexao"><i></i>online</div>
    </div>
  </div>

  <button class="btn-new" onclick="novaConversa()">＋&nbsp;&nbsp;Nova conversa</button>
  <div class="secao">Conversas</div>
  <div id="convos"></div>

  <div class="foot">
    <span id="stats">—</span>
    <span>
      <button onclick="trocarTema()" id="btnTema" title="claro / escuro">claro</button>
      <button onclick="togglePanel()">painel</button>
    </span>
  </div>
</aside>

<main id="main">
  <!-- Geometria de mármore: arcos concêntricos, uma faixa de meandro e a
       silhueta incompleta de um busto. Atmosfera, não ilustração — se der
       para descrever o desenho olhando de relance, ele está forte demais.
       Os arcos giram devagar demais para o giro ser visto; nota-se que a
       posição mudou, nunca o movimento. -->
  <div id="arte" aria-hidden="true">
    <svg viewBox="0 0 900 620" preserveAspectRatio="xMidYMid slice" fill="none"
         stroke="var(--linha-forte)">

      <g class="arco-lento" opacity=".5">
        <circle cx="450" cy="310" r="248" stroke-width="1"/>
        <circle cx="450" cy="310" r="248" stroke-width="6" opacity=".28"
                stroke-dasharray="1 62" stroke-linecap="round"/>
      </g>
      <g class="arco-lento inverso" opacity=".42">
        <circle cx="450" cy="310" r="196" stroke-width=".8" stroke-dasharray="34 22"/>
      </g>
      <circle cx="450" cy="310" r="150" stroke-width=".8" opacity=".34"/>

      <!-- O busto interrompido: linha de perfil que começa e para, como
           uma peça que nunca foi terminada de talhar. -->
      <g opacity=".55" stroke-width="1.2" stroke-linecap="round">
        <path d="M414 424c0-52 8-84 8-116 0-16-12-24-12-46 0-40 24-64 54-64
                 s52 22 52 58c0 26-8 36-8 52 0 14 10 18 10 30"/>
        <path d="M400 424h108"/>
        <path d="M430 262c6-6 16-6 22 0" opacity=".7"/>
      </g>

      <!-- Faixa de meandro correndo na base. Uma citação grega só, e
           pequena: é assinatura, não cenário. -->
      <g opacity=".30" stroke-width="1.1">
        <path d="M120 512h22v-16h-14v-10h30v34h-22v-16h6"/>
        <path d="M196 512h22v-16h-14v-10h30v34h-22v-16h6"/>
        <path d="M272 512h22v-16h-14v-10h30v34h-22v-16h6"/>
        <path d="M614 512h22v-16h-14v-10h30v34h-22v-16h6"/>
        <path d="M690 512h22v-16h-14v-10h30v34h-22v-16h6"/>
      </g>

      <g opacity=".38" stroke-width=".9">
        <path d="M60 120h150M60 120v-40"/>
        <path d="M840 500h-150M840 500v40"/>
      </g>
    </svg>
  </div>

  <div id="thread">
    <div class="faixa-fora">
      A Livia não está respondendo. O servidor dela é um programa na sua
      máquina — abra o terminal e rode <code>python run.py</code>.<br>
      Enquanto isso, dá para ler as conversas e memórias que você já viu.
    </div>
    <div class="wrap" id="messages"></div>
  </div>

  <div id="composer">
    <div class="wrap">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Escreva aqui…"></textarea>
        <button id="send" onclick="enviar()">Enviar</button>
      </div>
      <div class="hint">Enter envia · Shift+Enter quebra linha · <code>/ajuda</code> lista os comandos</div>
    </div>
  </div>
</main>

<aside id="panel" class="hidden">
  <div class="tabs">
    <button class="tab active" data-kind="memories" onclick="trocarAba('memories')">Memórias</button>
    <button class="tab" data-kind="skills" onclick="trocarAba('skills')">Skills<span id="badgeSkills"></span></button>
    <button class="tab" data-kind="lessons" onclick="trocarAba('lessons')">Lições</button>
    <button class="tab" data-kind="experiencias" onclick="trocarAba('experiencias')">Experiências</button>
    <button class="tab" data-kind="livros" onclick="trocarAba('livros')">Livros</button>
    <button class="tab" data-kind="persona" onclick="trocarAba('persona')">Jeito</button>
  </div>
  <div id="docs"></div>
  <div class="add" id="addForm">
    <input id="dName" placeholder="nome curto (ex: prefere-postgres)">
    <input id="dDesc" placeholder="descrição em uma frase">
    <textarea id="dBody" placeholder="detalhes (opcional)"></textarea>
    <button onclick="salvarDoc()">Adicionar</button>
  </div>
</aside>

<script>
"use strict";

let conversaAtual = null;
let abaAtual = "memories";
let ocupado = false;
let nomeAssistente = "Livia";

const $ = (id) => document.getElementById(id);

/* ---------- markdown mínimo ---------- */
function escapar(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderizar(texto) {
  const blocos = [];
  // Tira blocos de código antes de qualquer outra coisa, para não mexer neles.
  let t = texto.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocos.push(`<pre><code>${escapar(code.replace(/\n$/, ""))}</code></pre>`);
    return `\n@@BLOCO${blocos.length - 1}@@\n`;
  });

  t = escapar(t);
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const linhas = t.split("\n");
  const out = [];
  let lista = null;

  const fecharLista = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };

  for (const linha of linhas) {
    const l = linha.trim();
    if (!l) { fecharLista(); continue; }

    if (/^@@BLOCO\d+@@$/.test(l)) { fecharLista(); out.push(l); continue; }

    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { fecharLista(); out.push(`<h3>${h[2]}</h3>`); continue; }

    if (l.startsWith("&gt;")) {
      fecharLista();
      out.push(`<blockquote>${l.slice(4).trim()}</blockquote>`);
      continue;
    }

    const ul = l.match(/^[-*]\s+(.*)$/);
    if (ul) {
      if (lista !== "ul") { fecharLista(); out.push("<ul>"); lista = "ul"; }
      out.push(`<li>${ul[1]}</li>`);
      continue;
    }

    const ol = l.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      if (lista !== "ol") { fecharLista(); out.push("<ol>"); lista = "ol"; }
      out.push(`<li>${ol[1]}</li>`);
      continue;
    }

    fecharLista();
    out.push(`<p>${l}</p>`);
  }
  fecharLista();

  return out.join("").replace(/@@BLOCO(\d+)@@/g, (_, i) => blocos[i]);
}

/* ---------- tema ---------- */
function aplicarTema(tema) {
  document.documentElement.dataset.theme = tema;
  localStorage.setItem("livia-tema", tema);
  const btn = $("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "escuro" : "claro";
  // O ícone da aba usa a cor de destaque, que muda com o tema.
  aplicarIdentidade(nomeAssistente);
}

function trocarTema() {
  aplicarTema(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}

/* ---------- identidade ---------- */
function aplicarIdentidade(nome) {
  nomeAssistente = (nome || "Livia").trim() || "Livia";
  document.title = nomeAssistente;
  $("brand").textContent = nomeAssistente;

  // Ícone da aba: um monograma gerado na hora, sem arquivo externo.
  // O mesmo medalhão da barra lateral, reduzido ao que sobrevive a 16
  // pixels: o anel de bronze e a letra. A chama some nesse tamanho, e
  // insistir nela viraria uma mancha.
  const letra = escapar(nomeAssistente[0].toUpperCase());
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
    '<circle cx="32" cy="32" r="29" fill="#1a1a18" stroke="#a9895a" stroke-width="3"/>' +
    '<circle cx="32" cy="32" r="23" fill="none" stroke="#a9895a" ' +
    'stroke-width="1" opacity=".5"/>' +
    `<text x="32" y="43" text-anchor="middle" fill="#ede9df"` +
    ` font-family="Georgia,serif" font-size="28">${letra}</text></svg>`;
  document.querySelector("link[rel=icon]").href =
    "data:image/svg+xml," + encodeURIComponent(svg);
}

/* ---------- mensagens ---------- */
function addMensagem(quem, texto) {
  const div = document.createElement("div");
  div.className = "msg " + quem;
  div.innerHTML =
    `<div class="who">${quem === "user" ? "Você" : escapar(nomeAssistente)}</div>` +
    `<div class="body">${renderizar(texto)}</div>`;
  $("messages").appendChild(div);
  descer();
  return div;
}

function descer() {
  const t = $("thread");
  t.scrollTop = t.scrollHeight;
}

/* ---------- ações ---------- */
// Cada ferramenta usada vira uma linha permanente na resposta. Ficam à vista
// de propósito: se ela mexeu num arquivo seu, você tem que saber qual.
function mostrarAcao(bolha, texto, falhou) {
  let lista = bolha.querySelector(".acoes");
  if (!lista) {
    lista = document.createElement("div");
    lista.className = "acoes";
    bolha.querySelector(".who").after(lista);
  }
  const linha = document.createElement("div");
  linha.className = "acao" + (falhou ? " falhou" : "");
  linha.textContent = texto;
  lista.appendChild(linha);
  descer();
}

/* ---------- web: status e fontes ---------- */
function mostrarStatus(bolha, texto, fixo) {
  let el = bolha.querySelector(".status");
  if (!el) {
    el = document.createElement("div");
    el.className = "status";
    bolha.querySelector(".who").after(el);
  }
  // "fixo" fica na tela depois da resposta (ex: qual provedor respondeu);
  // o resto é indicador de progresso e some quando o trabalho termina.
  el.classList.toggle("fixo", !!fixo);
  el.textContent = texto;
  descer();
}

function mostrarFontes(bolha, rotulo, urls, texto) {
  const status = bolha.querySelector(".status");
  if (status && !status.classList.contains("fixo")) status.remove();
  if (!urls || !urls.length) return;

  const box = document.createElement("div");
  box.className = "fontes";
  // "texto" = rotulos comuns (livro, pagina), nao enderecos clicaveis.
  const itens = urls.map((u) => {
    if (texto) return `<span class="fonte-txt">${escapar(u)}</span>`;
    let host = u;
    try { host = new URL(u).hostname.replace(/^www\./, ""); } catch {}
    return `<a href="${escapar(u)}" target="_blank" rel="noopener" title="${escapar(u)}">${escapar(host)}</a>`;
  }).join("");
  box.innerHTML = `<span class="fontes-rot">${escapar(rotulo)}</span>${itens}`;
  bolha.appendChild(box);
  descer();
}

// O átrio: a entrada da casa, não um painel de indicadores.
//
// Uma saudação, uma frase dizendo o que merece atenção, e o acervo listado
// em ordem de importância. A prioridade aparece pela POSIÇÃO e pela
// hierarquia — o que espera decisão vem primeiro e é a única linha que muda
// de cor. Se tudo chamasse atenção, nada chamaria.
//
// Nada aqui é inventado para encher a tela. A Livia não tem agenda, então
// não há "compromissos": um número que não vem de lugar nenhum é decoração
// fingindo ser informação.
let acervo = null;

function saudacao() {
  const h = new Date().getHours();
  if (h < 5)  return "Boa noite";
  if (h < 12) return "Bom dia";
  if (h < 19) return "Boa tarde";
  return "Boa noite";
}

function linhaAtrio(rot, nota, qtd, classe = "") {
  const vazia = !qtd ? " vazia" : "";
  return `
    <div class="atrio-linha${vazia} ${classe}">
      <span class="rot">${rot}<small>${nota}</small></span>
      <span class="qtd">${qtd}</span>
    </div>`;
}

function vazio() {
  const nome = (acervo && acervo.user) ? escapar(acervo.user) : "";
  const a = acervo || {};
  const decisoes = a.candidatas || 0;

  // A frase de abertura conta o que EXISTE agora. Sem nada guardado ela diz
  // isso, em vez de fingir um acervo que ninguém montou ainda.
  let chamada;
  if (decisoes) {
    chamada = `<b>${decisoes} skill(s)</b> esperando a sua decisão. `
            + "Elas estão na aba Skills do painel.";
  } else if (a.memories) {
    chamada = `Guardo ${a.memories} memória(s) sobre você. `
            + "Nada esperando decisão sua.";
  } else {
    chamada = "Ainda não sei nada sobre você — é assim que começa. "
            + "Converse um pouco e eu vou guardando.";
  }

  const linhas = acervo ? `
    <div class="atrio">
      ${decisoes ? linhaAtrio("Aguardando sua decisão",
          "skills que eu propus e você ainda não aprovou", decisoes, "decisao") : ""}
      ${linhaAtrio("Memórias", "o que sei sobre você e seus projetos", a.memories || 0)}
      ${linhaAtrio("Biblioteca", "documentos que eu consulto ao responder",
          (a.acervo && a.acervo.documentos) || 0)}
      ${linhaAtrio("Projetos", "pastas de código indexadas",
          (a.acervo && a.acervo.projetos) || 0)}
      ${linhaAtrio("Skills", "procedimentos que você me ensinou", a.skills || 0)}
      ${linhaAtrio("Lições", "o que concluí sozinha das minhas tentativas", a.lessons || 0)}
      ${linhaAtrio("Executado por mim", "ações que rodei nas conversas",
          (a.acervo && a.acervo.experiencias) || 0)}
    </div>` : "";

  $("messages").innerHTML = `
    <div class="empty">
      <h2>${saudacao()}${nome ? ", " + nome : ""}.</h2>
      <p>${chamada}</p>
      ${linhas}
      <p style="margin-top:22px">Pode colar um link, mandar um PDF, ou só
         começar a falar. <code>/ajuda</code> lista os comandos.</p>
    </div>`;
}

/* ---------- envio ---------- */
async function enviar() {
  if (ocupado) return;
  const input = $("input");
  const texto = input.value.trim();
  if (!texto) return;

  // Sem servidor não há resposta possível. Limpar o campo e mostrar um erro
  // genérico faria a pessoa perder o que escreveu por nada — o texto fica
  // onde está, e a explicação vem antes.
  if (!servidorDePe) {
    await conferirServidor();          // pode ter voltado desde a última checagem
    if (!servidorDePe) {
      const aviso = addMensagem("assistant", "");
      aviso.querySelector(".body").innerHTML =
        '<div class="error">A Livia não está rodando. O servidor dela é um ' +
        'programa na sua máquina: abra o terminal e rode <code>python run.py</code>.' +
        '<br><br>Sua mensagem continua no campo abaixo.</div>';
      descer();
      return;
    }
  }

  const inicial = $("messages").querySelector(".empty");
  if (inicial) inicial.remove();

  input.value = "";
  input.style.height = "auto";
  ocupado = true;
  $("send").disabled = true;

  addMensagem("user", texto);

  const bolha = addMensagem("assistant", "");
  const corpo = bolha.querySelector(".body");
  corpo.classList.add("cursor");
  let acumulado = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: texto, conversation_id: conversaAtual }),
    });

    if (!resp.ok || !resp.body) throw new Error("O servidor recusou a requisição.");

    const leitor = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.type === "delta") {
          acumulado += evt.text;
          corpo.innerHTML = renderizar(acumulado);
          descer();
        } else if (evt.type === "acao") {
          mostrarAcao(bolha, evt.texto, evt.falhou);
        } else if (evt.type === "status") {
          mostrarStatus(bolha, evt.text, evt.fixo);
        } else if (evt.type === "livros") {
          mostrarFontes(bolha, "dos seus livros", evt.trechos, true);
        } else if (evt.type === "sources") {
          mostrarFontes(bolha, evt.label, evt.urls);
        } else if (evt.type === "learned") {
          // Distinguir "gravei uma nova" de "isto desfez o que eu achava
          // antes" importa: a segunda é a que a pessoa vai querer conferir.
          const substituiu = evt.memories.filter((m) => m.substituiu);
          const nomes = evt.memories.map((m) => m.name).join(", ");
          const tag = document.createElement("div");
          tag.className = "learned";
          tag.innerHTML = substituiu.length
            ? `✓ atualizei <b>${escapar(nomes)}</b> — o que eu sabia antes ` +
              `(<b>${escapar(substituiu.map((m) => m.substituiu).join(", "))}</b>) ` +
              `ficou marcado como superado`
            : `✓ memorizei <b>${escapar(nomes)}</b>`;
          bolha.appendChild(tag);
          carregarDocs();
        } else if (evt.type === "done") {
          conversaAtual = evt.conversation_id;
          if (evt.stats) mostrarStats(evt.stats);
          carregarConversas();
        } else if (evt.type === "error") {
          corpo.innerHTML = `<div class="error">${escapar(evt.message)}</div>`;
        }
      }
    }
  } catch (e) {
    // TypeError de fetch = não chegou no servidor. Qualquer outra coisa é
    // erro de verdade, e o texto dele ajuda mais que uma mensagem genérica.
    const semServidor = e instanceof TypeError;
    if (semServidor) marcarConexao(false);
    corpo.innerHTML = semServidor
      ? '<div class="error">Perdi contato com o servidor da Livia no meio da ' +
        'resposta. Confira se o <code>python run.py</code> continua rodando.</div>'
      : `<div class="error">${escapar(e.message)}</div>`;
  } finally {
    corpo.classList.remove("cursor");
    ocupado = false;
    $("send").disabled = false;
    $("input").focus();
    descer();
  }
}

/* ---------- conversas ---------- */
function quando(iso) {
  // Hoje mostra a hora; ontem diz "ontem"; mais velho, a data curta.
  // Data absoluta em conversa de hoje não ajuda ninguém a se localizar.
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const agora = new Date();
  const dia = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dias = Math.round((dia(agora) - dia(d)) / 86400000);
  if (dias === 0) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (dias === 1) return "ontem";
  if (dias < 7) return `${dias}d`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

function novaConversa() {
  conversaAtual = null;
  vazio();
  carregarConversas();
  $("input").focus();
}

async function carregarConversas() {
  try {
    const r = await fetch("/api/conversations");
    veioDoCache(r);
    const { conversations } = await r.json();
    if (!conversations.length) {
      $("convos").innerHTML = '<div class="none" style="padding:20px 10px">Nenhuma ainda.</div>';
      return;
    }
    $("convos").innerHTML = conversations.map((c) => `
      <div class="convo ${c.id === conversaAtual ? "active" : ""}">
        <span class="t" onclick="abrirConversa(${c.id})" title="${escapar(c.title)}">${escapar(c.title)}</span>
        <span class="hora">${escapar(quando(c.updated_at))}</span>
        <button class="x" onclick="apagarConversa(${c.id})" title="apagar">×</button>
      </div>`).join("");
  } catch { /* servidor caiu; a lista só fica desatualizada */ }
}

async function abrirConversa(id) {
  const r = await fetch(`/api/conversations/${id}`);
  if (!r.ok) return;
  const { messages } = await r.json();
  conversaAtual = id;
  $("messages").innerHTML = "";
  messages.forEach((m) => addMensagem(m.role === "user" ? "user" : "assistant", m.content));
  carregarConversas();
}

async function apagarConversa(id) {
  await fetch(`/api/conversations/${id}`, { method: "DELETE" });
  if (id === conversaAtual) novaConversa();
  else carregarConversas();
}

/* ---------- biblioteca ---------- */
async function carregarLivros() {
  const dados = await (await fetch("/api/biblioteca")).json();
  const livros = dados.livros || [];
  const conhecimento = dados.conhecimento || { ligado: false, sem_grafo: 0 };

  // Vetores e grafo são índices DIFERENTES e podem estar em estados
  // diferentes. Mostrar só um faria o André reconstruir a coisa errada.
  const ESTADO_GRAFO = {
    ready:      ["pronto",  "pronto"],
    processing: ["andando", "construindo…"],
    pending:    ["andando", "na fila"],
    failed:     ["falhou",  "falhou"],
    outdated:   ["andando", "desatualizado"],
    disabled:   ["",        "desligado"],
  };

  function indices(l) {
    const vetorOk = !l.precisa_reconstruir;
    const [classe, rotulo] = ESTADO_GRAFO[l.knowledge] || ESTADO_GRAFO.disabled;
    const grafo = conhecimento.ligado
      ? `<span class="indice ${classe}"><i></i>Conhecimento: ${rotulo}</span>` : "";
    return `<div class="indices">
      <span class="indice ${vetorOk ? "pronto" : "falhou"}"><i></i>Vetores: ${
        vetorOk ? "pronto" : "reconstruir"}</span>
      ${grafo}
    </div>`;
  }

  const lista = livros.length
    ? livros.map((l) => `
        <div class="doc ${l.precisa_reconstruir ? "inativa" : ""}">
          <div class="doc-top">
            <span class="doc-name">${escapar(l.titulo)}</span>
            <button class="x" onclick="apagarLivro('${escapar(l.slug)}')" title="remover">×</button>
          </div>
          <div class="doc-body" style="margin-top:5px">
            ${l.tipo === "projeto"
              ? `${l.paginas} arquivos · ${l.trechos} trechos`
              : `${l.paginas} páginas · ${l.trechos} trechos`} · ${escapar(l.criado)}
          </div>
          ${indices(l)}
          ${l.precisa_reconstruir ? `
            <div class="doc-meta">
              <span>os vetores deste não batem com o gerador de agora</span>
              <button class="mini destaque"
                      onclick="reconstruir('${escapar(l.slug)}')">reindexar vetores</button>
            </div>` : ""}
          ${conhecimento.ligado && l.knowledge !== "ready" ? `
            <div class="doc-meta">
              <span class="doc-acoes">
                <button class="mini" onclick="reconstruirGrafo('${escapar(l.slug)}')">
                  reconstruir conhecimento</button>
              </span>
            </div>` : ""}
        </div>`).join("")
    : `<div class="none">Nenhum documento ainda.<br>Envie um arquivo ou importe uma pasta de projeto.</div>`;

  // Quando o gerador de vetores muda, TODO documento cai de uma vez. Oferecer
  // só o botão por documento faria o André clicar quinze vezes sem saber por
  // quê — e um documento não reindexado some da busca em silêncio.
  const desatualizados = livros.filter((l) => l.precisa_reconstruir);
  const refazer = desatualizados.length > 1
    ? `<p class="aviso-painel">
         <b>${desatualizados.length} documento(s) com vetores de outro gerador.</b>
         Eles ficam de fora da busca até serem reindexados — trocar o modelo de
         embedding torna os vetores antigos incomparáveis com os novos.
         <br><br>
         <button class="mini destaque" onclick="reindexarTudo()">reindexar todos</button>
         <span id="reindexStatus" class="livro-status"></span>
       </p>` : "";

  // Nada pesado começa sozinho: a interface OFERECE, o André decide.
  const faltando = conhecimento.ligado && conhecimento.sem_grafo
    ? `<p class="aviso-painel">
         <b>${conhecimento.sem_grafo} documento(s) ainda sem grafo de conhecimento.</b>
         Construir liga os conceitos entre documentos e permite perguntas do tipo
         "que relação existe entre X e Y". Leva alguns minutos por documento —
         por isso não começa sozinho.
         <br><br>
         <button class="mini destaque" onclick="construirConhecimento()">construir agora</button>
         <span id="grafoStatus" class="livro-status"></span>
       </p>` : "";

  // A lista de pastas só aparece quando há alguma: um botão que não leva a
  // lugar nenhum é pior que botão nenhum.
  let projetos = { pastas: [] };
  try { projetos = await (await fetch("/api/projetos")).json(); } catch {}
  const importaveis = (projetos.pastas || []).filter((p) => p.importavel);

  $("docs").innerHTML = `
    <p class="persona-ajuda">
      Ela não decora o documento. Quando você pergunta, ela procura os trechos
      que respondem e lê <b>aqueles</b> antes de responder — citando de onde
      veio. Aceita PDF, TXT, Markdown, DOCX, XLSX, CSV, JSON e HTML.
    </p>
    ${refazer}
    ${faltando}
    ${lista}
    <div style="margin-top:12px">
      <button class="btn-livro" onclick="$('arqLivro').click()">Enviar arquivo</button>
      <input type="file" id="arqLivro"
             accept=".pdf,.txt,.md,.markdown,.docx,.csv,.tsv,.json,.xlsx,.html"
             style="display:none" onchange="enviarLivro(this)">
      <div id="livroStatus" class="livro-status"></div>
    </div>
    ${importaveis.length ? `
      <p class="persona-ajuda" style="margin-top:16px">
        <b>Pastas da sua área de trabalho.</b> Importar indexa o código e a
        documentação do projeto. Dependências, build e arquivos de credencial
        ficam de fora — e linha que pareça ter chave é removida antes de entrar.
      </p>
      ${importaveis.map((p) => `
        <div class="doc">
          <div class="doc-top">
            <span class="doc-name">${escapar(p.nome)}</span>
            <button class="mini destaque"
                    onclick="importarProjeto('${escapar(p.nome)}')">importar</button>
          </div>
          <div class="doc-body" style="margin-top:5px">${p.arquivos} arquivos indexáveis</div>
        </div>`).join("")}` : ""}`;
}

async function importarProjeto(pasta) {
  const status = $("livroStatus");
  if (status) { status.className = "livro-status ativo"; status.textContent = "lendo a pasta…"; }

  const r = await fetch("/api/projetos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pasta }),
  });
  await consumirProgresso(r, status);
  carregarLivros();
}

async function reconstruirGrafo(slug) {
  const status = $("livroStatus");
  if (status) { status.className = "livro-status ativo"; status.textContent = "construindo o grafo…"; }
  const r = await fetch(`/api/conhecimento/${encodeURIComponent(slug)}/reconstruir`, {
    method: "POST",
  });
  const dados = await r.json();
  if (status) {
    status.className = dados.ok ? "livro-status" : "livro-status erro";
    status.textContent = dados.ok ? "conhecimento pronto." : (dados.error || "não deu.");
  }
  carregarLivros();
}

async function construirConhecimento() {
  const status = $("grafoStatus");
  if (status) { status.textContent = " construindo… isto leva alguns minutos."; }
  const r = await fetch("/api/conhecimento/processar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tudo: true }),
  });
  const dados = await r.json();
  if (status) {
    status.textContent = dados.error
      ? ` ${dados.error}`
      : ` ${dados.feitos} pronto(s), ${dados.falhos} falhou(aram), ${dados.restantes} na fila.`;
  }
  carregarLivros();
}

async function reindexarTudo() {
  // Um de cada vez, de propósito: com modelo local, paralelizar isto só
  // enfileira no Ollama e tira do André a noção de progresso.
  const status = $("reindexStatus");
  const livros = await (await fetch("/api/biblioteca")).json();
  const pendentes = (livros.livros || []).filter((l) => l.precisa_reconstruir);

  for (let i = 0; i < pendentes.length; i++) {
    if (status) status.textContent = ` ${i + 1} de ${pendentes.length}: ${pendentes[i].titulo}…`;
    try {
      const r = await fetch(
        `/api/biblioteca/${encodeURIComponent(pendentes[i].slug)}/reindexar`,
        { method: "POST" },
      );
      await consumirProgresso(r, null);
    } catch {
      // Um documento que falha não pode parar a fila: o próximo pode dar certo,
      // e o que sobrar continua marcado na lista.
    }
  }
  if (status) status.textContent = " pronto.";
  carregarLivros();
}

async function reconstruir(slug) {
  const status = $("livroStatus");
  if (status) { status.className = "livro-status ativo"; status.textContent = "reconstruindo…"; }
  const r = await fetch(`/api/biblioteca/${encodeURIComponent(slug)}/reindexar`, {
    method: "POST",
  });
  await consumirProgresso(r, status);
  carregarLivros();
}

// O mesmo laço de SSE que o envio de arquivo usa. Três cópias disto era o
// caminho garantido para as três divergirem.
async function consumirProgresso(resposta, status) {
  const leitor = resposta.body.getReader();
  const dec = new TextDecoder();
  let buffer = "";

  while (true) {
    const { done, value } = await leitor.read();
    if (done) break;
    buffer += dec.decode(value, { stream: true });
    const partes = buffer.split("\n\n");
    buffer = partes.pop();

    for (const parte of partes) {
      if (!parte.startsWith("data: ")) continue;
      const evt = JSON.parse(parte.slice(6));
      if (!status) continue;
      if (evt.etapa === "erro") {
        status.className = "livro-status erro";
        status.textContent = evt.texto;
      } else if (evt.etapa === "pronto") {
        status.className = "livro-status";
        status.textContent = evt.livro && evt.livro.segredos_removidos
          ? `pronto — ${evt.livro.segredos_removidos} linha(s) com credencial foram deixadas de fora`
          : "pronto.";
      } else {
        status.textContent = evt.texto || "";
      }
    }
  }
}

async function apagarLivro(slug) {
  await fetch(`/api/biblioteca/${encodeURIComponent(slug)}`, { method: "DELETE" });
  carregarLivros();
}

async function enviarLivro(input) {

      body: arquivo,
    });
    if (!r.body) throw new Error("o servidor não respondeu");

    const leitor = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const partes = buffer.split("\n\n");
      buffer = partes.pop() || "";

      for (const parte of partes) {
        const linha = parte.split("\n").find((l) => l.startsWith("data:"));
        if (!linha) continue;
        let evt;
        try { evt = JSON.parse(linha.slice(5).trim()); } catch { continue; }

        if (evt.etapa === "erro") {
          status.className = "livro-status erro";
          status.textContent = evt.texto;
          return;
        }
        if (evt.etapa === "pronto") {
          status.className = "livro-status";
          status.textContent = "";
          carregarLivros();
          return;
        }
        status.textContent = evt.texto || evt.etapa;
      }
    }
  } catch (e) {
    status.className = "livro-status erro";
    status.textContent = e.message;
  }
}

function avisarPersona(msg) {
  const el = $("personaAviso");
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 3000);
}

async function salvarPersona() {
  const text = $("personaTxt").value;
  const r = await fetch("/api/persona", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const data = await r.json();
  if (!r.ok) { avisarPersona(data.error || "não deu para salvar"); return; }
  avisarPersona("Salvo. Vale já na próxima mensagem.");
}

async function restaurarPersona() {
  const r = await fetch("/api/persona", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ reset: true }),
  });
  const { text } = await r.json();
  $("personaTxt").value = text;
  avisarPersona("Voltou ao padrão.");
}

/* ---------- backup ---------- */
function baixarBackup() {
  // O navegador cuida do download; nada precisa passar pelo JS.
  window.location.href = "/api/backup";
  avisarPersona("Baixando…");
}

async function enviarBackup(input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  input.value = "";
  avisarPersona("Restaurando…");

  const r = await fetch("/api/backup", { method: "POST", body: arquivo });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { avisarPersona(d.error || "não deu para restaurar"); return; }

  const c = d.restaurado || {};
  avisarPersona(`Restaurado: ${c.memorias || 0} memórias, ${c.skills || 0} skills.`);
  if (d.stats) mostrarStats(d.stats);
  carregarConversas();
}

const VAZIO = {
  memories: "Nada memorizado ainda.<br>Conversem um pouco — ela guarda sozinha.",
  skills: "Nenhuma skill ensinada.<br>Use o formulário abaixo.",
  lessons: "Nenhuma lição ainda.<br>Elas nascem quando um padrão se repete nas experiências.",
};

// Uma etiqueta só aparece quando diz algo que o padrão não diz. Memória
// global e ativa não ganha nenhuma — senão toda linha vira ruído.
function etiquetas(d) {
  const partes = [];
  if (d.scope && d.scope !== "global") {
    partes.push(`<span class="tag projeto">${escapar(d.scope.replace("project:", ""))}</span>`);
  }
  if (d.status === "superseded") {
    partes.push(`<span class="tag superseded">substituída</span>`);
  } else if (d.status === "archived") {
    partes.push(`<span class="tag arquivada">arquivada</span>`);
  }
  if (d.importance >= 0.9) partes.push(`<span class="tag">sempre</span>`);
  return partes.join("");
}

// Cortar no meio de um `**` deixaria asterisco solto na tela. Cortamos na
// última quebra de linha antes do limite.
function cortar(texto, limite) {
  if (texto.length <= limite) return texto;
  const pedaco = texto.slice(0, limite);
  const quebra = pedaco.lastIndexOf("\n");
  return (quebra > limite * 0.4 ? pedaco.slice(0, quebra) : pedaco) + "\n\n…";
}

function cartaoDoc(d) {
  const inativa = d.status && d.status !== "active";
  const acao = inativa
    ? `<button class="mini" onclick="mudarDoc('${escapar(d.name)}','reativar')">reativar</button>`
    : `<button class="mini" onclick="mudarDoc('${escapar(d.name)}','arquivar')">arquivar</button>`;
  const origem = d.superseded_by
    ? `substituída por <b>${escapar(d.superseded_by)}</b>`
    : (d.source ? escapar(d.source) : "");

  return `
    <div class="doc ${inativa ? "inativa" : ""}">
      <div class="doc-top">
        <span class="doc-name">${escapar(d.name)}</span>
        <button class="x" onclick="apagarDoc('${escapar(d.name)}')" title="apagar de vez">×</button>
      </div>
      <div class="doc-desc">${etiquetas(d)}${escapar(d.description)}</div>
      ${d.body.trim() ? `<div class="doc-body md">${renderizar(cortar(d.body.trim(), 420))}</div>` : ""}
      <div class="doc-meta">
        <span>${origem || escapar(d.kind || "")}</span>
        <span class="doc-acoes">
          ${acao}
          <button class="mini" onclick="verOrigem('${escapar(d.name)}')">origem</button>
        </span>
      </div>
    </div>`;
}

// Skills candidatas: o ponto de controle humano. Ficam no topo da aba de
// skills, porque é lá que a pessoa vai procurar por elas.
async function blocoCandidatas() {
  if (abaAtual !== "skills") return "";
  try {
    const { candidatas } = await (await fetch("/api/candidatas")).json();
    if (!candidatas.length) return "";
    return `
      <p class="aviso-painel">
        <b>${candidatas.length} skill(s) que ela deduziu sozinha</b> a partir de
        procedimentos que deram certo várias vezes. Nada disso entra nas
        respostas antes de você aprovar.
      </p>
      ${candidatas.map((c) => `
        <div class="doc">
          <div class="doc-top">
            <span class="doc-name">${escapar(c.nome)}</span>
            <span class="tag">confiança ${c.confianca}</span>
          </div>
          <div class="doc-desc">${escapar(c.descricao)}</div>
          <div class="doc-body">${escapar(c.passos)}</div>
          <div class="doc-meta">
            <span>${(c.evidencia || []).length} experiência(s)</span>
            <span class="doc-acoes">
              <button class="mini destaque" onclick="decidirCandidata(${c.id},'aprovar')">aprovar</button>
              <button class="mini" onclick="decidirCandidata(${c.id},'rejeitar')">rejeitar</button>
            </span>
          </div>
        </div>`).join("")}`;
  } catch { return ""; }
}

async function carregarDocs() {
  if (abaAtual === "persona" || abaAtual === "experiencias") return;
  try {
    const r = await fetch(`/api/store/${abaAtual}`);
    const { items } = await r.json();
    const topo = (abaAtual === "memories" ? CEREBRO : "") + (await blocoCandidatas());
    if (!items.length) {
      $("docs").innerHTML = topo + `<div class="none">${VAZIO[abaAtual] || ""}</div>`;
      return;
    }
    $("docs").innerHTML = topo +
      (abaAtual === "memories" ? botaoManutencao() : "") +
      items.map(cartaoDoc).join("");
  } catch { /* idem */ }
}

function botaoManutencao() {
  return `<div style="margin-bottom:12px;text-align:center">
    <button class="mini" onclick="manutencao(false)">revisar memória</button>
    <span id="manutencaoStatus" class="livro-status"></span>
  </div>`;
}

async function manutencao(aplicar) {
  const alvo = $("manutencaoStatus");
  if (alvo) alvo.textContent = "revisando…";
  const r = await fetch("/api/manutencao", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ aplicar }),
  });
  const rel = await r.json();
  const total = (rel.duplicatas || []).length + (rel.obsoletas || []).length;

  if (!alvo) return;
  if (aplicar) {
    alvo.textContent = "pronto.";
    carregarDocs();
    return;
  }
  if (!total) { alvo.textContent = "nada a arrumar."; return; }

  alvo.innerHTML = `${(rel.duplicatas || []).length} duplicata(s), ` +
    `${(rel.obsoletas || []).length} sem uso. ` +
    `<button class="mini destaque" onclick="manutencao(true)">arrumar</button>`;
}

async function mudarDoc(nome, acao) {
  await fetch(`/api/store/${abaAtual}/${encodeURIComponent(nome)}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ acao }),
  });
  carregarDocs();
}

async function verOrigem(nome) {
  const r = await fetch(`/api/store/${abaAtual}/${encodeURIComponent(nome)}`);
  if (!r.ok) return;
  const { item, indice } = await r.json();
  const usada = indice.usado_em ? quando(indice.usado_em) : "nunca";
  alert(
    `${item.name}\n\n` +
    `${item.description}\n\n` +
    `origem: ${item.source || "não registrada"}\n` +
    `escopo: ${item.scope}\n` +
    `criada: ${item.created || "?"}\n` +
    `usada: ${indice.usos}x — última vez ${usada}`
  );
}

async function decidirCandidata(id, acao) {
  await fetch(`/api/candidatas/${id}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ acao }),

  carregarDocs();
  atualizarBadges();
}

async function carregarExperiencias() {
  try {
    const { experiencias, resumo } = await (await fetch("/api/experiencias")).json();
    if (!experiencias.length) {
      $("docs").innerHTML = `<div class="none">
        Nada registrado ainda.<br>

    const cartoes = experiencias.map((e) => {

          ? `<span class="tag falhou">falhou</span>`

      return `

        Só evidência conta como sucesso: ferramenta que rodou, ou você confirmando.
        Ela não marca acerto por ter respondido bonito.
      </p>
      ${cartoes}`;
  } catch { /* idem */ }
}

async function apagarExperiencia(id) {
  await fetch(`/api/experiencias/${id}`, { method: "DELETE" });
  carregarExperiencias();
}

async function atualizarBadges() {
  try {
    const s = await (await fetch("/api/status")).json();
    const badge = $("badgeSkills");
    if (badge) {
      badge.innerHTML = s.candidatas
        ? `<span class="contador">${s.candidatas}</span>` : "";
    }
  } catch { /* enfeite */ }
}

async function salvarDoc() {
  const name = $("dName").value.trim();
  const description = $("dDesc").value.trim();
  const body = $("dBody").value;
  if (!name || !description) {
    alert("Nome e descrição são obrigatórios.");
    return;
  }
  const r = await fetch(`/api/store/${abaAtual}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, description, body }),
  });
  if (r.ok) {
    const { stats } = await r.json();
    $("dName").value = $("dDesc").value = $("dBody").value = "";
    mostrarStats(stats);
    carregarDocs();
  }
}

async function apagarDoc(name) {
  const r = await fetch(`/api/store/${abaAtual}/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (r.ok) {
    const { stats } = await r.json();
    mostrarStats(stats);
  }
  carregarDocs();
}

function mostrarStats(s) {
  const plural = (n, um, muitos) => `${n} ${n === 1 ? um : muitos}`;
  const partes = [
    plural(s.memories, "memória", "memórias"),
    plural(s.skills, "skill", "skills"),
  ];
  if (s.lessons) partes.push(plural(s.lessons, "lição", "lições"));
  $("stats").textContent = partes.join(" · ");
}

/* ---------- aplicativo instalável e estado da conexão ---------- */

// A diferença entre "sem internet" e "sem servidor" importa aqui. O
// navigator.onLine só sabe da PRIMEIRA, e para a Livia ela quase nunca é a
// relevante: o servidor é local, então dá para estar sem internet nenhuma e
// tudo funcionar. Quem manda é o /saude.
let servidorDePe = true;

function marcarConexao(dePe, doCache) {
  servidorDePe = dePe;
  document.body.classList.toggle("sem-servidor", !dePe);
  const alvo = $("conexao");
  if (!alvo) return;
  alvo.classList.toggle("fora", !dePe);
  alvo.lastChild.textContent = dePe ? "online" : (doCache ? "lendo do cache" : "sem servidor");
}

async function conferirServidor() {
  try {
    // cache: no-store para não medir o cache em vez do servidor.
    const r = await fetch("/saude", { cache: "no-store" });
    marcarConexao(r.ok);
  } catch {
    marcarConexao(false);
  }
}

// Toda resposta que veio do cache do worker vem marcada. Mostrar dado velho
// sem dizer que é velho seria a interface mentindo com cara de verdade.
function veioDoCache(resposta) {
  if (resposta && resposta.headers && resposta.headers.get("X-Livia-Cache")) {
    marcarConexao(false, true);
    return true;
  }
  return false;
}

async function registrarApp() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
    // Versão nova do app: assume na hora, em vez de esperar todas as abas
    // fecharem. Sem isto, uma correção pode levar dias para chegar.
    reg.addEventListener("updatefound", () => {
      const novo = reg.installing;
      if (!novo) return;
      novo.addEventListener("statechange", () => {
        if (novo.state === "installed" && navigator.serviceWorker.controller) {
          novo.postMessage("atualizar");
        }
      });
    });
  } catch {
    // Service worker não registra fora de contexto seguro — acessar por IP
    // da rede (http://192.168.x.x) é o caso comum. A Livia continua
    // funcionando inteira; só não instala como aplicativo.
  }
}

/* ---------- início ---------- */
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});

(async function iniciar() {
  registrarApp();
  conferirServidor();
  // Voltar de segundo plano é quando mais provavelmente algo mudou: a
  // máquina dormiu, o servidor caiu, o Ctrl+C aconteceu.
  window.addEventListener("online", conferirServidor);
  window.addEventListener("offline", () => marcarConexao(false));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) conferirServidor();
  });

  // Padrão de fábrica: escuro. O Nero Marquina é o mármore que sustenta o
  // escuro. A variante clara existe e é a mesma identidade sob luz do dia.
  aplicarTema(localStorage.getItem("livia-tema") || "dark");
  vazio();
  carregarConversas();
  carregarDocs();
  try {
    const resposta = await fetch("/api/status");
    const s = await resposta.json();
    veioDoCache(resposta);
    aplicarIdentidade(s.name);
    // Com os números na mão, o átrio se redesenha. Antes disso ele já
    // apareceu com a saudação — texto na tela vale mais que tela em branco
    // esperando uma chamada que pode nem voltar.
    acervo = s;
    if (!conversaAtual) vazio();
    mostrarStats(s);
    atualizarBadges();
    if (!s.has_key) {
      // "sem chave" deixou de ser a única forma de estar sem provedor: com o
      // Ollama ligado a Livia funciona sem chave nenhuma, então o aviso
      // precisa oferecer os dois caminhos.
      $("messages").innerHTML = `
        <div class="empty">
          <h2>Nenhum provedor configurado</h2>
          <p>Dois caminhos, os dois de graça:</p>
          <p><b>Local</b> — instale o <a href="https://ollama.com" target="_blank" rel="noopener">Ollama</a>,
             rode <code>ollama pull qwen3:8b</code> e ponha <code>LIVIA_OLLAMA=1</code> no <code>.env</code>.
             Nada sai da sua máquina.</p>
          <p><b>Nuvem</b> — pegue uma chave gratuita em
             <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>,
             copie <code>.env.example</code> para <code>.env</code> e cole em <code>GEMINI_API_KEY</code>.</p>
          <p>Depois reinicie o servidor.</p>
        </div>`;
    }
  } catch { /* status é enfeite; a interface funciona sem */ }
  $("input").focus();
})();
</script>
